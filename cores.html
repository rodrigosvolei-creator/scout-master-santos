<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RS-Scout · Mini Minis - Cores</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Paleta da marca RS Voleibol — a mesma do site institucional.
   --acc (magenta) substitui o dourado, que nao era cor da RS.
   Verde/vermelho/laranja NAO mudam: sao semanticos (acerto, erro, atencao). */
:root{
  --bg1:#170a1e;--bg2:#241030;--bg3:#0f0614;
  --fg:#f7eef5;--mute:rgba(247,238,245,.66);--faint:rgba(247,238,245,.36);
  --card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--brd:rgba(255,255,255,.13);
  --acc:#FF4D9D;--acc2:#A93FC0;--acc-ink:#2A0A1A;
  --green:#059669;--red:#dc2626;--orange:#ea580c;--blue:#2563eb;--gray:#64748b;
  --leao:.05;              /* forca da marca d'agua do leao */
  --sombra:rgba(0,0,0,.45);
}
/* Tema CLARO — para notebook em ginasio iluminado. */
body.claro{
  --bg1:#ffffff;--bg2:#FCF4F8;--bg3:#F6E8F0;
  --fg:#2A0A1A;--mute:#5a2a44;--faint:rgba(42,10,26,.45);
  --card:rgba(216,27,121,.045);--card2:rgba(216,27,121,.09);--brd:rgba(216,27,121,.18);
  --acc:#D81B79;--acc2:#8B2FA0;--acc-ink:#ffffff;
  --leao:.045;
  --sombra:rgba(216,27,121,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(70% 50% at 50% -5%, rgba(216,27,121,.12), transparent 60%),
    radial-gradient(60% 45% at 50% 110%, rgba(139,47,160,.12), transparent 60%),
    linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed}
/* MARCA D'AGUA — o leao ao fundo, fixo, atras de tudo e sem capturar toque.
   Fica FORA da mesa do operador (body.trabalho): ali a tela e ferramenta,
   qualquer coisa competindo com os cards atrapalha quem esta marcando. */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:url("rs-leao.png") no-repeat right -6vw bottom -8vh;
  background-size:auto 78vh;opacity:var(--leao);
  filter:saturate(1.1)}
body.trabalho::before{opacity:0}
#app{position:relative;z-index:1}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}

/* ---- header ---- */
.hd{position:sticky;top:0;z-index:40;background:rgba(15,6,20,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--brd)}
.hd-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.hd-ti{font-family:'Cinzel',serif;font-weight:700;font-size:17px;letter-spacing:.1em;line-height:1.15;
  text-transform:uppercase;
  background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hd-sub{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.32em;color:var(--faint);font-weight:600;margin-top:3px}
.hd-marca{display:flex;align-items:center;gap:11px;min-width:0}
.hd-marca img{height:34px;width:auto;flex-shrink:0}
.hd-tema{background:transparent;border:1px solid var(--brd);border-radius:99px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:.15s}
.hd-tema:hover{background:var(--card2);border-color:var(--acc)}
.hd-nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.hd-nav a{font-size:11px;font-weight:700;letter-spacing:.6px;text-decoration:none;color:var(--mute);
  padding:8px 12px;border-radius:9px;border:1px solid transparent;transition:.13s}
.hd-nav a:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.hd-nav a.on{color:var(--acc-ink);background:var(--acc);border-color:var(--acc)}

/* ---- blocos ---- */
h2.sec{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:2px;margin:26px 0 12px;color:var(--fg)}
.card{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:16px;margin-bottom:12px}
.muted{color:var(--mute)}.faint{color:var(--faint)}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--brd);border-radius:10px;padding:10px 15px;
  font-weight:700;font-size:13px;transition:.13s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dgr{background:rgba(220,38,38,.18);border-color:rgba(220,38,38,.45);color:#fca5a5}
.btn.sm{padding:6px 11px;font-size:11px;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:10px;letter-spacing:1.2px;font-weight:800;color:var(--faint)}
.fld input,.fld select{background:rgba(0,0,0,.28);border:1px solid var(--brd);border-radius:9px;padding:9px 11px;width:100%}
.fld input[type=color]{padding:3px;height:40px;cursor:pointer}
.grid{display:grid;gap:10px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1px;
  padding:4px 9px;border-radius:99px;border:1px solid var(--brd)}
.dot{width:12px;height:12px;border-radius:99px;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.14)}
.crest{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);
  box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.22)}
.crest.lg{width:60px;height:60px;font-size:26px;border-radius:16px}
.crest.xl{width:96px;height:96px;font-size:42px;border-radius:22px}

/* ---- mural de jogos ---- */
.gcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--brd);
  border-radius:14px;padding:14px 16px;margin-bottom:10px;transition:.13s}
.gcard:hover{background:var(--card2)}
.gcard.live{border-color:rgba(220,38,38,.5);background:rgba(220,38,38,.08)}
.gc-vs{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.gc-nm{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1.4px;line-height:1}
.gc-sc{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;min-width:78px;text-align:center}
.gc-meta{font-size:11px;color:var(--faint);font-weight:600}
.pill{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.14em;padding:3px 8px;border-radius:99px}
.pill.live{background:var(--red);color:#fff;animation:pulse 1.8s infinite}
.pill.fim{background:rgba(255,255,255,.1);color:var(--mute)}
.pill.age{background:rgba(37,99,235,.22);color:#93c5fd}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ---- MESA (scout) ---- */
.mesa-top{display:flex;align-items:stretch;gap:12px;margin:14px 0;flex-wrap:wrap}
.mesa-side{flex:1;min-width:200px;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;
  border:2px solid transparent;transition:.15s}
.mesa-side.mine{border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,77,157,.13)}
.mesa-side .pts{margin-left:auto;font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:.9}
.mesa-side .nm{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.4px;line-height:1.05}
.mesa-side .sub{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.14em;opacity:.75}
.serve-badge{font-size:10px;font-weight:900;letter-spacing:1px;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:99px;display:inline-block;margin-top:4px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;margin-bottom:6px}
.pbtn{background:var(--card);border:2px solid var(--brd);border-radius:13px;padding:12px 10px;text-align:left;
  display:flex;align-items:center;gap:10px;transition:.12s;position:relative;overflow:hidden}
.pbtn:hover{background:var(--card2)}
.pbtn.on{border-color:var(--acc);background:rgba(255,77,157,.15);box-shadow:0 0 0 3px rgba(255,77,157,.14)}
.pbtn.serving::after{content:"🏐";position:absolute;top:5px;right:7px;font-size:13px}
.pbtn .nu{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:16px;flex-shrink:0;color:#fff}
.pbtn .pn{font-weight:800;font-size:13px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn .pr{font-size:9px;color:var(--faint);font-weight:700;letter-spacing:.6px}
.pbtn.bench{opacity:.62;padding:8px 9px}
.pbtn.bench .nu{width:24px;height:24px;font-size:13px}

.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.fbox{border:1px solid var(--brd);border-radius:13px;overflow:hidden;background:rgba(0,0,0,.2)}
.fbox .fh{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.6px;padding:7px 11px;color:#fff}
.fbox .fb{display:flex;gap:5px;padding:7px;flex-wrap:wrap}
.fbox .fb button{flex:1;min-width:52px;border-radius:9px;padding:13px 4px;font-weight:900;font-size:13px;
  color:#fff;transition:.1s;letter-spacing:.4px}
.fbox .fb button:hover{filter:brightness(1.18)}
.fbox .fb button:active{transform:scale(.95)}
.needp .fgrid{opacity:.42;pointer-events:none;filter:grayscale(.5)}

.feed{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
.fitem{display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 10px;border-radius:9px;background:rgba(0,0,0,.22)}
.fitem b{font-weight:800}
.fitem .oc{font-weight:900;font-size:11px;padding:2px 7px;border-radius:6px;color:#fff}
.fitem.dup{opacity:.55}
.ladder{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.ladder i{width:11px;height:16px;border-radius:3px;display:block}

/* ---- rotulo secundario das secoes (era ilegivel: 12px no cinza mais fraco) ---- */
h2.sec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.sec .sec-sub{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.2px;
  color:var(--mute);text-transform:none}
h2.sec .sec-sub::before{content:"· "}

/* ---- escolha da equipe do aparelho ---- */
.pickteam{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pickteam-btn{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,transparent),rgba(255,255,255,.04));
  border:2px solid var(--c);border-radius:20px;padding:26px 18px;display:flex;flex-direction:column;
  align-items:center;gap:8px;transition:.15s}
.pickteam-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
.pickteam-nm{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;line-height:1}
.pickteam-sub{font-size:12px;color:var(--mute);font-weight:600}
.pickteam-cta{margin-top:6px;font-size:10px;font-weight:900;letter-spacing:1.6px;color:var(--c);
  background:rgba(255,255,255,.08);padding:7px 14px;border-radius:99px}

/* ---- placar ---- */
.mesa-side{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,transparent),rgba(255,255,255,.03))}
.mesa-side.serving{box-shadow:inset 0 0 0 1px rgba(255,77,157,.35)}
.mesa-id{min-width:0;flex:1}
.mesa-side .pts{font-variant-numeric:tabular-nums;text-shadow:0 3px 14px rgba(0,0,0,.45)}

/* ---- passos do setup ---- */
.step{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.step.done{border-color:rgba(5,150,105,.42);background:rgba(5,150,105,.07)}
.step-hd{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;margin-bottom:8px}
.step-n{width:24px;height:24px;border-radius:99px;background:var(--acc);color:var(--acc-ink);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
.step.done .step-n{background:var(--green);color:#fff}
.step-ok{margin-left:auto;font-size:11px;font-weight:800;color:#6ee7b7;letter-spacing:.5px}
.step-hint{font-size:12px;color:var(--mute);line-height:1.55;margin-top:8px}
.teamchoice{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;padding:13px 18px;
  border-radius:12px;border:2px solid var(--brd);background:rgba(255,255,255,.05);transition:.13s}
.teamchoice:hover{background:rgba(255,255,255,.1)}
.teamchoice.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 24%,transparent)}

/* ---- posicoes 1..N da ordem de saque ---- */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:12px 0}
.slot{display:flex;align-items:center;gap:10px;border-radius:13px;padding:14px 13px;min-height:58px;
  border:2px dashed var(--brd);background:rgba(0,0,0,.2);transition:.13s}
.slot.filled{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);cursor:pointer}
.slot.filled:hover{filter:brightness(1.15)}
.slot-n{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.14);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:17px}
.slot.filled .slot-n{background:rgba(0,0,0,.35)}
.slot-nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-empty{font-size:12px;color:var(--faint);font-weight:600}
.slot-x{margin-left:auto;font-size:16px;color:var(--mute);font-weight:900}

/* ---- elenco disponivel ---- */
.pool{display:flex;flex-wrap:wrap;gap:8px}
.poolp{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:8px 14px 8px 8px;
  border-radius:99px;border:1px solid var(--brd);background:rgba(255,255,255,.06);transition:.13s}
.poolp:hover:not(:disabled){background:rgba(255,255,255,.13);border-color:var(--c)}
.poolp.used{opacity:.32;cursor:default}
.poolp-nu{width:26px;height:26px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:14px;color:#fff;flex-shrink:0}

/* ---- reservas / substituicao ---- */
.benchrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:rgba(0,0,0,.2);
  border:1px solid var(--brd);border-radius:13px;padding:10px 14px;margin-top:10px}
.benchlb{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--faint)}
.benchp{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--mute)}
.benchrow .btn{margin-left:auto}
.subbar{background:rgba(255,77,157,.12);border:1px solid rgba(255,77,157,.4);border-radius:13px;
  padding:13px 15px;margin-top:10px;font-size:13px}

/* ---- cards dos atletas ---- */
.pbtn{padding:12px 13px;gap:12px}
.pbtn .pos{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:19px;color:#fff;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.pbtn .pn{font-size:14px}
.pbtn .pr{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.5px;margin-top:2px}
.pbtn .pr .saca{color:var(--acc);letter-spacing:.8px}
.pbtn .pr .sai{color:#fca5a5;letter-spacing:.8px}
.pbtn .camisa{opacity:.65}
.pbtn.serving{border-color:var(--acc);background:rgba(255,77,157,.1)}
.pbtn.serving::after{content:none}
.pbtn.subpick{border-style:dashed}
.pbtn.out{border-color:var(--red);background:rgba(220,38,38,.16)}
.pbtn.ghost{opacity:.5;justify-content:center}
.pbtn .pr{text-transform:uppercase}

.fasegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.faseopt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:15px 16px;border-radius:14px;
  border:2px solid var(--brd);background:rgba(255,255,255,.05);transition:.13s}
.faseopt:hover:not(.off){border-color:var(--acc);background:rgba(255,77,157,.1)}
.faseopt.off{opacity:.4;cursor:not-allowed}
.faseopt b{font-size:14px}
.faseopt span{font-size:11px;color:var(--mute)}
.faseopt i{font-style:normal;font-size:11px;font-weight:800;color:var(--acc);margin-top:4px}
.faseopt.off i{color:var(--faint)}
.fasetag{font-size:9px;font-weight:900;letter-spacing:1.2px;padding:3px 8px;border-radius:99px;
  background:rgba(255,77,157,.18);color:var(--acc);border:1px solid rgba(255,77,157,.35)}
.crest.vazio{box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);color:var(--faint)}
.gc-nm.pend,b.pend{color:var(--faint);font-style:italic}
.campeao{display:flex;align-items:center;gap:20px;margin:18px 0 6px;padding:22px 24px;border-radius:20px;
  border:2px solid var(--c);background:linear-gradient(120deg,color-mix(in srgb,var(--c) 26%,transparent),rgba(255,255,255,.04))}
.campeao-lb{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.3em;color:var(--acc)}
.campeao-nm{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:2px;line-height:1}
.ctrls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:16px;border-top:1px solid var(--brd)}
.ctrl-lb{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--faint);margin-left:6px}
.ctrls .ctrl-lb:first-child{margin-left:0}
.faltabar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.btn.falta{background:rgba(234,88,12,.2);border-color:rgba(234,88,12,.55);color:#fdba74;font-size:14px;padding:12px 18px}
.btn.falta:hover{background:rgba(234,88,12,.32)}
.btn.pontoadv{background:rgba(37,99,235,.2);border-color:rgba(37,99,235,.55);color:#93c5fd;font-size:14px;padding:12px 18px}
.btn.pontoadv:hover{background:rgba(37,99,235,.32)}
body.claro .btn.falta{color:#9a3412}
body.claro .btn.pontoadv{color:#1e40af}
.faltahint{line-height:1.6;max-width:52ch}
.faltahint{font-size:11px;color:var(--mute)}
.dupwhy{font-size:10px;margin-left:auto;color:var(--faint);text-align:right;line-height:1.3}
.banner.ok{background:rgba(5,150,105,.16);border:1px solid rgba(5,150,105,.45);color:#a7f3d0}
.btn:disabled{opacity:.4;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){.pill.live{animation:none}}

/* ===== Ajustes do tema CLARO =====
   Onde havia cor crua (preto/navy), o claro precisa do par — senao o texto
   escuro cai sobre fundo escuro. */
body.claro .hd{background:rgba(255,255,255,.86);border-bottom-color:var(--brd)}
body.claro .fld input,body.claro .fld select,
body.claro .pool input,body.claro .row input{background:#fff;border-color:var(--brd);color:var(--fg)}
body.claro .fbox{background:rgba(216,27,121,.04)}
body.claro .fitem{background:rgba(216,27,121,.05)}
body.claro .slot{background:rgba(216,27,121,.04)}
body.claro .benchrow{background:rgba(216,27,121,.05)}
body.claro .btn{background:rgba(216,27,121,.07)}
body.claro .btn:hover{background:rgba(216,27,121,.14)}
body.claro .poolp{background:rgba(216,27,121,.06)}

  font-weight:800;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);background:#1e293b;border:1px solid var(--brd)}

<body>
<div id="app"></div>
<div class="stamp" id="stamp"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="cores-core.js"></script>
<script>
/* ============================================================================
   RS-SCOUT · MINI MINIS - CORES — modulo ISOLADO
   Nao toca no index.html. Dados em NO PROPRIO do RTDB: /torneio-cores
   Toda a logica de placar/saque/classificacao vive em cores-core.js (testado).
   Aqui so tem UI + Firebase.
   ========================================================================== */
/* Tema claro/escuro. Escuro e o padrao (fica melhor projetado no telao);
   o claro serve para notebook em ginasio muito iluminado. Fica no aparelho. */
var TEMA=(function(){try{return localStorage.getItem("cores_tema")||"escuro";}catch(e){return "escuro";}})();
function aplicarTema(){try{document.body.classList.toggle("claro",TEMA==="claro");}catch(e){}}
function trocarTema(){
  TEMA=(TEMA==="claro")?"escuro":"claro";
  try{localStorage.setItem("cores_tema",TEMA);}catch(e){}
  aplicarTema();render();
}
var CORES_NOME_PADRAO="Mini Minis - Cores";
var CORES_BUILD="2026-09-04c";
document.getElementById("stamp").textContent="cores "+CORES_BUILD;

var fc={apiKey:"AIzaSyDsZk3a11EJy5jfQzkMZyN4EGx-scaXg7o",authDomain:"scola-volei.firebaseapp.com",
  databaseURL:"https://scola-volei-default-rtdb.firebaseio.com",projectId:"scola-volei",
  storageBucket:"scola-volei.firebasestorage.app",messagingSenderId:"377829329248",
  appId:"1:377829329248:web:92360b7664cd4a2597f605"};
firebase.initializeApp(fc);
var db=firebase.database();
var ROOT="torneio-cores";

/* ---------- estado ---------- */
var D={config:{},teams:{},games:{},events:{}};
var QS=new URLSearchParams(location.search);
var VIEW=QS.get("v")||"home";
var GID=QS.get("g")||null;
var MEUTID=null;          // equipe que ESTE aparelho marca (por jogo)
var SELP=null;            // atleta selecionado na mesa
var SETUP=null;           // rascunho da ordem de saque (posicoes 1..N)
var SUBPICK=false;        // modo substituicao ligado
var SUBOUT=null;          // atleta que vai sair
var ESCALACAO_ABERTA=false; // reabrir a escalacao com o jogo ja em andamento
var _rallyVisto=-1;       // ultimo rally renderizado (para repor a selecao no sacador)
var _evRef=null,_evGid=null;
var _writeErr=false;
var _loaded={config:0,teams:0,games:0};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(m,k){var d=document.createElement("div");d.className="toast"+(k?" "+k:"");d.textContent=m;
  document.body.appendChild(d);setTimeout(function(){d.remove();},2600);}
function fD(d){if(!d)return"";try{return new Date(d+"T12:00:00").toLocaleDateString("pt-BR");}catch(e){return d;}}
/* Navegacao SEM recarregar: trocar de tela mantem a conexao com o banco e o
   estado carregado (recarregar a pagina no meio do torneio e caro e, num
   celular com sinal ruim, demora). */
function go(v,extra){
  var u="?v="+v+(extra||"");
  try{history.pushState({},"",u);}catch(e){location.href=u;return;}
  aplicarRota();
}
function aplicarRota(){
  QS=new URLSearchParams(location.search);
  VIEW=QS.get("v")||"home";
  GID=QS.get("g")||null;
  SELP=null;SETUP=null;SUBPICK=false;SUBOUT=null;ESCALACAO_ABERTA=false;_rallyVisto=-1;MEUTID=null;
  watchEvents();
  render();
}
window.addEventListener("popstate",aplicarRota);
function teamsArr(){var o=[];for(var k in D.teams)if(D.teams[k])o.push(D.teams[k]);
  o.sort(function(a,b){return (a.ordem||0)-(b.ordem||0)||String(a.n).localeCompare(String(b.n));});return o;}
function gamesArr(){var o=[];for(var k in D.games)if(D.games[k])o.push(D.games[k]);return o;}
/* Jogos com as equipes do mata-mata ja preenchidas (final = vencedor das semis).
   So para exibir — quem grava de verdade e o materializarDependentes(). */
function gamesRes(){return coresResolveGames(gamesArr(),D.events,D.teams,D.config);}
function gRes(id){var gs=gamesRes();for(var i=0;i<gs.length;i++)if(gs[i].id===id)return gs[i];return null;}
function tF(id){return D.teams[id]||null;}
function initials(n){var w=String(n||"").trim().split(/\s+/);
  return (w.length>1?(w[0][0]+w[1][0]):String(n||"?").slice(0,2)).toUpperCase();}
function playersOf(t){return (t&&t.players)||[];}
function pF(t,jid){var ps=playersOf(t);for(var i=0;i<ps.length;i++)if(ps[i].id===jid)return ps[i];return null;}

/* ---------- gravacao ----------
   TUDO que o operador marca e um EVENTO NOVO (push = insert). Nunca sobrescreve
   o no do jogo -> dois aparelhos gravando ao mesmo tempo nao se apagam.        */
function pushEvent(gid,ev){
  /* Carimbo do SERVIDOR, nao do aparelho: os dois notebooks podem estar com o
     relogio desencontrado, e o dedupe por tempo depende de uma base unica. */
  try{ ev.ts=(firebase.database.ServerValue&&firebase.database.ServerValue.TIMESTAMP)||Date.now(); }
  catch(e){ ev.ts=Date.now(); }
  return db.ref(ROOT+"/events/"+gid).push(ev).catch(function(e){onWriteErr(e);throw e;});
}
function writeNode(path,val){
  return db.ref(ROOT+"/"+path).set(val).catch(function(e){onWriteErr(e);throw e;});
}
function onWriteErr(e){
  var m=String((e&&(e.code||e.message))||"");
  if(m.indexOf("permission")>=0||m.indexOf("PERMISSION")>=0){
    if(!_writeErr){_writeErr=true;render();}
  }else{ toast("Falha ao salvar — verifique a conexão","err"); }
}

/* ---------- listeners (realtime) ---------- */
function boot(){
  db.ref(ROOT+"/config").on("value",function(s){D.config=s.val()||{};_loaded.config=1;render();});
  db.ref(ROOT+"/teams").on("value",function(s){D.teams=s.val()||{};_loaded.teams=1;render();});
  db.ref(ROOT+"/games").on("value",function(s){D.games=s.val()||{};_loaded.games=1;render();});
  watchEvents();
}
/* Eventos: na mesa escuta so o jogo aberto; no telao/classificacao escuta tudo. */
function watchEvents(){
  if(VIEW==="mesa"&&GID){
    if(_evGid===GID)return;
    if(_evRef)_evRef.off();
    _evGid=GID;_evRef=db.ref(ROOT+"/events/"+GID);
    _evRef.on("value",function(s){D.events[GID]=s.val()||{};render();});
  }else if(VIEW==="class"||VIEW==="telao"||VIEW==="home"||VIEW==="admin"){
    if(_evGid==="*")return;
    if(_evRef)_evRef.off();
    _evGid="*";_evRef=db.ref(ROOT+"/events");
    _evRef.on("value",function(s){D.events=s.val()||{};render();});
  }
}
/* Aba suspensa (iOS/Android) perde o socket: re-sincroniza ao voltar. */
function resync(){ try{ db.ref(ROOT+"/games").once("value").then(function(s){D.games=s.val()||{};render();});
  if(_evGid&&_evGid!=="*")db.ref(ROOT+"/events/"+_evGid).once("value").then(function(s){D.events[_evGid]=s.val()||{};render();});
  }catch(e){} }
document.addEventListener("visibilitychange",function(){if(!document.hidden)resync();});
window.addEventListener("focus",resync);
window.addEventListener("online",resync);

/* ---------- calculo ---------- */
function calc(g){ return coresComputeGame(g,D.events[g.id]||null,D.teams,D.config); }

/* ============================ RENDER ============================ */
function render(){
  var h="";
  aplicarTema();
  document.body.classList.toggle("telao",VIEW==="telao");
  /* Na mesa o leao sai de cena: e tela de trabalho, nada compete com os cards. */
  document.body.classList.toggle("trabalho",VIEW==="mesa");
  if(VIEW==="telao"){document.getElementById("app").innerHTML=rTelao();return;}
  h+=rHeader();
  h+='<div class="wrap">';
  if(_writeErr)h+='<div class="banner err"><b>Sem permissão de escrita no Firebase.</b> O nó <code>/torneio-cores</code> precisa das regras — cole o conteúdo de <code>firebase-rules-cores.json</code> no console do Firebase (Realtime Database › Regras). Até lá dá pra ver, mas não dá pra marcar.</div>';
  if(VIEW==="admin")h+=rAdmin();
  else if(VIEW==="mesa")h+=rMesa();
  else if(VIEW==="class")h+=rClass();
  else h+=rHome();
  h+='</div>';
  document.getElementById("app").innerHTML=h;
}
function rHeader(){
  var nome=D.config.nome||CORES_NOME_PADRAO;
  var h='<div class="hd"><div class="hd-in">';
  h+='<div class="hd-marca"><img src="rs-leao.png" alt="RS Voleibol"><div>';
  h+='<div class="hd-ti">'+esc(nome)+'</div><div class="hd-sub">RS-VOLEIBOL · SCOUT</div></div></div>';
  h+='<div class="hd-nav">';
  h+='<a href="?" class="'+(VIEW==="home"?"on":"")+'" onclick="event.preventDefault();go(\'home\')">Jogos</a>';
  h+='<a href="?v=class" class="'+(VIEW==="class"?"on":"")+'" onclick="event.preventDefault();go(\'class\')">Classificação</a>';
  h+='<a href="?v=telao" target="_blank">Telão</a>';
  h+='<a href="?v=admin" class="'+(VIEW==="admin"?"on":"")+'" onclick="event.preventDefault();go(\'admin\')">Admin</a>';
  h+='<button class="hd-tema" onclick="trocarTema()" title="'+(TEMA==="claro"?"Mudar para o tema escuro":"Mudar para o tema claro")+'">'+(TEMA==="claro"?"\u{1F319}":"\u2600\uFE0F")+'</button>';
  h+='</div></div></div>';
  return h;
}

/* ---------------- HOME: mural de jogos ---------------- */
function rHome(){
  var gs=coresOrderGames(gamesRes());
  var h='';
  if(!_loaded.games)return h+'<div class="empty">carregando…</div>';
  if(!gs.length){
    h+='<div class="empty"><div class="big">NENHUM JOGO AINDA</div>';
    h+='<div>Crie as equipes por cor e os jogos na aba <b>Admin</b>.</div>';
    h+='<div class="row" style="justify-content:center;margin-top:16px"><button class="btn pri" onclick="go(\'admin\')">Ir para o Admin</button></div></div>';
    return h;
  }
  /* Um bloco por fase: classificatoria, semifinal, 3o lugar, final. */
  var temMata=false;
  for(var i=0;i<gs.length;i++)if(coresFase(gs[i])!=="class")temMata=true;
  ["class","semi","terceiro","final"].forEach(function(f){
    var daFase=gs.filter(function(x){return coresFase(x)===f;});
    if(!daFase.length)return;
    h+='<h2 class="sec">'+(f==="class"?"JOGOS":CORES_FASES[f].l.toUpperCase())
      +(f==="class"&&temMata?'<span class="sec-sub">fase classificatória</span>':'')+'</h2>';
    daFase.forEach(function(x){h+=gameCard(x);});
  });
  var camp=coresCampeao(gamesArr(),D.events,D.teams,D.config);
  if(camp&&tF(camp)){
    h='<div class="campeao" style="--c:'+esc(tF(camp).cor)+'">'
      +'<div class="crest xl" style="background:'+esc(tF(camp).cor)+'">'+esc(initials(tF(camp).n))+'</div>'
      +'<div><div class="campeao-lb">CAMPEÃ DO TORNEIO</div>'
      +'<div class="campeao-nm">'+esc(tF(camp).n)+'</div></div></div>'+h;
  }
  return h;
}
function gameCard(g){
  var A=tF(g.a),B=tF(g.b);
  var st=calc(g);
  /* Jogo de mata-mata que ainda espera resultado mostra "Vencedor Semifinal 1". */
  function ladoHTML(t,lado,extra){
    var nm=t?t.n:coresLadoLabel(g,lado,D.teams);
    var crest='<div class="crest'+(t?'':' vazio')+'" style="background:'+esc(t?t.cor:'#334155')+'">'+esc(t?initials(nm):'?')+'</div>';
    var txt='<div style="min-width:0"><div class="gc-nm'+(t?'':' pend')+'">'+esc(nm)+'</div>'+extra+'</div>';
    return lado==="A"?(crest+txt):(txt+crest);
  }
  var live=g.st==="ao_vivo",fim=(g.st==="finalizada");
  var h='<div class="gcard'+(live?" live":"")+'">';
  h+='<div class="gc-vs">'+ladoHTML(A,"A",'<div class="gc-meta">'+(g.dt?fD(g.dt):"")+(g.tm?" · "+esc(g.tm):"")+'</div>')+'</div>';
  h+='<div class="gc-sc">'+st.pts.A+'<span class="faint" style="font-size:19px"> x </span>'+st.pts.B+'</div>';
  h+='<div class="gc-vs" style="justify-content:flex-end;text-align:right">';
  h+=ladoHTML(B,"B",'<div class="gc-meta">'+(live?"em andamento":(fim?"encerrado":"a jogar"))+'</div>');
  h+='</div>';
  h+='<div style="display:flex;flex-direction:column;gap:7px;align-items:flex-end;min-width:96px">';
  h+='<span class="pill '+(live?"live":(fim?"fim":"age"))+'">'+(live?"AO VIVO":(fim?"FIM":"AGENDADO"))+'</span>';
  if(A&&B)h+='<button class="btn sm pri" onclick="go(\'mesa\',\'&g='+g.id+'\')">'+(fim?"Ver":"Marcar")+'</button>';
  else h+='<span class="faint" style="font-size:10px;text-align:right;line-height:1.3">aguardando<br>o resultado</span>';
  h+='</div></div>';
  return h;
}

/* ---------------- MESA: a tela do operador ---------------- */
function rMesa(){
  var g=D.games[GID];
  if(g&&(!g.a||!g.b)){var gr=gRes(GID);if(gr&&gr.a&&gr.b)g=gr;}   /* mata-mata */
  if(!g)return '<div class="empty"><div class="big">JOGO NÃO ENCONTRADO</div><button class="btn" onclick="go(\'home\')" style="margin-top:14px">Voltar aos jogos</button></div>';
  var A=tF(g.a),B=tF(g.b);
  if(!A||!B){
    return '<div class="empty"><div class="big">'+esc(coresLadoLabel(g,"A",D.teams))+' × '+esc(coresLadoLabel(g,"B",D.teams))+'</div>'
      +'<div>Este jogo depende de um resultado que ainda não saiu.</div>'
      +'<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" onclick="go(\'home\')">← Voltar aos jogos</button></div></div>';
  }
  var st=calc(g);
  MEUTID=MEUTID||localStorage.getItem("cores_tid_"+g.id)||null;
  if(MEUTID!==g.a&&MEUTID!==g.b)MEUTID=null;
  if(!MEUTID)return rEscolhaEquipe(g,A,B);

  var meuSide=(MEUTID===g.a)?"A":"B";
  var meu=tF(MEUTID), adv=(meuSide==="A")?B:A;
  var h=placarHTML(g,A,B,st);

  /* Antes de marcar: quem saca primeiro + a ordem de saque posicionada 1..N.
     O sacador nao e escolhido em lista — sai da posicao 1 da escalacao. */
  var faltaSetup=(!st.firstServeSide)||(!st.lineupSet[meuSide]);
  if(faltaSetup&&!st.done)return h+rSetup(g,meu,adv,st,meuSide,A,B);

  return h+rMesaJogo(g,meu,adv,st,meuSide,A,B);
}

function rEscolhaEquipe(g,A,B){
  var h='<h2 class="sec">QUEM VOCÊ VAI MARCAR?<span class="sec-sub">um aparelho por equipe</span></h2>';
  h+='<div class="banner inf">Cada operador marca <b>uma</b> equipe. O outro abre este mesmo jogo e escolhe a outra — placar, saque e escalação ficam iguais nos dois, em tempo real.</div>';
  h+='<div class="pickteam">';
  [A,B].forEach(function(t){
    h+='<button class="pickteam-btn" style="--c:'+esc(t.cor)+'" onclick="setMeuTid(\''+t.id+'\')">';
    h+='<div class="crest xl" style="background:'+esc(t.cor)+'">'+esc(initials(t.n))+'</div>';
    h+='<div class="pickteam-nm">'+esc(t.n)+'</div>';
    h+='<div class="pickteam-sub">'+playersOf(t).length+' atletas</div>';
    h+='<div class="pickteam-cta">MARCAR ESTA EQUIPE</div></button>';
  });
  h+='</div>';
  h+='<div class="row" style="margin-top:16px"><button class="btn" onclick="go(\'home\')">← Voltar aos jogos</button></div>';
  return h;
}

/* Placar do topo — o mesmo nos dois aparelhos. */
function placarHTML(g,A,B,st){
  var h='<div class="mesa-top">';
  [{t:A,s:"A"},{t:B,s:"B"}].forEach(function(x){
    var mine=(x.t.id===MEUTID);
    var serving=st.serve&&st.serve.side===x.s;
    var sacador=serving&&st.serve.jid?pF(x.t,st.serve.jid):null;
    h+='<div class="mesa-side'+(mine?" mine":"")+(serving?" serving":"")+'" style="--c:'+esc(x.t.cor)+'">';
    h+='<div class="crest lg" style="background:'+esc(x.t.cor)+'">'+esc(initials(x.t.n))+'</div>';
    h+='<div class="mesa-id"><div class="nm">'+esc(x.t.n)+'</div>';
    h+='<div class="sub">'+(mine?"VOCÊ MARCA":"outro operador")+'</div>';
    if(serving)h+='<div class="serve-badge">🏐 SACA'+(sacador?" · "+esc(sacador.nm):"")+'</div>';
    h+='</div>';
    h+='<div class="pts">'+st.pts[x.s]+'</div></div>';
  });
  h+='</div>';
  return h;
}

/* ---- SETUP: quem saca + ordem de saque 1..N ---- */
function rSetup(g,meu,adv,st,meuSide,A,B){
  var cfg=coresCfg(D.config);
  var n=cfg.emQuadra;
  if(SETUP===null)SETUP=(st.lineupSet[meuSide]?st.lineup[meuSide].slice(0,n):[]);
  var elenco=playersOf(meu);
  var usados={};SETUP.forEach(function(j){usados[j]=1;});

  var h='<h2 class="sec">ANTES DE COMEÇAR<span class="sec-sub">você marca a '+esc(meu.n)+'</span></h2>';

  /* passo 1 — equipe que abre sacando */
  h+='<div class="step'+(st.firstServeSide?" done":"")+'">';
  h+='<div class="step-hd"><span class="step-n">1</span>Qual equipe saca primeiro?'+(st.firstServeSide?'<span class="step-ok">✓ definido</span>':'')+'</div>';
  h+='<div class="row">';
  [A,B].forEach(function(t){
    var on=st.firstServeSide===((t.id===g.a)?"A":"B");
    h+='<button class="teamchoice'+(on?" on":"")+'" style="--c:'+esc(t.cor)+'" onclick="setFirstServe(\''+t.id+'\')">';
    h+='<span class="dot" style="background:'+esc(t.cor)+'"></span>'+esc(t.n)+(on?' 🏐':'')+'</button>';
  });
  h+='</div>';
  h+='<div class="step-hint">Vale para as duas equipes — o outro operador vê a mesma escolha.</div>';
  h+='</div>';

  /* passo 2 — ordem de saque posicionada */
  h+='<div class="step'+(SETUP.length>=n?" done":"")+'">';
  h+='<div class="step-hd"><span class="step-n">2</span>Ordem de saque da '+esc(meu.n)+(SETUP.length>=n?'<span class="step-ok">✓ completa</span>':'')+'</div>';
  h+='<div class="step-hint">Toque nos atletas na ordem em que vão sacar. Quem ficar na <b>posição 1</b> começa sacando; depois o rodízio anda sozinho.</div>';
  h+='<div class="slots">';
  for(var i=0;i<n;i++){
    var jid=SETUP[i], p=jid?pF(meu,jid):null;
    h+='<div class="slot'+(p?" filled":"")+'" style="--c:'+esc(meu.cor)+'"'+(p?' onclick="setupRemove('+i+')"':'')+'>';
    h+='<span class="slot-n">'+(i+1)+'</span>';
    if(p){h+='<span class="slot-nm">'+esc(p.nm)+'</span><span class="slot-x">×</span>';}
    else h+='<span class="slot-empty">livre</span>';
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="pool">';
  elenco.forEach(function(p){
    var on=!!usados[p.id];
    h+='<button class="poolp'+(on?" used":"")+'" style="--c:'+esc(meu.cor)+'" onclick="setupPick(\''+p.id+'\')"'+(on?' disabled':'')+'>';
    h+='<span class="poolp-nu" style="background:'+esc(meu.cor)+'">'+esc(p.nu!=null&&p.nu!==""?p.nu:initials(p.nm))+'</span>';
    h+=esc(p.nm)+'</button>';
  });
  if(!elenco.length)h+='<span class="faint">Nenhum atleta cadastrado nesta equipe — cadastre no Admin.</span>';
  h+='</div>';
  h+='<div class="row" style="margin-top:12px">';
  h+='<button class="btn pri" onclick="salvarEscalacao()"'+(SETUP.length<n||!st.firstServeSide?" disabled":"")+'>✓ Confirmar e começar</button>';
  if(SETUP.length)h+='<button class="btn sm" onclick="setupLimpar()">Limpar</button>';
  h+='<button class="btn sm" onclick="trocarEquipe()">Marcar a outra equipe</button>';
  h+='<button class="btn sm" onclick="go(\'home\')">← Jogos</button>';
  h+='</div>';
  if(SETUP.length>=n&&!st.firstServeSide)h+='<div class="step-hint" style="color:#fca5a5">Falta escolher quem saca primeiro (passo 1).</div>';
  h+='</div>';
  return h;
}
function setupPick(jid){
  var g=D.games[GID];if(!g)return;
  var n=coresCfg(D.config).emQuadra;
  if(SETUP===null)SETUP=[];
  if(SETUP.indexOf(jid)>=0)return;
  if(SETUP.length>=n){toast("As "+n+" posições já estão preenchidas","err");return;}
  SETUP.push(jid);render();
}
function setupRemove(i){ if(SETUP){SETUP.splice(i,1);render();} }
function setupLimpar(){ SETUP=[];render(); }
function setFirstServe(tid){ pushEvent(GID,{t:"first",tid:tid}); }
function salvarEscalacao(){
  var g=D.games[GID];if(!g)return;
  var n=coresCfg(D.config).emQuadra;
  if(!SETUP||SETUP.length<n){toast("Complete as "+n+" posições","err");return;}
  var st=calc(g);
  if(!st.firstServeSide){toast("Escolha quem saca primeiro","err");return;}
  var ordem=SETUP.slice();
  SETUP=null;ESCALACAO_ABERTA=false;render();   /* mesmo motivo do fazerSub */
  pushEvent(GID,{t:"lineup",tid:MEUTID,ordem:ordem}).then(function(){
    toast("Escalação salva","ok");
  });
}
function reabrirEscalacao(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g),meuSide=(MEUTID===g.a)?"A":"B";
  SETUP=st.lineup[meuSide].slice(0,coresCfg(D.config).emQuadra);
  ESCALACAO_ABERTA=true;render();
}

/* ---- MESA em jogo ---- */
function rMesaJogo(g,meu,adv,st,meuSide,A,B){
  var cfg=coresCfg(D.config);
  var h='';

  /* A cada rally novo a selecao volta para o sacador da propria equipe: o
     primeiro toque do rally e quase sempre o saque. E so sugestao — tocar em
     outro atleta troca. Sem isso o operador ficava com o atleta do rally
     anterior selecionado e marcava no jogador errado. */
  if(_rallyVisto!==st.rally){ _rallyVisto=st.rally; if(!SUBPICK)SELP=null; }
  if(!SELP&&!SUBPICK&&st.serve&&st.serve.side===meuSide&&pF(meu,st.serve.jid))SELP=st.serve.jid;

  if(ESCALACAO_ABERTA&&!st.done){
    h+=rSetup(g,meu,adv,st,meuSide,A,B);
    h+='<div class="row"><button class="btn sm" onclick="fecharEscalacao()">Cancelar</button></div>';
    return h;
  }

  if(st.done){
    var wt=st.winnerTid?tF(st.winnerTid):null;
    h+='<div class="banner ok"><b>Set encerrado</b> — '+(wt?esc(wt.n)+" venceu por ":"")+st.pts.A+' x '+st.pts.B+'. ';
    h+=(g.st!=="finalizada"?'Confirme para entrar na classificação.':'Jogo finalizado.')+'</div>';
    if(g.st!=="finalizada")h+='<div class="row" style="margin-bottom:12px"><button class="btn pri" onclick="finalizarJogo()">✓ Finalizar jogo</button><button class="btn" onclick="undoLast()">↩ Desfazer última</button></div>';
  }else if(g.st!=="ao_vivo"){
    h+='<div class="banner inf">Escalação pronta. <b>Inicie o jogo</b> para começar a marcar.</div>';
    h+='<div class="row" style="margin-bottom:12px"><button class="btn pri" onclick="iniciarJogo()">▶ Iniciar jogo</button><button class="btn sm" onclick="reabrirEscalacao()">✎ Mudar escalação</button><button class="btn sm" onclick="go(\'home\')">← Jogos</button></div>';
  }

  /* atletas: em quadra na ORDEM DE SAQUE, com a posicao visivel */
  var court=st.lineup[meuSide]||[];
  var bench=playersOf(meu).filter(function(p){return court.indexOf(p.id)<0;});

  h+='<h2 class="sec">'+esc(meu.n)+'<span class="sec-sub">em quadra · na ordem de saque</span></h2>';
  h+='<div class="pgrid">';
  court.forEach(function(jid,ix){
    var p=pF(meu,jid);
    if(!p){h+='<div class="pbtn ghost"><span class="pos">'+(ix+1)+'</span><div class="pn faint">(atleta removido)</div></div>';return;}
    h+=pBtn(p,meu,st,ix+1,false,meuSide);
  });
  h+='</div>';

  /* substituicao */
  if(SUBPICK&&!SUBOUT){
    h+='<div class="subbar"><b>Substituição</b> — toque em quem <b>SAI</b> (nos cards acima).';
    h+='<div style="margin-top:8px"><button class="btn sm" onclick="cancelSub()">Cancelar</button></div></div>';
  }else if(SUBOUT){
    var outP=pF(meu,SUBOUT);
    h+='<div class="subbar"><b>Sai '+esc(outP?outP.nm:"")+'</b> — quem entra?';
    h+='<div class="pool" style="margin-top:8px">';
    if(!bench.length)h+='<span class="faint">Sem reservas nesta equipe.</span>';
    bench.forEach(function(p){
      h+='<button class="poolp" style="--c:'+esc(meu.cor)+'" onclick="fazerSub(\''+p.id+'\')">';
      h+='<span class="poolp-nu" style="background:'+esc(meu.cor)+'">'+esc(p.nu!=null&&p.nu!==""?p.nu:initials(p.nm))+'</span>';
      h+=esc(p.nm)+'</button>';
    });
    h+='</div><button class="btn sm" style="margin-top:8px" onclick="cancelSub()">Cancelar</button></div>';
  }else if(bench.length&&!SUBPICK){
    h+='<div class="benchrow"><span class="benchlb">RESERVAS</span>';
    bench.forEach(function(p){
      h+='<span class="benchp"><span class="poolp-nu" style="background:'+esc(meu.cor)+'">'+esc(p.nu!=null&&p.nu!==""?p.nu:initials(p.nm))+'</span>'+esc(p.nm)+'</span>';
    });
    h+='<button class="btn sm" onclick="abrirSub()">⇄ Substituir</button></div>';
  }

  /* acoes */
  var travado=st.done||g.st!=="ao_vivo";
  h+='<div class="'+(SELP&&!travado?"":"needp")+'" style="margin-top:18px">';
  h+='<h2 class="sec">AÇÃO<span class="sec-sub">'+(SELP&&pF(meu,SELP)?esc(pF(meu,SELP).nm):(travado?"jogo não está ao vivo":"escolha o atleta acima"))+'</span></h2>';
  h+='<div class="fgrid">';
  for(var fi=0;fi<CORES_FUND.length;fi++){
    var ak=CORES_FUND[fi], a=CORES_ACT[ak];
    h+='<div class="fbox"><div class="fh" style="background:'+CORES_FCOL[ak]+'">'+a.i+' '+esc(a.l)+'</div><div class="fb">';
    for(var i=0;i<a.o.length;i++){
      var oc=a.o[i];
      h+='<button style="background:'+CORES_OC[oc]+'" onclick="mark(\''+ak+'\',\''+oc+'\')">'+esc(oc)+'</button>';
    }
    h+='</div></div>';
  }
  h+='</div></div>';

  /* controles */
  /* Falta sem fundamento (rodizio, posicional, conducao, invasao, tempo):
     nao tem atleta e da ponto direto para a adversaria. */
  h+='<div class="faltabar">';
  h+='<button class="btn falta" onclick="marcarFalta()">⚠ Falta da '+esc(meu.n)+'</button>';
  h+='<button class="btn pontoadv" onclick="marcarPontoAdv()">➕ Ponto da '+esc(adv.n)+'</button>';
  h+='<span class="faltahint"><b>Falta</b>: rodízio, posicional, condução, invasão, tempo.<br>'
    +'<b>Ponto da '+esc(adv.n)+'</b>: quando ela pontuou e você não quer esperar o outro operador marcar — '
    +'sobe o placar e <b>roda o saque</b>. Se os dois marcarem o mesmo rally, conta 1 ponto só.</span></div>';

  h+='<div class="ctrls">';
  h+='<span class="ctrl-lb" title="Correção de placar: não mexe no saque">Corrigir '+esc(meu.n)+'</span>';
  h+='<button class="btn" onclick="adjust(\''+MEUTID+'\',1)">+1</button>';
  h+='<button class="btn" onclick="adjust(\''+MEUTID+'\',-1)">−1</button>';
  h+='<span class="ctrl-lb">'+esc(adv.n)+'</span>';
  h+='<button class="btn" onclick="adjust(\''+adv.id+'\',1)">+1</button>';
  h+='<button class="btn" onclick="adjust(\''+adv.id+'\',-1)">−1</button>';
  h+='<button class="btn" onclick="girarSaque()">↻ Girar saque</button>';
  h+='<button class="btn dgr" onclick="undoLast()">↩ Desfazer minha última</button>';
  h+='<button class="btn sm" onclick="reabrirEscalacao()">✎ Escalação</button>';
  h+='<button class="btn sm" onclick="trocarEquipe()">Trocar equipe</button>';
  h+='<button class="btn sm" onclick="go(\'home\')">← Jogos</button>';
  h+='</div>';

  /* feed + ladder */
  h+='<h2 class="sec">ÚLTIMAS AÇÕES<span class="sec-sub">as duas equipes</span></h2><div class="card">';
  h+=feedHTML(st,g);
  if(st.pointLog.length){
    h+='<div class="ladder">';
    st.pointLog.forEach(function(p){
      var c=(p.side==="A")?A.cor:B.cor;
      h+='<i style="background:'+esc(c)+'" title="'+esc(p.side==="A"?A.n:B.n)+'"></i>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function pBtn(p,team,st,pos,isBench,meuSide){
  var serving=st.serve&&st.serve.side===meuSide&&st.serve.jid===p.id;
  var saindo=(SUBPICK&&SUBOUT===p.id);
  var on=(!SUBPICK&&SELP===p.id);
  /* Em modo substituicao o card escolhe quem SAI; fora dele, seleciona para marcar. */
  var acao=SUBPICK?("pickOut('"+p.id+"')"):("selP('"+p.id+"')");
  /* A POSICAO de saque manda no card (e o que o operador usa); o numero da
     camisa fica discreto junto do nome — os dois grandes se confundiam. */
  var camisa=(p.nu!=null&&p.nu!=="")?("#"+p.nu):"";
  return '<button class="pbtn'+(on?" on":"")+(saindo?" out":"")+(SUBPICK?" subpick":"")+(serving?" serving":"")+'" style="--c:'+esc(team.cor)+'" onclick="'+acao+'">'
    +'<div class="pos" style="background:'+esc(team.cor)+'">'+pos+'</div>'
    +'<div style="min-width:0;flex:1"><div class="pn">'+esc(p.nm)+'</div>'
    +'<div class="pr">'+(saindo?'<b class="sai">SAI</b>':(serving?'<b class="saca">🏐 SACANDO</b>':'saque '+pos))
    +(camisa?' <span class="camisa">'+esc(camisa)+'</span>':'')+'</div></div></button>';
}

function feedHTML(st,g){
  var evs=st.events.slice().reverse().filter(function(e){return e.t==="act";}).slice(0,10);
  if(!evs.length)return '<div class="faint">Nenhuma ação marcada ainda.</div>';
  var dupKeys={};st.dupes.forEach(function(d){dupKeys[d.k]=d._dupWhy||"rally";});
  var h='<div class="feed">';
  evs.forEach(function(e){
    var t=tF(e.tid),p=t?pF(t,e.jid):null;
    var a=CORES_ACT[e.ak];
    h+='<div class="fitem'+(dupKeys[e.k]?" dup":"")+'">';
    h+='<span class="dot" style="background:'+esc(t?t.cor:"#64748b")+'"></span>';
    h+='<b>'+esc(p?p.nm:"—")+'</b><span class="faint">'+esc(a?a.l:e.ak)+'</span>';
    h+='<span class="oc" style="background:'+(CORES_OC[e.oc]||"#64748b")+'">'+esc(e.oc)+'</span>';
    if(dupKeys[e.k])h+='<span class="dupwhy">só estatística · '+(dupKeys[e.k]==="janela"?"o outro operador já marcou este rally":"rally já pontuado")+'</span>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

/* ---------- acoes da mesa ---------- */
function setMeuTid(tid){MEUTID=tid;localStorage.setItem("cores_tid_"+GID,tid);SELP=null;SETUP=null;render();}
function trocarEquipe(){localStorage.removeItem("cores_tid_"+GID);MEUTID=null;SELP=null;SETUP=null;render();}
/* Sempre SELECIONA (nunca alterna). Toque repetido no mesmo atleta e comum na
   correria e nao pode zerar a selecao — a acao seguinte deixaria de gravar. */
function selP(jid){SELP=jid;render();}
function fecharEscalacao(){ESCALACAO_ABERTA=false;SETUP=null;render();}
function abrirSub(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g),meuSide=(MEUTID===g.a)?"A":"B";
  if(!(st.lineup[meuSide]||[]).length){toast("Defina a escalação primeiro","err");return;}
  SUBOUT=null;SELP=null;SUBPICK=true;render();
}
function pickOut(jid){SUBOUT=jid;render();}
function cancelSub(){SUBOUT=null;SUBPICK=false;render();}
function fazerSub(inJid){
  if(!SUBOUT){toast("Escolha quem sai","err");return;}
  var out=SUBOUT;
  /* Sai do modo substituicao ANTES de gravar e re-renderiza na hora: se isso
     ficasse no .then, o listener redesenhava os cards ainda em modo "quem sai"
     e o toque seguinte do operador era perdido. */
  SUBOUT=null;SUBPICK=false;SELP=null;render();
  pushEvent(GID,{t:"sub",tid:MEUTID,out:out,in:inJid}).then(function(){
    toast("Substituição feita","ok");
  });
}
function girarSaque(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g),meuSide=(MEUTID===g.a)?"A":"B";
  var lst=st.lineup[meuSide]||[];
  if(!lst.length){toast("Defina a escalação primeiro","err");return;}
  var last=st.lastServer[meuSide];
  var i=lst.indexOf(last);
  var nx=(i<0)?lst[0]:lst[(i+1)%lst.length];
  pushEvent(GID,{t:"serve",tid:MEUTID,jid:nx});
}
function mark(ak,oc){
  if(!SELP){toast("Escolha o atleta primeiro","err");return;}
  var g=D.games[GID];if(!g)return;
  var st=calc(g);
  if(st.done){toast("Set encerrado — finalize o jogo","err");return;}
  if(g.st!=="ao_vivo"){toast("Inicie o jogo antes de marcar","err");return;}
  pushEvent(GID,{t:"act",tid:MEUTID,jid:SELP,ak:ak,oc:oc,rally:st.rally}).then(function(ref){
    /* Se o ponto deste rally ja tinha sido contado pelo outro operador, a acao
       entra como estatistica e o placar NAO sobe. Avisa, pra nao ficar silencioso. */
    var key=ref&&ref.key; if(!key)return;
    setTimeout(function(){
      var gg=D.games[GID]; if(!gg)return;
      var st2=calc(gg);
      for(var i=0;i<st2.dupes.length;i++){
        if(st2.dupes[i].k===key){ toast("Ação salva no scout. O ponto deste rally já tinha sido contado.",""); break; }
      }
    },150);
  }).catch(function(){});
}
function marcarFalta(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g);
  if(st.done){toast("Set encerrado — finalize o jogo","err");return;}
  if(g.st!=="ao_vivo"){toast("Inicie o jogo antes de marcar","err");return;}
  /* sem jid: e falta da equipe, nao entra na estatistica de nenhum atleta */
  pushEvent(GID,{t:"act",tid:MEUTID,jid:null,ak:"falta",oc:"Erro",rally:st.rally});
}
/* O adversario pontuou. Sobe o placar dele e ROTACIONA o saque — diferente do
   +1, que e so correcao de numero. Sem isto, o operador so via o rodizio andar
   quando o outro operador marcasse a jogada dele. */
function marcarPontoAdv(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g);
  if(st.done){toast("Set encerrado — finalize o jogo","err");return;}
  if(g.st!=="ao_vivo"){toast("Inicie o jogo antes de marcar","err");return;}
  pushEvent(GID,{t:"act",tid:MEUTID,jid:null,ak:"pontoadv",oc:"Erro",rally:st.rally});
}
function adjust(tid,delta){
  var g=D.games[GID];if(!g)return;
  pushEvent(GID,{t:"adj",tid:tid,delta:delta});
}
/* Desfaz so o ULTIMO evento DESTE aparelho/equipe — nunca mexe no do outro operador. */
function undoLast(){
  var evObj=D.events[GID]||{};
  var keys=Object.keys(evObj).sort();
  for(var i=keys.length-1;i>=0;i--){
    var e=evObj[keys[i]];
    if(e&&e.tid===MEUTID){
      db.ref(ROOT+"/events/"+GID+"/"+keys[i]).remove().then(function(){toast("Última ação desfeita","ok");}).catch(onWriteErr);
      return;
    }
  }
  toast("Nada seu para desfazer","err");
}
function iniciarJogo(){var g=D.games[GID];if(!g)return;g.st="ao_vivo";writeNode("games/"+GID+"/st","ao_vivo");}
function finalizarJogo(){
  var g=D.games[GID];if(!g)return;
  g.st="finalizada";
  writeNode("games/"+GID+"/st","finalizada").then(function(){
    toast("Jogo finalizado — classificação atualizada","ok");
    materializarDependentes();
  });
}
/* A final nasce como "vencedor da SF1 x vencedor da SF2". Quando a semi acaba,
   grava as equipes de verdade no jogo — senao a mesa nao teria como abrir. */
function materializarDependentes(){
  var res=gamesRes();
  for(var i=0;i<res.length;i++){
    var r=res[i], cru=D.games[r.id]; if(!cru)continue;
    if(r.a&&!cru.a)writeNode("games/"+r.id+"/a",r.a);
    if(r.b&&!cru.b)writeNode("games/"+r.id+"/b",r.b);
  }
}

/* ---------------- CLASSIFICACAO ---------------- */
function rClass(){
  var ts=teamsArr();
  if(!ts.length)return '<div class="empty"><div class="big">SEM EQUIPES</div><div>Cadastre as equipes no Admin.</div></div>';
  var S=coresStandings(gamesArr(),ts,D.events,D.config);
  var cfg=coresCfg(D.config);
  var h='<h2 class="sec">CLASSIFICAÇÃO</h2>';
  h+='<div class="card"><div class="tscroll"><table class="tb"><thead><tr>';
  h+='<th>#</th><th>EQUIPE</th><th>J</th><th>V</th><th>D</th><th>PP</th><th>PC</th><th>SALDO</th><th>PTS</th>';
  h+='</tr></thead><tbody>';
  S.forEach(function(r){
    h+='<tr><td class="faint">'+r.pos+'</td>';
    h+='<td class="nm"><span style="display:inline-flex;align-items:center;gap:9px">';
    h+='<span class="dot" style="background:'+esc(r.cor)+'"></span>'+esc(r.n)+'</span></td>';
    h+='<td>'+r.j+'</td><td style="color:#6ee7b7;font-weight:800">'+r.v+'</td><td class="faint">'+r.d+'</td>';
    h+='<td>'+r.pp+'</td><td>'+r.pc+'</td>';
    h+='<td style="color:'+(r.saldo>0?"#6ee7b7":(r.saldo<0?"#fca5a5":"var(--mute)"))+'">'+(r.saldo>0?"+":"")+r.saldo+'</td>';
    h+='<td style="font-family:\'Bebas Neue\',sans-serif;font-size:20px">'+r.pts+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="faint" style="font-size:11px;margin-top:12px;line-height:1.6">Vitória = '+cfg.ptsVitoria+' · Derrota = '+cfg.ptsDerrota+' · Set único até '+cfg.setPoints+' com '+cfg.vantagem+' de vantagem.<br>Desempate: pontos › saldo › pontos pró › confronto direto. Só entram jogos <b>encerrados da fase classificatória</b> — semifinal e final não mexem na tabela.</div>';
  h+='</div>';
  h+='<h2 class="sec">RESULTADOS</h2>';
  var fin=coresOrderGames(gamesArr()).filter(function(g){return g.st==="finalizada"||calc(g).done;});
  if(!fin.length)h+='<div class="empty">Nenhum jogo encerrado ainda.</div>';
  else fin.forEach(function(g){h+=gameCard(g);});
  return h;
}

/* ---------------- TELAO ---------------- */
function rTelao(){
  var gs=coresOrderGames(gamesRes());
  var campT=coresCampeao(gamesArr(),D.events,D.teams,D.config);
  if(campT&&tF(campT)){
    var ct=tF(campT);
    return '<div class="tl"><div class="tl-hd"><div class="hd-ti" style="font-size:28px">'+esc(D.config.nome||CORES_NOME_PADRAO)+'</div>'
      +'<div class="hd-sub" style="margin-left:auto">RS-VOLEIBOL</div></div>'
      +'<div class="tl-main" style="flex-direction:column;gap:10px">'
      +'<div class="crest xl" style="background:'+esc(ct.cor)+';width:170px;height:170px;font-size:74px;border-radius:34px">'+esc(initials(ct.n))+'</div>'
      +'<div class="hd-sub" style="font-size:13px;letter-spacing:6px">CAMPEÃ DO TORNEIO</div>'
      +'<div class="tl-nm" style="color:'+esc(ct.cor)+'">'+esc(ct.n)+'</div></div></div>';
  }
  var live=null;
  for(var i=0;i<gs.length;i++)if(gs[i].st==="ao_vivo"){live=gs[i];break;}
  if(!live)for(var j=0;j<gs.length;j++)if(gs[j].st!=="finalizada"){live=gs[j];break;}
  var h='<div class="tl">';
  h+='<div class="tl-hd"><div class="hd-ti" style="font-size:28px">'+esc(D.config.nome||CORES_NOME_PADRAO)+'</div>';
  h+='<div class="hd-sub" style="margin-left:auto">RS-VOLEIBOL</div></div>';
  if(!live){
    h+='<div class="tl-main"><div class="empty"><div class="big">SEM JOGO EM ANDAMENTO</div></div></div></div>';
    return h;
  }
  var A=tF(live.a),B=tF(live.b);
  if(!A||!B){h+='<div class="tl-main"><div class="empty">equipes não encontradas</div></div></div>';return h;}
  var st=calc(live);
  h+='<div class="tl-main">';
  [{t:A,s:"A"},{t:B,s:"B"}].forEach(function(x,ix){
    if(ix===1)h+='<div class="tl-x">×</div>';
    var serving=st.serve&&st.serve.side===x.s;
    h+='<div class="tl-team">';
    h+='<div class="crest xl" style="background:'+esc(x.t.cor)+';margin:0 auto 12px">'+esc(initials(x.t.n))+'</div>';
    h+='<div class="tl-nm">'+esc(x.t.n)+(serving?' <span style="font-size:.5em">🏐</span>':'')+'</div>';
    h+='<div class="tl-pt" style="color:'+esc(x.t.cor)+'">'+st.pts[x.s]+'</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="tl-bot">';
  /* classificacao resumida */
  var S=coresStandings(gamesArr(),teamsArr(),D.events,D.config);
  h+='<div><div class="hd-sub" style="margin-bottom:8px">CLASSIFICAÇÃO</div><table class="tb"><tbody>';
  S.slice(0,6).forEach(function(r){
    h+='<tr><td class="faint">'+r.pos+'</td><td class="nm"><span style="display:inline-flex;align-items:center;gap:8px">';
    h+='<span class="dot" style="background:'+esc(r.cor)+'"></span>'+esc(r.n)+'</span></td>';
    h+='<td>'+r.v+'V</td><td class="faint">'+(r.saldo>0?"+":"")+r.saldo+'</td>';
    h+='<td style="font-weight:900">'+r.pts+'</td></tr>';
  });
  h+='</tbody></table></div>';
  /* proximos */
  var prox=gs.filter(function(g){return g.st!=="finalizada"&&g.id!==live.id;}).slice(0,4);
  h+='<div><div class="hd-sub" style="margin-bottom:8px">PRÓXIMOS JOGOS</div>';
  if(!prox.length)h+='<div class="faint">—</div>';
  prox.forEach(function(g){
    var a=tF(g.a),b=tF(g.b);if(!a||!b)return;
    h+='<div style="display:flex;align-items:center;gap:9px;padding:5px 0;font-weight:700">';
    h+='<span class="dot" style="background:'+esc(a.cor)+'"></span>'+esc(a.n);
    h+='<span class="faint">×</span><span class="dot" style="background:'+esc(b.cor)+'"></span>'+esc(b.n);
    h+='<span class="faint" style="margin-left:auto;font-size:11px">'+(g.tm||fD(g.dt))+'</span></div>';
  });
  h+='</div></div></div>';
  return h;
}

/* ---------------- ADMIN ---------------- */
function rAdmin(){
  var cfg=coresCfg(D.config);
  var ts=teamsArr();
  var h='<h2 class="sec">CONFIGURAÇÃO</h2><div class="card"><div class="row">';
  h+='<div class="fld" style="flex:2"><span>NOME DO TORNEIO</span><input id="cf-n" value="'+esc(D.config.nome||CORES_NOME_PADRAO)+'"></div>';
  h+='<div class="fld"><span>SET ATÉ</span><input id="cf-sp" type="number" value="'+cfg.setPoints+'"></div>';
  h+='<div class="fld"><span>VANTAGEM</span><input id="cf-va" type="number" value="'+cfg.vantagem+'"></div>';
  h+='<div class="fld"><span>EM QUADRA</span><input id="cf-eq" type="number" value="'+cfg.emQuadra+'"></div>';
  h+='<div class="fld"><span>PTS VITÓRIA</span><input id="cf-pv" type="number" value="'+cfg.ptsVitoria+'"></div>';
  h+='<div class="fld"><span>PTS DERROTA</span><input id="cf-pd" type="number" value="'+cfg.ptsDerrota+'"></div>';
  h+='<div class="fld"><span>JANELA ANTI-DUPLO (s)</span><input id="cf-dd" type="number" step="0.5" value="'+(cfg.dedupeMs/1000)+'" title="Segundos em que a mesma jogada marcada pelos 2 operadores conta 1 ponto só"></div>';
  h+='<button class="btn pri" style="align-self:flex-end" onclick="salvarConfig()">Salvar</button>';
  h+='</div></div>';

  /* equipes */
  h+='<h2 class="sec">EQUIPES POR COR</h2>';
  h+='<div class="card"><div class="row">';
  h+='<div class="fld" style="flex:2"><span>NOME DA EQUIPE</span><input id="nt-n" placeholder="AZUL"></div>';
  h+='<div class="fld"><span>COR</span><input id="nt-c" type="color" value="#2563eb"></div>';
  h+='<button class="btn pri" style="align-self:flex-end" onclick="novaEquipe()">+ Criar equipe</button>';
  h+='</div></div>';
  if(!ts.length)h+='<div class="empty">Nenhuma equipe ainda.</div>';
  ts.forEach(function(t){
    h+='<div class="card" style="border-left:4px solid '+esc(t.cor)+'">';
    h+='<div class="row" style="margin-bottom:10px">';
    h+='<div class="crest" style="background:'+esc(t.cor)+'">'+esc(initials(t.n))+'</div>';
    h+='<div class="fld" style="flex:1"><span>NOME</span><input value="'+esc(t.n)+'" onchange="editEquipe(\''+t.id+'\',\'n\',this.value)"></div>';
    h+='<div class="fld"><span>COR</span><input type="color" value="'+esc(t.cor)+'" onchange="editEquipe(\''+t.id+'\',\'cor\',this.value)"></div>';
    h+='<button class="btn dgr sm" style="align-self:flex-end" onclick="delEquipe(\''+t.id+'\')">Excluir</button>';
    h+='</div>';
    var ps=playersOf(t);
    h+='<div class="faint" style="font-size:10px;font-weight:800;letter-spacing:1.2px;margin-bottom:7px">ATLETAS — a ordem da lista É a ordem de saque (os '+cfg.emQuadra+' primeiros entram em quadra)</div>';
    if(!ps.length)h+='<div class="faint" style="margin-bottom:8px">nenhum atleta</div>';
    ps.forEach(function(p,ix){
      h+='<div class="row" style="margin-bottom:6px;flex-wrap:nowrap">';
      h+='<span class="tag" style="min-width:64px;justify-content:center">'+(ix<cfg.emQuadra?"QUADRA":"RESERVA")+'</span>';
      h+='<input style="width:64px;background:rgba(0,0,0,.28);border:1px solid var(--brd);border-radius:9px;padding:8px" placeholder="nº" value="'+esc(p.nu==null?"":p.nu)+'" onchange="editPlayer(\''+t.id+'\',\''+p.id+'\',\'nu\',this.value)">';
      h+='<input style="flex:1;background:rgba(0,0,0,.28);border:1px solid var(--brd);border-radius:9px;padding:8px" value="'+esc(p.nm)+'" onchange="editPlayer(\''+t.id+'\',\''+p.id+'\',\'nm\',this.value)">';
      h+='<button class="btn sm" onclick="movePlayer(\''+t.id+'\',\''+p.id+'\',-1)" title="subir">↑</button>';
      h+='<button class="btn sm" onclick="movePlayer(\''+t.id+'\',\''+p.id+'\',1)" title="descer">↓</button>';
      h+='<button class="btn dgr sm" onclick="delPlayer(\''+t.id+'\',\''+p.id+'\')">×</button>';
      h+='</div>';
    });
    h+='<div class="row" style="margin-top:9px">';
    h+='<input id="np-'+t.id+'" placeholder="nome do atleta" style="flex:1;background:rgba(0,0,0,.28);border:1px solid var(--brd);border-radius:9px;padding:9px" onkeydown="if(event.key===\'Enter\')addPlayer(\''+t.id+'\')">';
    h+='<button class="btn" onclick="addPlayer(\''+t.id+'\')">+ Atleta</button></div>';
    h+='</div>';
  });

  /* jogos */
  h+='<h2 class="sec">JOGOS</h2>';
  if(ts.length<2)h+='<div class="banner inf">Crie pelo menos 2 equipes para montar jogos.</div>';
  else{
    var opt=function(sel){var s="";ts.forEach(function(t){s+='<option value="'+t.id+'"'+(sel===t.id?" selected":"")+'>'+esc(t.n)+'</option>';});return s;};
    h+='<div class="card"><div class="row">';
    h+='<div class="fld" style="flex:1"><span>EQUIPE A</span><select id="ng-a">'+opt(ts[0].id)+'</select></div>';
    h+='<div class="fld" style="flex:1"><span>EQUIPE B</span><select id="ng-b">'+opt(ts[1].id)+'</select></div>';
    h+='<div class="fld"><span>DATA</span><input id="ng-dt" type="date" value="'+(new Date().toISOString().slice(0,10))+'"></div>';
    h+='<div class="fld"><span>HORÁRIO</span><input id="ng-tm" type="time"></div>';
    h+='<button class="btn pri" style="align-self:flex-end" onclick="novoJogo()">+ Criar jogo</button>';
    h+='</div></div>';
  }
  var gs=coresOrderGames(gamesRes());
  gs.forEach(function(g){
    var a=tF(g.a),b=tF(g.b);
    var nomeA=a?a.n:coresLadoLabel(g,"A",D.teams), nomeB=b?b.n:coresLadoLabel(g,"B",D.teams);
    var st=calc(g);
    h+='<div class="gcard"><div class="gc-vs">';
    if(coresFase(g)!=="class")h+='<span class="fasetag">'+esc(CORES_FASES[coresFase(g)].l)+'</span>';
    h+='<span class="dot" style="background:'+esc(a?a.cor:"#334155")+'"></span><b'+(a?'':' class="pend"')+'>'+esc(nomeA)+'</b>';
    h+='<span class="faint">×</span><span class="dot" style="background:'+esc(b?b.cor:"#334155")+'"></span><b'+(b?'':' class="pend"')+'>'+esc(nomeB)+'</b>';
    h+='</div><div class="gc-sc">'+st.pts.A+'-'+st.pts.B+'</div>';
    h+='<div class="gc-meta" style="min-width:110px">'+(g.dt?fD(g.dt):"")+(g.tm?" "+esc(g.tm):"")+'</div>';
    h+='<span class="pill '+(g.st==="ao_vivo"?"live":(g.st==="finalizada"?"fim":"age"))+'">'+(g.st==="ao_vivo"?"AO VIVO":(g.st==="finalizada"?"FIM":"AGENDADO"))+'</span>';
    if(a&&b)h+='<button class="btn sm" onclick="go(\'mesa\',\'&g='+g.id+'\')">Mesa</button>';
    h+='<button class="btn dgr sm" onclick="delJogo(\''+g.id+'\')">Excluir</button>';
    h+='</div>';
  });
  h+=rAdminFaseFinal();
  h+='<div class="faint" style="font-size:11px;margin-top:22px;line-height:1.6">Módulo isolado do RS-Scout · dados em <code>/torneio-cores</code> · build '+CORES_BUILD+'</div>';
  return h;
}
/* FASE FINAL — o formato e escolhido na hora, com a classificacao na tela.
   Nada e decidido antes: da para gerar, apagar e gerar de novo. */
function rAdminFaseFinal(){
  var ts=teamsArr();
  if(ts.length<2)return "";
  var todos=gamesArr();
  var classif=todos.filter(function(g){return coresFase(g)==="class";});
  if(!classif.length)return "";
  var mata=todos.filter(function(g){return coresFase(g)!=="class";});
  var pendentes=classif.filter(function(g){return g.st!=="finalizada"&&!calc(g).done;});
  var S=coresStandings(todos,ts,D.events,D.config);
  var comJogo=S.filter(function(r){return r.j>0;});

  var h='<h2 class="sec">FASE FINAL<span class="sec-sub">depois da classificatória</span></h2>';

  if(mata.length){
    h+='<div class="card"><div class="row" style="align-items:flex-start">';
    h+='<div style="flex:1;min-width:220px"><b>Fase final já criada</b><div class="faint" style="font-size:12px;margin-top:6px;line-height:1.6">';
    mata.forEach(function(g){
      var gr=gRes(g.id)||g;
      h+='· '+esc(CORES_FASES[coresFase(g)].l)+': '+esc(coresLadoLabel(gr,"A",D.teams))+' × '+esc(coresLadoLabel(gr,"B",D.teams))+'<br>';
    });
    h+='</div></div>';
    h+='<button class="btn dgr" onclick="apagarFaseFinal()">Apagar e refazer</button>';
    h+='</div></div>';
    return h;
  }

  h+='<div class="card">';
  if(pendentes.length){
    h+='<div class="banner err" style="margin:0 0 14px"><b>Ainda faltam '+pendentes.length+' jogo(s) da classificatória.</b> ';
    h+='Dá para gerar assim mesmo, mas o chaveamento sai pela classificação de agora — o certo é gerar depois que todos terminarem.</div>';
  }
  h+='<div class="faint" style="font-size:11px;font-weight:800;letter-spacing:1.2px;margin-bottom:8px">CLASSIFICAÇÃO DE AGORA</div>';
  h+='<div class="pool" style="margin-bottom:14px">';
  S.forEach(function(r,i){
    h+='<span class="poolp" style="cursor:default"><span class="poolp-nu" style="background:'+esc(r.cor)+'">'+(i+1)+'</span>'+esc(r.n)+' <span class="faint">'+r.pts+' pts</span></span>';
  });
  h+='</div>';

  if(comJogo.length<2){
    h+='<div class="faint">Nenhum jogo encerrado ainda — a classificação precisa de resultados para montar o chaveamento.</div></div>';
    return h;
  }
  h+='<div class="faint" style="font-size:11px;font-weight:800;letter-spacing:1.2px;margin-bottom:8px">COMO VAI SER?</div>';
  h+='<div class="fasegrid">';
  h+='<button class="faseopt" onclick="gerarFaseFinal(\'final\',false)">'
    +'<b>Final direta</b><span>1º × 2º · um jogo só</span>'
    +'<i>'+esc(S[0]?S[0].n:"1º")+' × '+esc(S[1]?S[1].n:"2º")+'</i></button>';
  var pode4=(ts.length>=4&&S.length>=4&&comJogo.length>=4);
  h+='<button class="faseopt'+(pode4?"":" off")+'"'+(pode4?' onclick="gerarFaseFinal(\'semi\',false)"':' disabled')+'>'
    +'<b>Semifinais + final</b><span>1º×4º e 2º×3º</span>'
    +'<i>'+(pode4?esc(S[0].n)+' × '+esc(S[3].n)+' · '+esc(S[1].n)+' × '+esc(S[2].n):"precisa de 4 equipes com jogo")+'</i></button>';
  h+='<button class="faseopt'+(pode4?"":" off")+'"'+(pode4?' onclick="gerarFaseFinal(\'semi\',true)"':' disabled')+'>'
    +'<b>Semifinais + 3º lugar + final</b><span>com disputa de terceiro</span>'
    +'<i>'+(pode4?"4 jogos":"precisa de 4 equipes com jogo")+'</i></button>';
  h+='</div>';
  h+='<div class="faint" style="font-size:11px;margin-top:12px;line-height:1.6">A final nasce como “vencedor da semifinal 1 × vencedor da semifinal 2” e as equipes entram sozinhas quando as semis terminarem. Jogos de fase final <b>não</b> entram na tabela de classificação.</div>';
  h+='</div>';
  return h;
}
function gerarFaseFinal(modo,com3o){
  var ts=teamsArr();
  var S=coresStandings(gamesArr(),ts,D.events,D.config);
  var hoje=(new Date()).toISOString().slice(0,10);
  var jogos=coresBracket(S,modo,com3o,{dt:hoje,prefixo:"f_"+Date.now().toString(36)});
  if(!jogos.length){toast("Não deu para montar — faltam equipes classificadas","err");return;}
  var nomes=jogos.map(function(g){return CORES_FASES[g.fase].l;}).join(", ");
  if(!confirm("Criar "+jogos.length+" jogo(s): "+nomes+"?"))return;
  var falta=jogos.length;
  jogos.forEach(function(g){
    writeNode("games/"+g.id,g).then(function(){
      falta--; if(falta===0)toast("Fase final criada","ok");
    });
  });
}
function apagarFaseFinal(){
  var mata=gamesArr().filter(function(g){return coresFase(g)!=="class";});
  if(!mata.length)return;
  if(!confirm("Apagar os "+mata.length+" jogo(s) da fase final e tudo que foi marcado neles?"))return;
  mata.forEach(function(g){
    db.ref(ROOT+"/events/"+g.id).remove().catch(function(){});
    db.ref(ROOT+"/games/"+g.id).remove().catch(onWriteErr);
  });
  toast("Fase final apagada","ok");
}
function val(id){var e=document.getElementById(id);return e?e.value:"";}
function salvarConfig(){
  var c={nome:val("cf-n"),setPoints:+val("cf-sp")||21,vantagem:+val("cf-va"),
    emQuadra:+val("cf-eq")||4,ptsVitoria:+val("cf-pv"),ptsDerrota:+val("cf-pd"),
    dedupeMs:Math.round((parseFloat(val("cf-dd"))||0)*1000)};
  if(isNaN(c.vantagem))c.vantagem=2;
  writeNode("config",c).then(function(){toast("Configuração salva","ok");});
}
function novaEquipe(){
  var n=(val("nt-n")||"").trim(),c=val("nt-c")||"#2563eb";
  if(!n){toast("Informe o nome da equipe","err");return;}
  var id=uid("c_");
  writeNode("teams/"+id,{id:id,n:n.toUpperCase(),cor:c,ordem:teamsArr().length,players:[]})
    .then(function(){toast("Equipe criada","ok");var e=document.getElementById("nt-n");if(e)e.value="";});
}
function editEquipe(tid,campo,v){
  var t=tF(tid);if(!t)return;
  writeNode("teams/"+tid+"/"+campo,campo==="n"?String(v).toUpperCase():v);
}
function delEquipe(tid){
  var t=tF(tid);if(!t)return;
  var usada=gamesArr().some(function(g){return g.a===tid||g.b===tid;});
  if(usada){toast("Equipe está em um jogo — exclua o jogo antes","err");return;}
  if(!confirm("Excluir a equipe "+t.n+"?"))return;
  db.ref(ROOT+"/teams/"+tid).remove().catch(onWriteErr);
}
function addPlayer(tid){
  var t=tF(tid);if(!t)return;
  var el=document.getElementById("np-"+tid);
  var nm=(el&&el.value||"").trim();
  if(!nm){toast("Informe o nome","err");return;}
  var ps=playersOf(t).slice();
  ps.push({id:uid("p_"),nm:nm.toUpperCase(),nu:""});
  writeNode("teams/"+tid+"/players",ps).then(function(){if(el)el.value="";});
}
function editPlayer(tid,jid,campo,v){
  var t=tF(tid);if(!t)return;
  var ps=playersOf(t).slice();
  for(var i=0;i<ps.length;i++)if(ps[i].id===jid)ps[i][campo]=(campo==="nm"?String(v).toUpperCase():v);
  writeNode("teams/"+tid+"/players",ps);
}
function movePlayer(tid,jid,dir){
  var t=tF(tid);if(!t)return;
  var ps=playersOf(t).slice();
  var i=-1;for(var k=0;k<ps.length;k++)if(ps[k].id===jid){i=k;break;}
  var j=i+dir;
  if(i<0||j<0||j>=ps.length)return;
  var tmp=ps[i];ps[i]=ps[j];ps[j]=tmp;
  writeNode("teams/"+tid+"/players",ps);
}
function delPlayer(tid,jid){
  var t=tF(tid);if(!t)return;
  var ps=playersOf(t).filter(function(p){return p.id!==jid;});
  writeNode("teams/"+tid+"/players",ps);
}
function novoJogo(){
  var a=val("ng-a"),b=val("ng-b");
  if(!a||!b||a===b){toast("Escolha duas equipes diferentes","err");return;}
  var id=uid("j_");
  writeNode("games/"+id,{id:id,a:a,b:b,dt:val("ng-dt")||"",tm:val("ng-tm")||"",st:"agendada"})
    .then(function(){toast("Jogo criado","ok");});
}
function delJogo(gid){
  if(!confirm("Excluir o jogo e todas as ações marcadas nele?"))return;
  db.ref(ROOT+"/events/"+gid).remove().catch(function(){});
  db.ref(ROOT+"/games/"+gid).remove().catch(onWriteErr);
}

/* ---------- start ---------- */
render();
boot();
setInterval(function(){if(VIEW==="telao")render();},5000);
</script>
