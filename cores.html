<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RS-Scout · Mini Minis - Cores</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700&family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
/* Paleta da marca RS Voleibol — a mesma do site institucional.
   --acc (magenta) substitui o dourado, que nao era cor da RS.
   Verde/vermelho/laranja NAO mudam: sao semanticos (acerto, erro, atencao). */
:root{
  --bg1:#170a1e;--bg2:#241030;--bg3:#0f0614;
  --fg:#f7eef5;--mute:rgba(247,238,245,.66);--faint:rgba(247,238,245,.62);
  --card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--brd:rgba(255,255,255,.13);
  --acc:#FF4D9D;--acc2:#A93FC0;--acc-ink:#2A0A1A;
  --green:#059669;--red:#dc2626;--orange:#ea580c;--blue:#2563eb;--gray:#64748b;
  --leao:.05;              /* forca da marca d'agua do leao */
  --sombra:rgba(0,0,0,.45);
  /* Superficies e sinais por TOKEN. Antes o tema claro sobrescrevia .btn
     inteiro e vencia .btn.pri/.dgr/.falta por especificidade — o botao
     principal ficava com 1.2:1 de contraste (ilegivel). Com token, cada
     variante continua mandando na propria cor. */
  --btn-bg:rgba(255,255,255,.08);--btn-bg-h:rgba(255,255,255,.14);
  --surf:rgba(0,0,0,.20);            /* fbox, slot vazio, benchrow, fitem */
  --surf-2:rgba(255,255,255,.05);    /* teamchoice, faseopt, poolp, pickteam-cta */
  --surf-2h:rgba(255,255,255,.11);
  --linha:rgba(255,255,255,.07);     /* divisorias de tabela */
  --halo:rgba(255,255,255,.14);      /* anel do .dot */
  --ok:#6ee7b7;--bad:#fca5a5;--info:#93c5fd;
  /* Tres familias, tres papeis que nao se sobrepoem:
     Cinzel = assinatura da marca (um lugar so) · Inter = toda a interface ·
     Bebas = APENAS numero grande em espaco apertado (placar, posicao, sigla).
     JetBrains Mono saiu: cobria 9 rotulos maiusculos de 9-10px que a Inter 700
     com letter-spacing desenha melhor, e economiza uma familia inteira. */
  --ui:'Inter',system-ui,sans-serif;
  --wm:'Cinzel',serif;
  --num:'Bebas Neue','Inter',sans-serif;
}
/* Tema CLARO — para notebook em ginasio iluminado. */
body.claro{
  --bg1:#ffffff;--bg2:#FCF4F8;--bg3:#F6E8F0;
  --fg:#2A0A1A;--mute:#5a2a44;--faint:rgba(42,10,26,.68);
  --card:rgba(216,27,121,.045);--card2:rgba(216,27,121,.09);--brd:rgba(216,27,121,.18);
  --acc:#D81B79;--acc2:#8B2FA0;--acc-ink:#ffffff;
  --leao:.045;
  --sombra:rgba(216,27,121,.14);
  --btn-bg:rgba(216,27,121,.07);--btn-bg-h:rgba(216,27,121,.14);
  --surf:rgba(216,27,121,.05);
  --surf-2:rgba(216,27,121,.05);
  --surf-2h:rgba(216,27,121,.12);
  --linha:rgba(42,10,26,.10);
  --halo:rgba(42,10,26,.14);
  --ok:#047857;--bad:#b91c1c;--info:#1d4ed8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(70% 50% at 50% -5%, rgba(216,27,121,.12), transparent 60%),
    radial-gradient(60% 45% at 50% 110%, rgba(139,47,160,.12), transparent 60%),
    linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed}
/* MARCA D'AGUA — o leao ao fundo, fixo, atras de tudo e sem capturar toque.
   Fica FORA da mesa do operador (body.trabalho): ali a tela e ferramenta,
   qualquer coisa competindo com os cards atrapalha quem esta marcando. */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:url("rs-leao.png") no-repeat right -6vw bottom -8vh;
  background-size:auto 78vh;opacity:var(--leao);
  filter:saturate(1.1)}
body.trabalho::before{opacity:0}
#app{position:relative;z-index:1}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}

/* ---- header ---- */
.hd{position:sticky;top:0;z-index:40;background:rgba(15,6,20,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--brd)}
.hd-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.hd-ti{font-family:'Cinzel',serif;font-weight:700;font-size:17px;letter-spacing:.1em;line-height:1.15;
  text-transform:uppercase;
  background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hd-sub{font-family:var(--ui);font-size:9px;letter-spacing:.32em;color:var(--faint);font-weight:600;margin-top:3px}
.hd-marca{display:flex;align-items:center;gap:11px;min-width:0}
.hd-marca img{height:34px;width:auto;flex-shrink:0}
.hd-tema{background:transparent;border:1px solid var(--brd);border-radius:99px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:.15s}
.hd-tema:hover{background:var(--card2);border-color:var(--acc)}
.hd-nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.hd-nav a{font-size:11px;font-weight:700;letter-spacing:.6px;text-decoration:none;color:var(--mute);
  padding:8px 12px;border-radius:9px;border:1px solid transparent;transition:.13s}
.hd-nav a:hover{color:var(--fg);background:var(--surf-2h)}
.hd-nav a.on{color:var(--acc-ink);background:var(--acc);border-color:var(--acc)}

/* ---- blocos ---- */
h2.sec{font-family:var(--ui);font-weight:800;font-size:20px;letter-spacing:.02em;text-transform:uppercase;margin:26px 0 12px;color:var(--fg)}
.card{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:16px;margin-bottom:12px}
.muted{color:var(--mute)}.faint{color:var(--faint)}
.btn{background:var(--btn-bg);border:1px solid var(--brd);border-radius:10px;padding:10px 15px;
  font-weight:700;font-size:13px;transition:.13s}
.btn:hover{background:var(--btn-bg-h)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dgr{background:rgba(220,38,38,.18);border-color:rgba(220,38,38,.45);color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:11px;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:10px;letter-spacing:1.2px;font-weight:800;color:var(--faint)}
.fld input,.fld select{background:rgba(0,0,0,.28);border:1px solid var(--brd);border-radius:9px;padding:9px 11px;width:100%}
.fld input[type=color]{padding:3px;height:40px;cursor:pointer}
.grid{display:grid;gap:10px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1px;
  padding:4px 9px;border-radius:99px;border:1px solid var(--brd)}
.dot{display:inline-block;vertical-align:middle;width:12px;height:12px;border-radius:99px;flex-shrink:0;box-shadow:0 0 0 2px var(--halo)}
.crest{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-size:17px;letter-spacing:.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);
  box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.22)}
.crest.lg{width:60px;height:60px;font-size:26px;border-radius:16px}
.crest.xl{width:96px;height:96px;font-size:42px;border-radius:22px}

/* ---- tinta legivel sobre a cor da equipe ----
   Num torneio POR CORES a cor vem do cadastro: pode ser amarela, branca, verde
   clara. Texto branco fixo dava 1.92:1 na amarela e 1.0:1 na branca. A formula
   escolhe preto ou branco pela luminosidade da propria cor (--c). */
@supports (color: oklch(from red l c h)){
  .crest,.pbtn .pos,.poolp-nu,.slot-n{
    color:oklch(from var(--c,#888) clamp(0,(l - 0.6) * -1000,1) 0 0);
    text-shadow:none}
}

/* ---- contorno de seguranca em tudo que CARREGA a cor da equipe ----
   O branco sobre fundo claro (1.08:1) e o preto sobre fundo escuro (1.01:1)
   viravam mancha invisivel. O anel usa a cor do TEXTO do tema, entao aparece
   com qualquer cor de equipe. */
.crest,.pbtn .pos,.poolp-nu,.slot-n,.dot,.ladder i{
  outline:1px solid color-mix(in srgb,var(--fg) 34%,transparent);
  outline-offset:-1px}
.crest{outline-width:2px}

/* ---- icone de fundamento ----
   O emoji some quando o fundo e da mesma familia de cor (colisao vermelha no
   vermelho do ataque, tijolo laranja no laranja do bloqueio). text-shadow NAO
   resolve: emoji e bitmap colorido e nao herda `color`. drop-shadow resolve,
   porque age sobre o desenho ja renderizado — halo claro para descolar do
   fundo, sombra escura para dar peso. */
.ico{display:inline-block;margin-right:6px;line-height:1;
  /* Halo de 1px nao vencia vermelho-sobre-vermelho (o 💥 no fundo do ataque).
     drop-shadow empilhado engrossa o contorno: cada camada desenha por cima da
     anterior, entao 4 camadas brancas viram uma borda solida que RECORTA o
     emoji do fundo, qualquer que seja a cor dele. */
  filter:
    drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff)
    drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px rgba(255,255,255,.9))
    drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.dest-fund .ico{margin-right:5px}

/* ---- faixa de cor: substitui o escudo com iniciais ----
   O nome da equipe ja esta escrito ao lado; a sigla dentro de uma caixa so
   repetia a informacao. A faixa identifica a cor sem virar mais um retangulo
   com texto. */
.faixa{display:inline-block;flex-shrink:0;width:6px;height:34px;border-radius:99px;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--fg) 22%,transparent)}
.faixa.lg{width:8px;height:52px}
.faixa.xl{width:10px;height:66px}
/* O modificador da faixa do telao chamava-se "tl" e COLIDIA com a classe do
   container do telao: a faixa herdava padding:22px 26px e height:100vh dele, e
   so por acidente virava um bloco de 52px. Agora tem nome proprio e tamanho
   declarado. */
.faixa.telao{width:clamp(46px,5vw,96px);height:clamp(58px,8vh,120px);margin:0 auto 14px;display:block;border-radius:99px}
/* No telao a faixa e grande e fica sozinha no fundo: 1px de anel some. Preto
   no fundo escuro e branco no fundo claro precisam de contorno de verdade. */
.faixa.telao,.faixa.campea-tl{box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 72%,transparent)}
.faixa.campea-tl{width:clamp(14px,1.6vw,26px);height:clamp(90px,16vh,200px);display:block;margin:0 auto}
.pickteam-cor{display:block;width:64px;height:8px;border-radius:99px;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--fg) 22%,transparent)}

/* ---- previa da tabela (admin) ----
   Lista simples, sem contorno por jogo: o ponto de cor ja identifica a equipe e
   o nome esta escrito ao lado. */
.tabres{margin-top:13px;font-size:14px;line-height:1.6}
.tabres b{font-family:var(--num);font-size:26px;letter-spacing:1px;vertical-align:-2px;margin-right:2px}
.tabprev{margin-top:14px;border-top:1px solid var(--linha);padding-top:12px}
.tabrod{font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--mute);margin:14px 0 7px}
.tabprev>.tabrod:first-child{margin-top:0}
.tabjg{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:10px;
  background:var(--surf);margin-bottom:5px;font-size:14px}
.tabjg b{font-weight:700}
.tabjg.ja{opacity:.45}
.tabja{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:1.1px;color:var(--mute)}

/* ---- mural de jogos ---- */
.gcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--brd);
  border-radius:14px;padding:14px 16px;margin-bottom:10px;transition:.13s}
.gcard:hover{background:var(--card2)}
.gcard.live{border-color:rgba(220,38,38,.5);background:rgba(220,38,38,.08)}
.gc-vs{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.gc-nm{font-family:var(--ui);font-weight:800;font-size:17px;letter-spacing:.01em;line-height:1.15}
.gc-sc{font-family:var(--num);font-size:30px;letter-spacing:1px;min-width:78px;text-align:center;font-variant-numeric:tabular-nums}
.gc-meta{font-size:11px;color:var(--faint);font-weight:600}
.pill{font-family:var(--ui);font-size:9px;font-weight:700;letter-spacing:.14em;padding:3px 8px;border-radius:99px}
.pill.live{background:var(--red);color:#fff;animation:pulse 1.8s infinite}
.pill.fim{background:rgba(255,255,255,.1);color:var(--mute)}
.pill.age{background:color-mix(in srgb,var(--info) 22%,transparent);color:var(--info)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ---- MESA (scout) ---- */
.mesa-top{display:flex;align-items:stretch;gap:12px;margin:14px 0;flex-wrap:wrap}
.mesa-side{flex:1;min-width:200px;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;
  border:2px solid transparent;transition:.15s}
.mesa-side.mine{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.mesa-side .pts{margin-left:auto;font-family:var(--num);font-size:54px;line-height:.9}
.mesa-side .nm{font-family:var(--ui);font-weight:800;font-size:21px;letter-spacing:-.01em;line-height:1.1}
.mesa-side .sub{font-family:var(--ui);font-size:9px;font-weight:600;letter-spacing:.14em;opacity:.75}
.serve-badge{font-size:10px;font-weight:800;letter-spacing:1px;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:99px;display:inline-block;margin-top:4px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;margin-bottom:6px}
.pbtn{background:var(--card);border:2px solid var(--brd);border-radius:13px;padding:12px 10px;text-align:left;
  display:flex;align-items:center;gap:10px;transition:.12s;position:relative;overflow:hidden}
.pbtn:hover{background:var(--card2)}
/* Dois estados, duas linguagens — antes os dois usavam borda magenta e o fundo
   mudava 1.05:1 (invisivel). Confundir "onde vou gravar" com "quem saca" faz
   marcar fundamento no atleta errado.
   SELECIONADO = alvo da acao: magenta forte, com anel. */
.pbtn.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 45%,transparent)}
body.claro .pbtn.on{background:color-mix(in srgb,var(--acc) 14%,#fff)}
.pbtn.serving::after{content:"🏐";position:absolute;top:5px;right:7px;font-size:13px}
.pbtn .nu{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-size:16px;flex-shrink:0;color:#fff}
.pbtn .pn{font-weight:800;font-size:13px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn .pr{font-size:9px;color:var(--faint);font-weight:700;letter-spacing:.6px}
.pbtn.bench{opacity:.62;padding:8px 9px}
.pbtn.bench .nu{width:24px;height:24px;font-size:13px}

.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.fbox{border:1px solid var(--brd);border-radius:13px;overflow:hidden;background:var(--surf)}
.fbox .fh{font-family:var(--ui);font-weight:800;font-size:12px;letter-spacing:.09em;text-transform:uppercase;padding:8px 11px;color:#fff}
.fbox .fb{display:flex;gap:5px;padding:7px;flex-wrap:wrap}
.fbox .fb button{flex:1;min-width:52px;border-radius:9px;padding:13px 4px;font-weight:800;font-size:13px;
  color:#fff;transition:.1s;letter-spacing:.4px}
.fbox .fb button:hover{filter:brightness(1.18)}
.fbox .fb button:active{transform:scale(.95)}
.needp .fgrid{opacity:.42;pointer-events:none;filter:grayscale(.5)}

.feed{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
.fitem{display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 10px;border-radius:9px;background:var(--surf)}
.fitem b{font-weight:800}
.fitem .oc{font-weight:800;font-size:11px;padding:2px 7px;border-radius:6px;color:#fff}
.fitem.dup{opacity:.55}
.ladder{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.ladder i{width:11px;height:16px;border-radius:3px;display:block}

/* ---- rotulo secundario das secoes (era ilegivel: 12px no cinza mais fraco) ---- */
h2.sec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.sec .sec-sub{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.2px;
  color:var(--mute);text-transform:none}
h2.sec .sec-sub::before{content:"· "}

/* ---- escolha da equipe do aparelho ---- */
.pickteam{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pickteam-btn{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,transparent),rgba(255,255,255,.04));
  border:2px solid var(--c);border-radius:20px;padding:26px 18px;display:flex;flex-direction:column;
  align-items:center;gap:8px;transition:.15s}
.pickteam-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
.pickteam-nm{font-family:var(--ui);font-weight:800;font-size:26px;letter-spacing:-.01em;line-height:1.1}
.pickteam-sub{font-size:12px;color:var(--mute);font-weight:600}
.pickteam-cta{margin-top:6px;font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--c);
  background:var(--surf-2);padding:7px 14px;border-radius:99px}

/* ---- placar ---- */
.mesa-side{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,transparent),rgba(255,255,255,.03))}
.mesa-side.serving{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 55%,transparent)}
/* os dois ao mesmo tempo (o estado mais comum): antes o "serving" apagava o
   anel de "e esta que eu marco" — mesma especificidade, ultima regra vencia */
.mesa-side.mine.serving{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent),
  inset 0 0 0 2px color-mix(in srgb,var(--acc) 55%,transparent)}
.mesa-id{min-width:0;flex:1}
.mesa-side .pts{font-variant-numeric:tabular-nums;text-shadow:0 3px 14px rgba(0,0,0,.45)}

/* ---- passos do setup ---- */
.step{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.step.done{border-color:rgba(5,150,105,.42);background:rgba(5,150,105,.07)}
.step-hd{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;margin-bottom:8px}
.step-n{width:24px;height:24px;border-radius:99px;background:var(--acc);color:var(--acc-ink);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.step.done .step-n{background:var(--green);color:#fff}
.step-ok{margin-left:auto;font-size:11px;font-weight:800;color:var(--ok);letter-spacing:.5px}
.step-hint{font-size:12px;color:var(--mute);line-height:1.55;margin-top:8px}
.teamchoice{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;padding:13px 18px;
  border-radius:12px;border:2px solid var(--brd);background:var(--surf-2);transition:.13s}
.teamchoice:hover{background:var(--surf-2h)}
.teamchoice.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 24%,transparent)}

/* ---- posicoes 1..N da ordem de saque ---- */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:12px 0}
.slot{display:flex;align-items:center;gap:10px;border-radius:13px;padding:14px 13px;min-height:58px;
  border:2px dashed var(--brd);background:var(--surf);transition:.13s}
.slot.filled{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);cursor:pointer}
/* o preenchido vem depois do :not(.filled) — o vazio e que leva a superficie neutra */
.slot:not(.filled){background:var(--surf)}
.slot.filled:hover{filter:brightness(1.15)}
.slot-n{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.14);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:17px}
.slot.filled .slot-n{background:rgba(0,0,0,.35)}
.slot-nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-empty{font-size:12px;color:var(--faint);font-weight:600}
.slot-x{margin-left:auto;font-size:16px;color:var(--mute);font-weight:800}

/* ---- elenco disponivel ---- */
.pool{display:flex;flex-wrap:wrap;gap:8px}
.poolp{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:8px 14px 8px 8px;
  border-radius:99px;border:1px solid var(--brd);background:var(--surf-2);transition:.13s}
.poolp:hover:not(:disabled){background:var(--surf-2h);border-color:var(--c)}
.poolp.used{opacity:.32;cursor:default}
.poolp-nu{width:26px;height:26px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--num);font-size:14px;color:#fff;flex-shrink:0}

/* ---- reservas / substituicao ---- */
.benchrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--surf);
  border:1px solid var(--brd);border-radius:13px;padding:10px 14px;margin-top:10px}
.benchlb{font-family:var(--ui);font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--faint)}
.benchp{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--mute)}
.benchrow .btn{margin-left:auto}
.subbar{background:rgba(255,77,157,.12);border:1px solid rgba(255,77,157,.4);border-radius:13px;
  padding:13px 15px;margin-top:10px;font-size:13px}

/* ---- cards dos atletas ---- */
.pbtn{padding:12px 13px;gap:12px}
.pbtn .pos{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-family:var(--num);font-size:19px;color:#fff;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.pbtn .pn{font-size:14px}
.pbtn .pr{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.5px;margin-top:2px}
.pbtn .pr .saca{color:var(--acc);letter-spacing:.8px}
.pbtn .pr .sai{color:var(--bad);letter-spacing:.8px}
.pbtn .camisa{opacity:.65}
/* SACANDO = estado informativo: cor da PROPRIA equipe, sem anel. */
.pbtn.serving{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);box-shadow:none}
.pbtn.on.serving{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 45%,transparent)}
.pbtn.serving::after{content:none}
.pbtn.subpick{border-style:dashed}
.pbtn.out{border-color:var(--red);background:rgba(220,38,38,.16)}
.pbtn.ghost{opacity:.5;justify-content:center}
.pbtn .pr{text-transform:uppercase}

.fasegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.faseopt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:15px 16px;border-radius:14px;
  border:2px solid var(--brd);background:var(--surf-2);transition:.13s}
.faseopt:hover:not(.off){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.faseopt.off{opacity:.4;cursor:not-allowed}
.faseopt b{font-size:14px}
.faseopt span{font-size:11px;color:var(--mute)}
.faseopt i{font-style:normal;font-size:11px;font-weight:800;color:var(--acc);margin-top:4px}
.faseopt.off i{color:var(--faint)}
.fasetag{font-size:9px;font-weight:800;letter-spacing:1.2px;padding:3px 8px;border-radius:99px;
  background:rgba(255,77,157,.18);color:var(--acc);border:1px solid rgba(255,77,157,.35)}
.crest.vazio{box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);color:var(--faint)}
.gc-nm.pend,b.pend{color:var(--faint);font-style:italic}
.campeao{display:flex;align-items:center;gap:20px;margin:18px 0 6px;padding:22px 24px;border-radius:20px;
  border:2px solid var(--c);background:linear-gradient(120deg,color-mix(in srgb,var(--c) 26%,transparent),rgba(255,255,255,.04))}
.campeao-lb{font-family:var(--ui);font-size:10px;font-weight:700;letter-spacing:.3em;color:var(--acc)}
.campeao-nm{font-family:var(--num);font-size:46px;letter-spacing:1px;line-height:1;font-variant-numeric:tabular-nums}
.ctrls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:16px;border-top:1px solid var(--brd)}
.ctrl-lb{font-family:var(--ui);font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--faint);margin-left:6px}
.ctrls .ctrl-lb:first-child{margin-left:0}
.faltabar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.btn.falta{background:rgba(234,88,12,.2);border-color:rgba(234,88,12,.55);color:#fdba74;font-size:14px;padding:12px 18px}
.btn.falta:hover{background:rgba(234,88,12,.32)}
.btn.pontonos{background:rgba(5,150,105,.22);border-color:rgba(5,150,105,.55);color:var(--ok);font-size:14px;padding:12px 18px}
.btn.pontonos:hover{background:rgba(5,150,105,.34)}
.btn.pontoadv{background:rgba(37,99,235,.2);border-color:rgba(37,99,235,.55);color:#93c5fd;font-size:14px;padding:12px 18px}
.btn.pontoadv:hover{background:rgba(37,99,235,.32)}
.faltahint{font-size:11px;color:var(--mute);line-height:1.6;max-width:56ch}
.faltahint summary{cursor:pointer;font-weight:700;color:var(--acc);list-style:none;padding:4px 0}
.faltahint summary::-webkit-details-marker{display:none}
.faltahint summary::before{content:"? ";font-weight:800}
.faltahint[open] summary{margin-bottom:5px}

/* A mesa e ferramenta: aproveita a largura do notebook (o resto do app fica em
   1180px, bom para leitura). */
body.trabalho .wrap{max-width:min(1560px,96vw)}
/* O "Desfazer" comecava em y=761 num 1366x768 — fora da tela. */
@media(min-height:640px){
  body.trabalho .ctrls{position:sticky;bottom:0;z-index:30;background:var(--bg2);
    border-top:1px solid var(--brd);margin-top:14px;padding:10px 6px}
}
/* cards de atleta: com auto-fill davam 7 colunas para 4 atletas */
.pgrid{grid-template-columns:repeat(auto-fit,minmax(170px,230px));justify-content:start}
/* alvo de toque do botao mais usado da tela */
.fbox .fb button{min-height:46px}
.btn.sm{min-height:34px}
.dupwhy{font-size:10px;margin-left:auto;color:var(--faint);text-align:right;line-height:1.3}
.banner.ok{background:rgba(5,150,105,.16);border:1px solid rgba(5,150,105,.45);color:#a7f3d0}
.btn:disabled{opacity:.4;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){.pill.live{animation:none}}

/* ===== Tema CLARO — so o que nao da para resolver por token =====
   As superficies e os sinais vem de --surf/--btn-bg/--ok/--bad/--linha, entao
   aqui ficam apenas os casos proprios do tema. NAO sobrescrever .btn inteiro:
   isso vencia .btn.pri e companhia por especificidade. */
body.claro .hd{background:rgba(255,255,255,.86);border-bottom-color:var(--brd)}
body.claro .fld input,body.claro .fld select,
body.claro .pool input,body.claro .row input{background:#fff;border-color:var(--brd);color:var(--fg)}
body.claro .pickteam-btn{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 18%,#fff),#fff)}
body.claro .toast{background:#2A0A1A;color:#fff;border-color:rgba(0,0,0,.2)}
body.claro .crest,body.claro .pbtn .pos{box-shadow:0 4px 12px var(--sombra),inset 0 0 0 2px rgba(255,255,255,.35)}
body.claro .pill.fim{background:rgba(42,10,26,.09);color:var(--mute)}
body.claro .slot-n,body.claro .slot.filled .slot-n{background:rgba(42,10,26,.12);color:var(--fg)}
body.claro .serve-badge{background:rgba(255,255,255,.85);color:var(--fg);box-shadow:inset 0 0 0 1px rgba(42,10,26,.12)}
body.claro .mesa-side .pts{text-shadow:none}
body.claro .stamp{color:rgba(42,10,26,.62);background:transparent}
body.claro .gcard.live{background:rgba(220,38,38,.07)}
body.claro .banner.inf{background:rgba(37,99,235,.09);color:#1e3a8a}
body.claro .banner.err{background:rgba(220,38,38,.09);color:#7f1d1d}
body.claro .banner.ok{background:rgba(5,150,105,.10);color:#065f46}
body.claro .step.done{background:rgba(5,150,105,.08)}
body.claro .subbar{background:rgba(216,27,121,.09);border-color:rgba(216,27,121,.3)}
body.claro .relcard-met{background:rgba(0,0,0,.22)}
/* variantes semanticas: cor propria em cada tema */
body.claro .btn.dgr{background:rgba(220,38,38,.10);border-color:rgba(220,38,38,.5);color:#991b1b}
body.claro .btn.falta{background:rgba(234,88,12,.12);color:#9a3412}
body.claro .btn.pontonos{background:rgba(5,150,105,.12);color:#065f46}
body.claro .btn.pontoadv{background:rgba(37,99,235,.10);color:#1e40af}

/* ---- pagina "em construcao" (publico) ---- */
.obras-tela{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 24px;gap:6px;position:relative;z-index:1}
.obras-leao{width:min(190px,42vw);height:auto;margin-bottom:22px;
  filter:drop-shadow(0 14px 40px rgba(216,27,121,.35))}
.obras-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--ui);
  font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--acc);
  border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);padding:8px 18px;border-radius:99px}
.obras-badge i{width:8px;height:8px;border-radius:99px;background:var(--acc);display:block;
  animation:pulse 1.8s infinite}
.obras-nm{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(26px,5.5vw,46px);letter-spacing:.08em;
  text-transform:uppercase;margin:20px 0 0;line-height:1.15;
  background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.obras-txt{max-width:44ch;color:var(--mute);font-size:15px;line-height:1.7;margin-top:14px}
.obras-volta{margin-top:30px;font-size:13px;font-weight:700;color:var(--acc);text-decoration:none;
  border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);padding:11px 22px;border-radius:99px;
  transition:.15s}
.obras-volta:hover{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.hd-obras{font-family:var(--ui);font-size:9px;font-weight:700;letter-spacing:.18em;
  color:var(--acc);border:1px dashed color-mix(in srgb,var(--acc) 50%,transparent);
  padding:6px 10px;border-radius:99px;cursor:pointer;white-space:nowrap}
.hd-obras:hover{background:color-mix(in srgb,var(--acc) 12%,transparent)}

/* ---- relatorio ---- */
.relfiltro{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:12px;font-weight:700;padding:8px 14px;border-radius:99px;border:1px solid var(--brd);
  background:var(--card);transition:.13s}
.chip:hover{background:var(--card2)}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.podio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.pod{border:2px solid var(--c);border-radius:18px;padding:18px 16px;text-align:center;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 20%,transparent),rgba(255,255,255,.03))}
.pod1{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent)}
.pod-pos{font-family:var(--num);font-size:20px;color:var(--acc);letter-spacing:1px}
.pod-nm{font-family:var(--ui);font-weight:800;font-size:24px;letter-spacing:-.01em;line-height:1.15;margin-top:2px}
.pod-eq{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;color:var(--mute);
  font-weight:700;margin-top:5px}
.pod-pts{font-family:var(--num);font-size:52px;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.pod-lb{font-family:var(--ui);font-size:9px;letter-spacing:.24em;color:var(--faint)}
.pod-det{font-size:11px;color:var(--mute);margin-top:9px;padding-top:9px;border-top:1px solid var(--brd)}
.relgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.relcard{border:1px solid var(--brd);border-radius:15px;overflow:hidden;background:var(--card)}
.relcard-hd{display:flex;align-items:center;gap:8px;font-family:var(--ui);font-weight:800;font-size:13px;
  letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;color:#fff}
.relcard-met{margin-left:auto;font-family:var(--ui);font-size:9px;letter-spacing:.14em;
  background:rgba(0,0,0,.28);padding:3px 8px;border-radius:99px}
.relcard-bd{padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.relrow{display:flex;align-items:center;gap:9px;font-size:13px}
.relpos{font-family:var(--ui);font-weight:700;font-size:12px;color:var(--faint);width:14px;flex-shrink:0}
.relnm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.relbar{flex:1;height:7px;border-radius:99px;background:color-mix(in srgb,var(--fg) 14%,transparent);overflow:hidden;min-width:40px}
.relbar i{display:block;height:100%;border-radius:99px}
.relpct{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.reldet{font-size:10px;color:var(--faint);min-width:5.5em;text-align:right}
.amostra{font-family:var(--ui);font-size:9px;letter-spacing:.1em;color:var(--faint);
  padding-bottom:4px;border-bottom:1px dashed var(--brd);margin-bottom:4px}
.relrow.pouco{opacity:.62}
body.claro .pod{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,#fff),#fff)}

.destgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:6px}
.dest{border:1px solid var(--brd);border-top:3px solid var(--f);border-radius:14px;padding:14px 15px;
  background:var(--card);display:flex;flex-direction:column;gap:2px}
.dest-fund{font-family:var(--ui);font-size:9px;font-weight:700;letter-spacing:.14em;
  color:var(--mute);text-transform:uppercase}
.dest-nm{font-family:var(--ui);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.2;margin-top:6px}
.dest-eq{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);font-weight:600}
.dest-pct{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:34px;line-height:1;color:var(--f);margin-top:8px}
.dest-pct small{font-size:.5em;margin-left:1px}
.dest-lb{font-size:10px;color:var(--faint);font-weight:600}

/* ---- tabela ---- */
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{font-size:9px;letter-spacing:1.2px;font-weight:800;color:var(--faint);text-align:right;padding:8px 7px;
  border-bottom:1px solid var(--brd);white-space:nowrap}
table.tb th:nth-child(-n+2),table.tb td:nth-child(-n+2){text-align:left}
table.tb td{padding:9px 7px;text-align:right;border-bottom:1px solid var(--linha)}
table.tb tr:last-child td{border-bottom:none}
table.tb td.nm{font-weight:800}
.tscroll{overflow-x:auto}

/* ---- telao ---- */
body.telao{overflow:hidden}
.tl{height:100vh;display:flex;flex-direction:column;padding:22px 26px;gap:16px;overflow:hidden;position:relative;z-index:1}
/* No telao o leao pode aparecer: e tela de exibicao, nao de trabalho. */
body.telao::before{opacity:var(--leao);background-position:center center;background-size:auto 92vh}
body.claro.telao::before{opacity:.03}
/* o bloco de baixo ocupava 18% da tela entregando texto de 9px, ilegivel a
   distancia de ginasio */
.tl-bot .hd-sub{font-size:clamp(11px,.9vw,16px)}
.tl-bot table.tb{font-size:clamp(15px,1.25vw,24px)}
.tl-bot table.tb td{padding:6px 8px}
.tl-bot table.tb th{font-size:clamp(10px,.7vw,13px)}
.tl-nm{font-family:var(--num)}
.tl-hd{display:flex;align-items:center;gap:14px}
.tl-main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:26px}
.tl-team{flex:1;text-align:center}
.tl-nm{font-family:var(--ui);font-weight:800;font-size:clamp(26px,4.2vw,58px);letter-spacing:-.01em;line-height:1.05}
.tl-pt{font-family:var(--num);font-size:clamp(80px,17vw,230px);line-height:.82;font-variant-numeric:tabular-nums;color:var(--fg)}
/* A cor da equipe como TINTA do placar precisa do caminho inverso da tinta
   sobre fundo colorido: no tema escuro nunca pode ficar escura demais, no claro
   nunca clara demais — as cores oficiais incluem BRANCO e PRETO. Tem que vir
   DEPOIS da regra base: mesma especificidade, a ultima vence. */
@supports (color: oklch(from red l c h)){
  .tl-pt{color:oklch(from var(--c,#888) max(l,.62) c h)}
  body.claro .tl-pt{color:oklch(from var(--c,#888) min(l,.5) c h)}
}
.tl-x{font-family:var(--num);font-size:clamp(26px,4vw,58px);color:var(--mute)}
.tl-bot{display:flex;gap:16px;align-items:flex-start}
.tl-bot{flex-shrink:0;max-height:34vh;overflow:hidden}
.tl-bot>div{flex:1;background:var(--surf);border:1px solid var(--brd);border-radius:14px;padding:12px 15px;overflow:hidden}

.banner{border-radius:12px;padding:12px 15px;margin:12px 0;font-size:13px;font-weight:600;line-height:1.5}
.banner.err{background:rgba(220,38,38,.16);border:1px solid rgba(220,38,38,.42);color:#fecaca}
.banner.inf{background:rgba(37,99,235,.14);border:1px solid rgba(37,99,235,.4);color:#bfdbfe}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;padding:12px 20px;border-radius:12px;
  font-weight:800;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);background:#1e293b;border:1px solid var(--brd)}
.toast.err{background:#7f1d1d;border-color:#dc2626}
.toast.ok{background:#065f46;border-color:#059669}
.empty{text-align:center;padding:44px 20px;color:var(--faint)}
.empty .big{font-family:var(--ui);font-weight:800;font-size:22px;letter-spacing:.01em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.stamp{position:fixed;bottom:4px;right:7px;font-size:9px;font-weight:700;color:rgba(148,163,184,.5);pointer-events:none}
@media(max-width:640px){
  .mesa-side .pts{font-size:40px}.hd-nav a{padding:7px 9px;font-size:10px}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}

/* BORDA DE ESTADO na cor da equipe: com BRANCO no tema claro (ou PRETO no
   escuro) a borda sumia e o operador perdia de vista quem esta sacando. Aqui a
   cor e presa numa faixa de luminosidade visivel — a matiz continua a da
   equipe, so nao deixa chegar no extremo. Vale so para BORDA de estado; o
   escudo e o placar seguem com a cor exata do cadastro. */
@supports (color: oklch(from red l c h)){
  .pbtn.serving{border-color:oklch(from var(--c,#888) clamp(.42,l,.78) c h)}
  .mesa-side{border-color:oklch(from var(--c,#888) clamp(.42,l,.78) c h)}
  .slot.filled{border-color:oklch(from var(--c,#888) clamp(.42,l,.78) c h)}
  .pod{border-color:oklch(from var(--c,#888) clamp(.42,l,.78) c h)}
  .dest{border-top-color:var(--f)}
}
</style>

<div id="app"></div>
<div class="stamp" id="stamp"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="cores-core.js?v=2026-09-05c"></script>
<script>
/* ============================================================================
   RS-SCOUT · MINI MINIS - CORES — modulo ISOLADO
   Nao toca no index.html. Dados em NO PROPRIO do RTDB: /torneio-cores
   Toda a logica de placar/saque/classificacao vive em cores-core.js (testado).
   Aqui so tem UI + Firebase.
   ========================================================================== */
/* Tema claro/escuro. Escuro e o padrao (fica melhor projetado no telao);
   o claro serve para notebook em ginasio muito iluminado. Fica no aparelho. */
var TEMA=(function(){try{return localStorage.getItem("cores_tema")||"escuro";}catch(e){return "escuro";}})();

/* ---------- gravacao ----------
   TUDO que o operador marca e um EVENTO NOVO (push = insert). Nunca sobrescreve
   o no do jogo -> dois aparelhos gravando ao mesmo tempo nao se apagam.        */
function pushEvent(gid,ev){
  /* Carimbo do SERVIDOR, nao do aparelho: os dois notebooks podem estar com o
     relogio desencontrado, e o dedupe por tempo depende de uma base unica. */
  try{ ev.ts=(firebase.database.ServerValue&&firebase.database.ServerValue.TIMESTAMP)||Date.now(); }
  catch(e){ ev.ts=Date.now(); }
  return db.ref(ROOT+"/events/"+gid).push(ev).catch(function(e){onWriteErr(e);throw e;});
}
function writeNode(path,val){
  return db.ref(ROOT+"/"+path).set(val).catch(function(e){onWriteErr(e);throw e;});
}
function onWriteErr(e){
  var m=String((e&&(e.code||e.message))||"");

    if(!_writeErr){_writeErr=true;render();}
  }else{ toast("Falha ao salvar — verifique a conexão","err"); }
}

/* Eventos: na mesa escuta so o jogo aberto; no telao/classificacao escuta tudo. */
function watchEvents(){
  if(VIEW==="mesa"&&GID){
    if(_evGid===GID)return;
    if(_evRef)_evRef.off();
    _evGid=GID;_evRef=db.ref(ROOT+"/events/"+GID);
    _evRef.on("value",function(s){D.events[GID]=s.val()||{};render();});
  }else if(VIEW==="class"||VIEW==="telao"||VIEW==="home"||VIEW==="admin"||VIEW==="rel"){
    if(_evGid==="*")return;
    if(_evRef)_evRef.off();
    _evGid="*";_evRef=db.ref(ROOT+"/events");
    _evRef.on("value",function(s){D.events=s.val()||{};render();});
  }
}

  }catch(e){} }

function gameCard(g){
  var A=tF(g.a),B=tF(g.b);
  var st=calc(g);
  /* Jogo de mata-mata que ainda espera resultado mostra "Vencedor Semifinal 1". */
  /* Faixa de cor no lugar do escudo com iniciais: o nome ja esta escrito ao
     lado, entao a sigla so repetia. A cor continua identificando a equipe. */
  function ladoHTML(t,lado,extra){
    var nm=t?t.n:coresLadoLabel(g,lado,D.teams);
    var cor=t?t.cor:'#64748b';
    var faixa='<span class="faixa" style="background:'+esc(cor)+'"></span>';
    var txt='<div style="min-width:0"><div class="gc-nm'+(t?'':' pend')+'">'+esc(nm)+'</div>'+extra+'</div>';
    return lado==="A"?(faixa+txt):(txt+faixa);
  }
  var live=g.st==="ao_vivo",fim=(g.st==="finalizada");
  var h='<div class="gcard'+(live?" live":"")+'">';
  h+='<div class="gc-vs">'+ladoHTML(A,"A",'<div class="gc-meta">'+(g.dt?fD(g.dt):"")+(g.tm?" · "+esc(g.tm):"")+'</div>')+'</div>';
  h+='<div class="gc-sc">'+st.pts.A+'<span class="faint" style="font-size:19px"> x </span>'+st.pts.B+'</div>';
  h+='<div class="gc-vs" style="justify-content:flex-end;text-align:right">';
  h+=ladoHTML(B,"B",'<div class="gc-meta">'+(live?"em andamento":(fim?"encerrado":"a jogar"))+'</div>');
  h+='</div>';
  h+='<div style="display:flex;flex-direction:column;gap:7px;align-items:flex-end;min-width:96px">';
  h+='<span class="pill '+(live?"live":(fim?"fim":"age"))+'">'+(live?"AO VIVO":(fim?"FIM":"AGENDADO"))+'</span>';
  if(A&&B)h+='<button class="btn sm pri" onclick="go(\'mesa\',\'&g='+g.id+'\')">'+(fim?"Ver":"Marcar")+'</button>';
  else h+='<span class="faint" style="font-size:10px;text-align:right;line-height:1.3">aguardando<br>o resultado</span>';
  h+='</div></div>';
  return h;
}

/* ---------------- MESA: a tela do operador ---------------- */
function rMesa(){
  var g=D.games[GID];
  if(g&&(!g.a||!g.b)){var gr=gRes(GID);if(gr&&gr.a&&gr.b)g=gr;}   /* mata-mata */
  if(!g)return '<div class="empty"><div class="big">JOGO NÃO ENCONTRADO</div><button class="btn" onclick="go(\'home\')" style="margin-top:14px">Voltar aos jogos</button></div>';
  var A=tF(g.a),B=tF(g.b);
  if(!A||!B){
    return '<div class="empty"><div class="big">'+esc(coresLadoLabel(g,"A",D.teams))+' × '+esc(coresLadoLabel(g,"B",D.teams))+'</div>'
      +'<div>Este jogo depende de um resultado que ainda não saiu.</div>'
      +'<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" onclick="go(\'home\')">← Voltar aos jogos</button></div></div>';
  }
  var st=calc(g);
  MEUTID=MEUTID||localStorage.getItem("cores_tid_"+g.id)||null;
  if(MEUTID!==g.a&&MEUTID!==g.b)MEUTID=null;
  if(!MEUTID)return rEscolhaEquipe(g,A,B);

  var meuSide=(MEUTID===g.a)?"A":"B";
  var meu=tF(MEUTID), adv=(meuSide==="A")?B:A;
  var h=placarHTML(g,A,B,st);

  /* Antes de marcar: quem saca primeiro + a ordem de saque posicionada 1..N.
     O sacador nao e escolhido em lista — sai da posicao 1 da escalacao. */
  var faltaSetup=(!st.firstServeSide)||(!st.lineupSet[meuSide]);
  if(faltaSetup&&!st.done)return h+rSetup(g,meu,adv,st,meuSide,A,B);

  return h+rMesaJogo(g,meu,adv,st,meuSide,A,B);
}

}

/* Placar do topo — o mesmo nos dois aparelhos. */
function placarHTML(g,A,B,st){
  var h='<div class="mesa-top">';
  [{t:A,s:"A"},{t:B,s:"B"}].forEach(function(x){
    var mine=(x.t.id===MEUTID);
    var serving=st.serve&&st.serve.side===x.s;
    var sacador=serving&&st.serve.jid?pF(x.t,st.serve.jid):null;
    h+='<div class="mesa-side'+(mine?" mine":"")+(serving?" serving":"")+'" style="--c:'+esc(x.t.cor)+'">';
    h+='<span class="faixa lg" style="background:'+esc(x.t.cor)+'"></span>';
    h+='<div class="mesa-id"><div class="nm">'+esc(x.t.n)+'</div>';

    h+='</div>';
    h+='<div class="pts">'+st.pts[x.s]+'</div></div>';
  });
  h+='</div>';
  return h;
}

/* ---- SETUP: quem saca + ordem de saque 1..N ---- */
function rSetup(g,meu,adv,st,meuSide,A,B){
  var cfg=coresCfg(D.config);
  var n=cfg.emQuadra;
  if(SETUP===null)SETUP=(st.lineupSet[meuSide]?st.lineup[meuSide].slice(0,n):[]);
  var elenco=playersOf(meu);
  var usados={};SETUP.forEach(function(j){usados[j]=1;});

  var h='<h2 class="sec">ANTES DE COMEÇAR<span class="sec-sub">você marca a '+esc(meu.n)+'</span></h2>';

  /* passo 1 — equipe que abre sacando */
  h+='<div class="step'+(st.firstServeSide?" done":"")+'">';
  h+='<div class="step-hd"><span class="step-n">1</span>Qual equipe saca primeiro?'+(st.firstServeSide?'<span class="step-ok">✓ definido</span>':'')+'</div>';
  h+='<div class="row">';
  [A,B].forEach(function(t){
    var on=st.firstServeSide===((t.id===g.a)?"A":"B");
    h+='<button class="teamchoice'+(on?" on":"")+'" style="--c:'+esc(t.cor)+'" onclick="setFirstServe(\''+t.id+'\')">';
    h+='<span class="dot" style="background:'+esc(t.cor)+'"></span>'+esc(t.n)+(on?' 🏐':'')+'</button>';
  });
  h+='</div>';
  h+='<div class="step-hint">Vale para as duas equipes — o outro operador vê a mesma escolha.</div>';
  h+='</div>';

  /* passo 2 — ordem de saque posicionada */
  h+='<div class="step'+(SETUP.length>=n?" done":"")+'">';
  h+='<div class="step-hd"><span class="step-n">2</span>Ordem de saque da '+esc(meu.n)+(SETUP.length>=n?'<span class="step-ok">✓ completa</span>':'')+'</div>';
  h+='<div class="step-hint">Toque nos atletas na ordem em que vão sacar. Quem ficar na <b>posição 1</b> começa sacando; depois o rodízio anda sozinho.</div>';
  h+='<div class="slots">';
  for(var i=0;i<n;i++){
    var jid=SETUP[i], p=jid?pF(meu,jid):null;
    h+='<div class="slot'+(p?" filled":"")+'" style="--c:'+esc(meu.cor)+'"'+(p?' onclick="setupRemove('+i+')"':'')+'>';
    h+='<span class="slot-n">'+(i+1)+'</span>';
    if(p){h+='<span class="slot-nm">'+esc(p.nm)+'</span><span class="slot-x">×</span>';}
    else h+='<span class="slot-empty">livre</span>';
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="pool">';
  elenco.forEach(function(p){
    var on=!!usados[p.id];
    h+='<button class="poolp'+(on?" used":"")+'" style="--c:'+esc(meu.cor)+'" onclick="setupPick(\''+p.id+'\')"'+(on?' disabled':'')+'>';
    h+='<span class="poolp-nu" style="background:'+esc(meu.cor)+';--c:'+esc(meu.cor)+'">'+esc(p.nu!=null&&p.nu!==""?p.nu:initials(p.nm))+'</span>';
    h+=esc(p.nm)+'</button>';
  });
  if(!elenco.length)h+='<span class="faint">Nenhum atleta cadastrado nesta equipe — cadastre no Admin.</span>';
  h+='</div>';
  h+='<div class="row" style="margin-top:12px">';
  h+='<button class="btn pri" onclick="salvarEscalacao()"'+(SETUP.length<n||!st.firstServeSide?" disabled":"")+'>✓ Confirmar e começar</button>';
  if(SETUP.length)h+='<button class="btn sm" onclick="setupLimpar()">Limpar</button>';
  h+='<button class="btn sm" onclick="trocarEquipe()">Marcar a outra equipe</button>';
  h+='<button class="btn sm" onclick="go(\'home\')">← Jogos</button>';
  h+='</div>';
  if(SETUP.length>=n&&!st.firstServeSide)h+='<div class="step-hint" style="color:var(--bad)">Falta escolher quem saca primeiro (passo 1).</div>';
  h+='</div>';
  return h;
}
function setupPick(jid){
  var g=D.games[GID];if(!g)return;
  var n=coresCfg(D.config).emQuadra;
  if(SETUP===null)SETUP=[];
  if(SETUP.indexOf(jid)>=0)return;
  if(SETUP.length>=n){toast("As "+n+" posições já estão preenchidas","err");return;}
  SETUP.push(jid);render();
}
function setupRemove(i){ if(SETUP){SETUP.splice(i,1);render();} }
function setupLimpar(){ SETUP=[];render(); }
function setFirstServe(tid){ pushEvent(GID,{t:"first",tid:tid}); }
function salvarEscalacao(){
  var g=D.games[GID];if(!g)return;
  var n=coresCfg(D.config).emQuadra;
  if(!SETUP||SETUP.length<n){toast("Complete as "+n+" posições","err");return;}
  var st=calc(g);
  if(!st.firstServeSide){toast("Escolha quem saca primeiro","err");return;}
  var ordem=SETUP.slice();
  SETUP=null;ESCALACAO_ABERTA=false;render();   /* mesmo motivo do fazerSub */
  pushEvent(GID,{t:"lineup",tid:MEUTID,ordem:ordem}).then(function(){
    toast("Escalação salva","ok");
  });
}
function reabrirEscalacao(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g),meuSide=(MEUTID===g.a)?"A":"B";
  SETUP=st.lineup[meuSide].slice(0,coresCfg(D.config).emQuadra);
  ESCALACAO_ABERTA=true;render();
}

/* ---- MESA em jogo ---- */
function rMesaJogo(g,meu,adv,st,meuSide,A,B){
  var cfg=coresCfg(D.config);
  var h='';

  /* A cada rally novo a selecao volta para o sacador da propria equipe: o
     primeiro toque do rally e quase sempre o saque. E so sugestao — tocar em
     outro atleta troca. Sem isso o operador ficava com o atleta do rally
     anterior selecionado e marcava no jogador errado. */
  if(_rallyVisto!==st.rally){ _rallyVisto=st.rally; if(!SUBPICK)SELP=null; }
  if(!SELP&&!SUBPICK&&st.serve&&st.serve.side===meuSide&&pF(meu,st.serve.jid))SELP=st.serve.jid;

  if(ESCALACAO_ABERTA&&!st.done){
    h+=rSetup(g,meu,adv,st,meuSide,A,B);
    h+='<div class="row"><button class="btn sm" onclick="fecharEscalacao()">Cancelar</button></div>';
    return h;
  }

  if(st.done){
    var wt=st.winnerTid?tF(st.winnerTid):null;
    h+='<div class="banner ok"><b>Set encerrado</b> — '+(wt?esc(wt.n)+" venceu por ":"")+st.pts.A+' x '+st.pts.B+'. ';
    h+=(g.st!=="finalizada"?'Confirme para entrar na classificação.':'Jogo finalizado.')+'</div>';
    if(g.st!=="finalizada")h+='<div class="row" style="margin-bottom:12px"><button class="btn pri" onclick="finalizarJogo()">✓ Finalizar jogo</button><button class="btn" onclick="undoLast()">↩ Desfazer última</button></div>';
  }else if(g.st!=="ao_vivo"){
    h+='<div class="banner inf">Escalação pronta. <b>Inicie o jogo</b> para começar a marcar.</div>';
    h+='<div class="row" style="margin-bottom:12px"><button class="btn pri" onclick="iniciarJogo()">▶ Iniciar jogo</button><button class="btn sm" onclick="reabrirEscalacao()">✎ Mudar escalação</button><button class="btn sm" onclick="go(\'home\')">← Jogos</button></div>';
  }

  /* atletas: em quadra na ORDEM DE SAQUE, com a posicao visivel */
  var court=st.lineup[meuSide]||[];
  var bench=playersOf(meu).filter(function(p){return court.indexOf(p.id)<0;});

  h+='<h2 class="sec">'+esc(meu.n)+'<span class="sec-sub">em quadra · na ordem de saque</span></h2>';
  h+='<div class="pgrid">';
  court.forEach(function(jid,ix){
    var p=pF(meu,jid);
    if(!p){h+='<div class="pbtn ghost"><span class="pos">'+(ix+1)+'</span><div class="pn faint">(atleta removido)</div></div>';return;}
    h+=pBtn(p,meu,st,ix+1,false,meuSide);
  });
  h+='</div>';

  /* substituicao */
  if(SUBPICK&&!SUBOUT){
    h+='<div class="subbar"><b>Substituição</b> — toque em quem <b>SAI</b> (nos cards acima).';
    h+='<div style="margin-top:8px"><button class="btn sm" onclick="cancelSub()">Cancelar</button></div></div>';
  }else if(SUBOUT){
    var outP=pF(meu,SUBOUT);
    h+='<div class="subbar"><b>Sai '+esc(outP?outP.nm:"")+'</b> — quem entra?';
    h+='<div class="pool" style="margin-top:8px">';
    if(!bench.length)h+='<span class="faint">Sem reservas nesta equipe.</span>';
    bench.forEach(function(p){
      h+='<button class="poolp" style="--c:'+esc(meu.cor)+'" onclick="fazerSub(\''+p.id+'\')">';
      h+='<span class="poolp-nu" style="background:'+esc(meu.cor)+';--c:'+esc(meu.cor)+'">'+esc(p.nu!=null&&p.nu!==""?p.nu:initials(p.nm))+'</span>';
      h+=esc(p.nm)+'</button>';
    });
    h+='</div><button class="btn sm" style="margin-top:8px" onclick="cancelSub()">Cancelar</button></div>';
  }else if(bench.length&&!SUBPICK){
    h+='<div class="benchrow"><span class="benchlb">RESERVAS</span>';
    bench.forEach(function(p){
      h+='<span class="benchp"><span class="poolp-nu" style="background:'+esc(meu.cor)+';--c:'+esc(meu.cor)+'">'+esc(p.nu!=null&&p.nu!==""?p.nu:initials(p.nm))+'</span>'+esc(p.nm)+'</span>';
    });
    h+='<button class="btn sm" onclick="abrirSub()">⇄ Substituir</button></div>';
  }

  /* acoes */
  var travado=st.done||g.st!=="ao_vivo";
  h+='<div class="'+(SELP&&!travado?"":"needp")+'" style="margin-top:18px">';
  h+='<h2 class="sec">AÇÃO<span class="sec-sub">'+(SELP&&pF(meu,SELP)?esc(pF(meu,SELP).nm):(travado?"jogo não está ao vivo":"escolha o atleta acima"))+'</span></h2>';
  h+='<div class="fgrid">';
  for(var fi=0;fi<CORES_FUND.length;fi++){
    var ak=CORES_FUND[fi], a=CORES_ACT[ak];
    h+='<div class="fbox"><div class="fh" style="background:'+CORES_FCOL[ak]+'"><span class="ico">'+a.i+'</span>'+esc(a.l)+'</div><div class="fb">';
    for(var i=0;i<a.o.length;i++){
      var oc=a.o[i];
      h+='<button style="background:'+CORES_OC[oc]+'" onclick="mark(\''+ak+'\',\''+oc+'\')">'+esc(oc)+'</button>';
    }
    h+='</div></div>';
  }
  h+='</div></div>';

  /* controles */
  /* Falta sem fundamento (rodizio, posicional, conducao, invasao, tempo):
     nao tem atleta e da ponto direto para a adversaria. */
  /* Ponto sem fundamento: quando o rally termina sem uma acao de atleta que
     valha marcar (bola fora do adversario, erro de saque dele, falta). Cobre os
     DOIS lados — senao o operador so conseguia registrar ponto contra si. */
  h+='<div class="faltabar">';
  h+='<button class="btn pontonos" onclick="marcarPontoNos()">➕ Ponto '+esc(meu.n)+'</button>';
  h+='<button class="btn pontoadv" onclick="marcarPontoAdv()">➕ Ponto '+esc(adv.n)+'</button>';
  h+='<button class="btn falta" onclick="marcarFalta()">⚠ Falta da '+esc(meu.n)+'</button>';
  /* Recolhida: 123px de texto fixo empurravam o "Desfazer" para fora da tela
     num notebook 1366x768. Fica a um clique de distancia. */
  h+='<details class="faltahint"><summary>quando usar cada um?</summary>'
    +'<b>Ponto '+esc(meu.n)+'</b>: o adversário errou o saque, mandou fora ou fez falta.<br>'
    +'<b>Ponto '+esc(adv.n)+'</b>: ela pontuou e você não quer esperar o outro operador.<br>'
    +'<b>Falta</b>: rodízio, posicional, condução, invasão, tempo (conta como falta da equipe).<br>'
    +'Os três <b>rodam o saque</b>. Se os dois operadores marcarem o mesmo rally, conta 1 ponto só.'
    +'</details></div>';

  h+='<div class="ctrls">';
  h+='<span class="ctrl-lb" title="Correção de placar: não mexe no saque">Corrigir '+esc(meu.n)+'</span>';
  h+='<button class="btn" onclick="adjust(\''+MEUTID+'\',1)">+1</button>';
  h+='<button class="btn" onclick="adjust(\''+MEUTID+'\',-1)">−1</button>';
  h+='<span class="ctrl-lb">'+esc(adv.n)+'</span>';
  h+='<button class="btn" onclick="adjust(\''+adv.id+'\',1)">+1</button>';
  h+='<button class="btn" onclick="adjust(\''+adv.id+'\',-1)">−1</button>';
  h+='<button class="btn" onclick="girarSaque()">↻ Girar saque</button>';
  h+='<button class="btn dgr" onclick="undoLast()">↩ Desfazer minha última</button>';
  h+='<button class="btn sm" onclick="reabrirEscalacao()">✎ Escalação</button>';
  h+='<button class="btn sm" onclick="trocarEquipe()">Trocar equipe</button>';
  h+='<button class="btn sm" onclick="go(\'home\')">← Jogos</button>';
  h+='</div>';

  /* feed + ladder */
  h+='<h2 class="sec">ÚLTIMAS AÇÕES<span class="sec-sub">as duas equipes</span></h2><div class="card">';
  h+=feedHTML(st,g);
  if(st.pointLog.length){
    h+='<div class="ladder">';
    st.pointLog.forEach(function(p){
      var c=(p.side==="A")?A.cor:B.cor;
      h+='<i style="background:'+esc(c)+'" title="'+esc(p.side==="A"?A.n:B.n)+'"></i>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function pBtn(p,team,st,pos,isBench,meuSide){
  var serving=st.serve&&st.serve.side===meuSide&&st.serve.jid===p.id;
  var saindo=(SUBPICK&&SUBOUT===p.id);
  var on=(!SUBPICK&&SELP===p.id);
  /* Em modo substituicao o card escolhe quem SAI; fora dele, seleciona para marcar. */
  var acao=SUBPICK?("pickOut('"+p.id+"')"):("selP('"+p.id+"')");
  /* A POSICAO de saque manda no card (e o que o operador usa); o numero da
     camisa fica discreto junto do nome — os dois grandes se confundiam. */
  var camisa=(p.nu!=null&&p.nu!=="")?("#"+p.nu):"";
  return '<button class="pbtn'+(on?" on":"")+(saindo?" out":"")+(SUBPICK?" subpick":"")+(serving?" serving":"")+'" style="--c:'+esc(team.cor)+'" onclick="'+acao+'">'
    +'<div class="pos" style="background:'+esc(team.cor)+';--c:'+esc(team.cor)+'">'+pos+'</div>'
    +'<div style="min-width:0;flex:1"><div class="pn">'+esc(p.nm)+'</div>'
    +'<div class="pr">'+(saindo?'<b class="sai">SAI</b>':(serving?'<b class="saca">🏐 SACANDO</b>':'saque '+pos))
    +(camisa?' <span class="camisa">'+esc(camisa)+'</span>':'')+'</div></div></button>';
}

function feedHTML(st,g){
  var evs=st.events.slice().reverse().filter(function(e){return e.t==="act";}).slice(0,10);
  if(!evs.length)return '<div class="faint">Nenhuma ação marcada ainda.</div>';
  var dupKeys={};st.dupes.forEach(function(d){dupKeys[d.k]=d._dupWhy||"rally";});
  var h='<div class="feed">';
  evs.forEach(function(e){
    var t=tF(e.tid),p=t?pF(t,e.jid):null;
    var a=CORES_ACT[e.ak];
    h+='<div class="fitem'+(dupKeys[e.k]?" dup":"")+'">';
    h+='<span class="dot" style="background:'+esc(t?t.cor:"#64748b")+'"></span>';
    h+='<b>'+esc(p?p.nm:"—")+'</b><span class="faint">'+esc(a?a.l:e.ak)+'</span>';
    h+='<span class="oc" style="background:'+(CORES_OC[e.oc]||"#64748b")+'">'+esc(e.oc)+'</span>';
    if(dupKeys[e.k])h+='<span class="dupwhy">só estatística · '+(dupKeys[e.k]==="janela"?"o outro operador já marcou este rally":"rally já pontuado")+'</span>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

/* ---------- acoes da mesa ---------- */
function setMeuTid(tid){MEUTID=tid;localStorage.setItem("cores_tid_"+GID,tid);SELP=null;SETUP=null;render();}
function trocarEquipe(){localStorage.removeItem("cores_tid_"+GID);MEUTID=null;SELP=null;SETUP=null;render();}
/* Sempre SELECIONA (nunca alterna). Toque repetido no mesmo atleta e comum na
   correria e nao pode zerar a selecao — a acao seguinte deixaria de gravar. */
function selP(jid){SELP=jid;render();}
function fecharEscalacao(){ESCALACAO_ABERTA=false;SETUP=null;render();}
function abrirSub(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g),meuSide=(MEUTID===g.a)?"A":"B";
  if(!(st.lineup[meuSide]||[]).length){toast("Defina a escalação primeiro","err");return;}
  SUBOUT=null;SELP=null;SUBPICK=true;render();
}
function pickOut(jid){SUBOUT=jid;render();}
function cancelSub(){SUBOUT=null;SUBPICK=false;render();}
function fazerSub(inJid){
  if(!SUBOUT){toast("Escolha quem sai","err");return;}
  var out=SUBOUT;
  /* Sai do modo substituicao ANTES de gravar e re-renderiza na hora: se isso
     ficasse no .then, o listener redesenhava os cards ainda em modo "quem sai"
     e o toque seguinte do operador era perdido. */
  SUBOUT=null;SUBPICK=false;SELP=null;render();
  pushEvent(GID,{t:"sub",tid:MEUTID,out:out,in:inJid}).then(function(){
    toast("Substituição feita","ok");
  });
}
function girarSaque(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g),meuSide=(MEUTID===g.a)?"A":"B";
  var lst=st.lineup[meuSide]||[];
  if(!lst.length){toast("Defina a escalação primeiro","err");return;}
  var last=st.lastServer[meuSide];
  var i=lst.indexOf(last);
  var nx=(i<0)?lst[0]:lst[(i+1)%lst.length];
  pushEvent(GID,{t:"serve",tid:MEUTID,jid:nx});
}
function mark(ak,oc){
  if(!SELP){toast("Escolha o atleta primeiro","err");return;}
  var g=D.games[GID];if(!g)return;
  var st=calc(g);
  if(st.done){toast("Set encerrado — finalize o jogo","err");return;}
  if(g.st!=="ao_vivo"){toast("Inicie o jogo antes de marcar","err");return;}
  pushEvent(GID,{t:"act",tid:MEUTID,jid:SELP,ak:ak,oc:oc,rally:st.rally}).then(function(ref){
    /* Se o ponto deste rally ja tinha sido contado pelo outro operador, a acao
       entra como estatistica e o placar NAO sobe. Avisa, pra nao ficar silencioso. */
    var key=ref&&ref.key; if(!key)return;
    setTimeout(function(){
      var gg=D.games[GID]; if(!gg)return;
      var st2=calc(gg);
      for(var i=0;i<st2.dupes.length;i++){
        if(st2.dupes[i].k===key){ toast("Ação salva no scout. O ponto deste rally já tinha sido contado.",""); break; }
      }
    },150);
  }).catch(function(){});
}
function marcarFalta(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g);
  if(st.done){toast("Set encerrado — finalize o jogo","err");return;}
  if(g.st!=="ao_vivo"){toast("Inicie o jogo antes de marcar","err");return;}
  /* sem jid: e falta da equipe, nao entra na estatistica de nenhum atleta */
  pushEvent(GID,{t:"act",tid:MEUTID,jid:null,ak:"falta",oc:"Erro",rally:st.rally});
}
/* O adversario pontuou. Sobe o placar dele e ROTACIONA o saque — diferente do
   +1, que e so correcao de numero. Sem isto, o operador so via o rodizio andar
   quando o outro operador marcasse a jogada dele. */
/* A nossa equipe pontuou sem acao nossa (erro/falta do adversario). Sobe o nosso
   placar e recupera o saque — o side-out a favor deixa de depender do colega. */
function marcarPontoNos(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g);
  if(st.done){toast("Set encerrado — finalize o jogo","err");return;}
  if(g.st!=="ao_vivo"){toast("Inicie o jogo antes de marcar","err");return;}
  pushEvent(GID,{t:"act",tid:MEUTID,jid:null,ak:"pontonos",oc:"Ponto",rally:st.rally});
}
function marcarPontoAdv(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g);
  if(st.done){toast("Set encerrado — finalize o jogo","err");return;}
  if(g.st!=="ao_vivo"){toast("Inicie o jogo antes de marcar","err");return;}
  pushEvent(GID,{t:"act",tid:MEUTID,jid:null,ak:"pontoadv",oc:"Erro",rally:st.rally});
}
function adjust(tid,delta){
  var g=D.games[GID];if(!g)return;
  pushEvent(GID,{t:"adj",tid:tid,delta:delta});
}
/* Desfaz so o ULTIMO evento DESTE aparelho/equipe — nunca mexe no do outro operador. */
function undoLast(){
  var evObj=D.events[GID]||{};
  var keys=Object.keys(evObj).sort();
  for(var i=keys.length-1;i>=0;i--){
    var e=evObj[keys[i]];
    if(e&&e.tid===MEUTID){
      db.ref(ROOT+"/events/"+GID+"/"+keys[i]).remove().then(function(){toast("Última ação desfeita","ok");}).catch(onWriteErr);
      return;
    }
  }
  toast("Nada seu para desfazer","err");
}
function iniciarJogo(){var g=D.games[GID];if(!g)return;g.st="ao_vivo";writeNode("games/"+GID+"/st","ao_vivo");}
function finalizarJogo(){
  var g=D.games[GID];if(!g)return;
  g.st="finalizada";
  writeNode("games/"+GID+"/st","finalizada").then(function(){
    toast("Jogo finalizado — classificação atualizada","ok");
    materializarDependentes();
  });
}
/* A final nasce como "vencedor da SF1 x vencedor da SF2". Quando a semi acaba,
   grava as equipes de verdade no jogo — senao a mesa nao teria como abrir. */
function materializarDependentes(){
  var res=gamesRes();
  for(var i=0;i<res.length;i++){
    var r=res[i], cru=D.games[r.id]; if(!cru)continue;
    if(r.a&&!cru.a)writeNode("games/"+r.id+"/a",r.a);
    if(r.b&&!cru.b)writeNode("games/"+r.id+"/b",r.b);
  }
}

/* ---------------- CLASSIFICACAO ---------------- */
function rClass(){
  var ts=teamsArr();
  if(!ts.length)return '<div class="empty"><div class="big">SEM EQUIPES</div><div>Cadastre as equipes no Admin.</div></div>';
  var S=coresStandings(gamesArr(),ts,D.events,D.config);
  var cfg=coresCfg(D.config);
  var h='<h2 class="sec">CLASSIFICAÇÃO</h2>';
  h+='<div class="card"><div class="tscroll"><table class="tb"><thead><tr>';
  h+='<th>#</th><th>EQUIPE</th><th>J</th><th>V</th><th>D</th><th>PP</th><th>PC</th><th>SALDO</th><th>PTS</th>';
  h+='</tr></thead><tbody>';
  S.forEach(function(r){
    h+='<tr><td class="faint">'+r.pos+'</td>';
    h+='<td class="nm"><span style="display:inline-flex;align-items:center;gap:9px">';
    h+='<span class="dot" style="background:'+esc(r.cor)+'"></span>'+esc(r.n)+'</span></td>';
    h+='<td>'+r.j+'</td><td style="color:var(--ok);font-weight:800">'+r.v+'</td><td class="faint">'+r.d+'</td>';
    h+='<td>'+r.pp+'</td><td>'+r.pc+'</td>';
    h+='<td style="color:'+(r.saldo>0?"var(--ok)":(r.saldo<0?"var(--bad)":"var(--mute)"))+'">'+(r.saldo>0?"+":"")+r.saldo+'</td>';
    h+='<td style="font-family:\'Bebas Neue\',sans-serif;font-size:20px">'+r.pts+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="faint" style="font-size:11px;margin-top:12px;line-height:1.6">Vitória = '+cfg.ptsVitoria+' · Derrota = '+cfg.ptsDerrota+' · Set único até '+cfg.setPoints+' com '+cfg.vantagem+' de vantagem.<br>Desempate: pontos › saldo › pontos pró › confronto direto. Só entram jogos <b>encerrados da fase classificatória</b> — semifinal e final não mexem na tabela.</div>';
  h+='</div>';
  h+='<h2 class="sec">RESULTADOS</h2>';
  var fin=coresOrderGames(gamesArr()).filter(function(g){return g.st==="finalizada"||calc(g).done;});
  if(!fin.length)h+='<div class="empty">Nenhum jogo encerrado ainda.</div>';
  else fin.forEach(function(g){h+=gameCard(g);});
  return h;
}

/* ---------------- RELATORIO ---------------- */
var REL_JOGO="";     /* "" = torneio inteiro */

function rRelatorio(){
  var ts=teamsArr();
  var gs=coresOrderGames(gamesRes());
  var comAcao=gs.filter(function(g){ var e=D.events[g.id]; return e&&Object.keys(e).length; });
  var h='<h2 class="sec">RELATÓRIO<span class="sec-sub">'+(REL_JOGO?"um jogo":"torneio inteiro")+'</span></h2>';

  if(!ts.length||!comAcao.length){
    return h+'<div class="empty"><div class="big">SEM DADOS AINDA</div><div>O relatório aparece quando houver jogo com ações marcadas.</div></div>';
  }

  /* filtro: torneio inteiro ou um jogo */
  h+='<div class="relfiltro"><span class="ctrl-lb">MOSTRAR</span>';
  h+='<button class="chip'+(REL_JOGO?"":" on")+'" onclick="relJogo(\'\')">Torneio inteiro</button>';
  comAcao.forEach(function(g){
    var a=tF(g.a),b=tF(g.b); if(!a||!b)return;
    h+='<button class="chip'+(REL_JOGO===g.id?" on":"")+'" onclick="relJogo(\''+g.id+'\')">'
      +esc(a.n)+' × '+esc(b.n)+'</button>';
  });
  h+='</div>';

  var R=coresRankings(gamesArr(),ts,D.events,D.config,{gameId:REL_JOGO||null});
  if(!R.temDado)return h+'<div class="empty">Nenhuma ação neste recorte.</div>';

  /* ---- maiores pontuadores ---- */
  h+='<h2 class="sec">MAIORES PONTUADORAS<span class="sec-sub">ace, ataque e bloqueio que fecharam o rally</span></h2>';
  if(!R.pontuadores.length)h+='<div class="card faint">Nenhum ponto de ataque, saque ou bloqueio ainda.</div>';
  else{
    h+='<div class="podio">';
    R.pontuadores.slice(0,3).forEach(function(x,i){
      h+='<div class="pod pod'+(i+1)+'" style="--c:'+esc(x.cor)+'">';
      h+='<div class="pod-pos">'+(i+1)+'º</div>';
      h+='<div class="pod-nm">'+esc(x.nm)+'</div>';
      h+='<div class="pod-eq"><span class="dot" style="background:'+esc(x.cor)+'"></span>'+esc(x.equipe)+'</div>';
      h+='<div class="pod-pts">'+x.pontos+'</div><div class="pod-lb">PONTOS</div>';
      h+='<div class="pod-det">'+x.ace+' ace · '+x.ataque+' ataque · '+x.bloqueio+' bloqueio</div>';
      h+='</div>';
    });
    h+='</div>';
    if(R.pontuadores.length>3){
      h+='<div class="card"><div class="tscroll"><table class="tb"><thead><tr>'
        +'<th>#</th><th>ATLETA</th><th>EQUIPE</th><th>ACE</th><th>ATAQUE</th><th>BLOQ</th><th>PONTOS</th>'
        +'</tr></thead><tbody>';
      R.pontuadores.slice(3).forEach(function(x){
        h+='<tr><td class="faint">'+x.pos+'</td><td class="nm">'+esc(x.nm)+'</td>';
        h+='<td><span class="dot" style="background:'+esc(x.cor)+'"></span> '+esc(x.equipe)+'</td>';
        h+='<td>'+x.ace+'</td><td>'+x.ataque+'</td><td>'+x.bloqueio+'</td>';
        h+='<td style="font-weight:800">'+x.pontos+'</td></tr>';
      });
      h+='</tbody></table></div></div>';
    }
  }

  /* ---- destaques: a lider de cada fundamento, sem precisar rolar ate o detalhe ---- */
  var lideres=[];
  CORES_FUND.forEach(function(ak){
    var F=R.fundamentos[ak];
    var l=F.ranking[0];
    if(l)lideres.push({ak:ak,F:F,x:l});
  });
  if(lideres.length){
    h+='<h2 class="sec">DESTAQUES<span class="sec-sub">a melhor de cada fundamento</span></h2>';
    h+='<div class="destgrid">';
    lideres.forEach(function(d){
      h+='<div class="dest" style="--f:'+CORES_FCOL[d.ak]+'">';
      h+='<div class="dest-fund"><span class="ico">'+d.F.icone+'</span>'+esc(d.F.label)+'</div>';
      h+='<div class="dest-nm">'+esc(d.x.nm)+'</div>';
      h+='<div class="dest-eq"><span class="dot" style="background:'+esc(d.x.cor)+'"></span>'+esc(d.x.equipe)+'</div>';
      h+='<div class="dest-pct">'+d.x.pct+'<small>%</small></div>';
      h+='<div class="dest-lb">'+esc(d.F.rotulo)+' · '+(d.F.abc?(d.x.A+'A de '+d.x.n):(d.x.acertos+' de '+d.x.n))+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }

  /* ---- por fundamento ---- */
  h+='<h2 class="sec">RANKING POR FUNDAMENTO<span class="sec-sub">mínimo de '+R.minAcoes+' ações para entrar</span></h2>';
  h+='<div class="relgrid">';
  CORES_FUND.forEach(function(ak){
    var F=R.fundamentos[ak];
    h+='<div class="relcard"><div class="relcard-hd" style="background:'+CORES_FCOL[ak]+'"><span class="ico">'+F.icone+'</span>'+esc(F.label)
      +'<span class="relcard-met">'+esc(F.rotulo)+'</span></div><div class="relcard-bd">';
    if(!F.ranking.length&&F.poucos.length){
      /* Ninguem atingiu o minimo: em vez de card vazio, mostra o que ha com a
         ressalva — dado pouco e melhor que nada, desde que rotulado. */
      h+='<div class="amostra">amostra pequena (menos de '+R.minAcoes+' ações)</div>';
      F.poucos.slice(0,5).forEach(function(x){
        h+='<div class="relrow pouco"><span class="relpos">–</span>';
        h+='<span class="dot" style="background:'+esc(x.cor)+'"></span>';
        h+='<span class="relnm">'+esc(x.nm)+'</span>';
        h+='<span class="relbar"></span>';
        h+='<b class="relpct">'+(F.abc?Math.round((x.A||0)*100/x.n):Math.round((x.acertos||0)*100/x.n))+'%</b>';
        h+='<span class="reldet">'+(F.abc?((x.A||0)+'A de '+x.n):((x.acertos||0)+' de '+x.n))+'</span></div>';
      });
    }else if(!F.ranking.length){
      h+='<div class="faint" style="font-size:12px">Sem ações marcadas.</div>';
    }else{
      F.ranking.slice(0,5).forEach(function(x,i){
        h+='<div class="relrow"><span class="relpos">'+(i+1)+'</span>';
        h+='<span class="dot" style="background:'+esc(x.cor)+'"></span>';
        h+='<span class="relnm">'+esc(x.nm)+'</span>';
        h+='<span class="relbar"><i style="width:'+Math.max(2,x.pct)+'%;background:'+CORES_FCOL[ak]+'"></i></span>';
        h+='<b class="relpct">'+x.pct+'%</b>';
        h+='<span class="reldet">'+(F.abc?(x.A+'A de '+x.n):(x.acertos+' de '+x.n))+'</span>';
        h+='</div>';
      });
    }
    h+='</div></div>';
  });
  h+='</div>';

  /* ---- tabela geral ---- */
  h+='<h2 class="sec">TODAS AS ATLETAS</h2>';
  h+='<div class="card"><div class="tscroll"><table class="tb"><thead><tr>';
  h+='<th>ATLETA</th><th>EQUIPE</th><th>AÇÕES</th><th>PONTOS</th><th>ERROS</th>';
  CORES_FUND.forEach(function(ak){h+='<th>'+esc(CORES_ACT[ak].l.toUpperCase())+'</th>';});
  h+='</tr></thead><tbody>';
  R.geral.forEach(function(L){
    h+='<tr><td class="nm">'+esc(L.nm)+'</td>';
    h+='<td><span class="dot" style="background:'+esc(L.cor)+'"></span> '+esc(L.equipe)+'</td>';
    h+='<td>'+L.acoes+'</td>';
    h+='<td style="color:var(--ok);font-weight:800">'+L.pontos+'</td>';
    h+='<td style="color:var(--bad)">'+L.erros+'</td>';
    CORES_FUND.forEach(function(ak){
      var f=L.porFund[ak];
      h+='<td class="'+(f.n?'':'faint')+'">'+(f.n||'–')+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="faint" style="font-size:11px;margin-top:12px;line-height:1.6">';
  h+='<b>Pontos</b> = ace + ataque que fechou + bloqueio que fechou (ponto vindo de erro do adversário não é creditado a ninguém).<br>';
  h+='<b>% A</b> na recepção, levantamento e defesa; no saque é % de ace, no ataque e no bloqueio é % de ponto.';
  h+='</div></div>';
  return h;
}
function relJogo(gid){REL_JOGO=gid||"";render();}

/* ---------------- TELAO ---------------- */
function rTelao(){
  var gs=coresOrderGames(gamesRes());
  var campT=coresCampeao(gamesArr(),D.events,D.teams,D.config);
  if(campT&&tF(campT)){
    var ct=tF(campT);
    return '<div class="tl"><div class="tl-hd"><div class="hd-ti" style="font-size:28px">'+esc(D.config.nome||CORES_NOME_PADRAO)+'</div>'
      +'<div class="hd-sub" style="margin-left:auto">RS-VOLEIBOL</div></div>'
      +'<div class="tl-main" style="flex-direction:column;gap:10px">'
      +'<span class="faixa campea-tl" style="background:'+esc(ct.cor)+'"></span>'
      +'<div class="hd-sub" style="font-size:13px;letter-spacing:6px">CAMPEÃ DO TORNEIO</div>'
      +'<div class="tl-nm" style="color:'+esc(ct.cor)+'">'+esc(ct.n)+'</div></div></div>';
  }
  var live=null;
  for(var i=0;i<gs.length;i++)if(gs[i].st==="ao_vivo"){live=gs[i];break;}
  if(!live)for(var j=0;j<gs.length;j++)if(gs[j].st!=="finalizada"){live=gs[j];break;}
  var h='<div class="tl">';
  h+='<div class="tl-hd"><div class="hd-ti" style="font-size:28px">'+esc(D.config.nome||CORES_NOME_PADRAO)+'</div>';
  h+='<div class="hd-sub" style="margin-left:auto">RS-VOLEIBOL</div></div>';
  if(!live){
    /* Intervalo entre jogos: em vez de uma tela vazia projetada no ginasio,
       mostra a classificacao — que e o que as pessoas querem ver mesmo. */
    var Sv=coresStandings(gamesArr(),teamsArr(),D.events,D.config);
    h+='<div class="tl-main" style="flex-direction:column;gap:14px">';
    h+='<div class="hd-sub" style="font-size:13px;letter-spacing:6px">CLASSIFICAÇÃO</div>';
    if(!Sv.length||!Sv.some(function(r){return r.j>0;})){
      h+='<div class="empty"><div class="big">EM BREVE</div></div>';
    }else{
      h+='<table class="tb" style="max-width:900px;width:100%"><tbody>';
      Sv.forEach(function(r){
        h+='<tr><td class="faint">'+r.pos+'</td><td class="nm"><span style="display:inline-flex;align-items:center;gap:12px">';
        h+='<span class="faixa" style="background:'+esc(r.cor)+';height:26px"></span>'+esc(r.n)+'</span></td>';
        h+='<td>'+r.j+'J</td><td>'+r.v+'V</td><td class="faint">'+r.d+'D</td>';
        h+='<td>'+(r.saldo>0?"+":"")+r.saldo+'</td>';
        h+='<td style="font-weight:800">'+r.pts+'</td></tr>';
      });
      h+='</tbody></table>';
    }
    h+='</div></div>';
    return h;
  }
  var A=tF(live.a),B=tF(live.b);
  if(!A||!B){h+='<div class="tl-main"><div class="empty">equipes não encontradas</div></div></div>';return h;}
  var st=calc(live);
  h+='<div class="tl-main">';
  [{t:A,s:"A"},{t:B,s:"B"}].forEach(function(x,ix){
    if(ix===1)h+='<div class="tl-x">×</div>';
    var serving=st.serve&&st.serve.side===x.s;
    h+='<div class="tl-team">';
    h+='<span class="faixa telao" style="background:'+esc(x.t.cor)+'"></span>';
    h+='<div class="tl-nm">'+esc(x.t.n)+(serving?' <span style="font-size:.5em">🏐</span>':'')+'</div>';
    /* SEM color inline: estilo inline vence o @supports que ajusta a cor da
       equipe ao tema, e o placar do PRETO sumia no escuro / do BRANCO no claro.
       Passa so o --c; quem pinta e o CSS. */
    h+='<div class="tl-pt" style="--c:'+esc(x.t.cor)+'">'+st.pts[x.s]+'</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="tl-bot">';
  /* classificacao resumida */
  var S=coresStandings(gamesArr(),teamsArr(),D.events,D.config);
  h+='<div><div class="hd-sub" style="margin-bottom:8px">CLASSIFICAÇÃO</div><table class="tb"><tbody>';
  S.slice(0,6).forEach(function(r){
    h+='<tr><td class="faint">'+r.pos+'</td><td class="nm"><span style="display:inline-flex;align-items:center;gap:8px">';
    h+='<span class="dot" style="background:'+esc(r.cor)+'"></span>'+esc(r.n)+'</span></td>';
    h+='<td>'+r.v+'V</td><td class="faint">'+(r.saldo>0?"+":"")+r.saldo+'</td>';
    h+='<td style="font-weight:800">'+r.pts+'</td></tr>';
  });
  h+='</tbody></table></div>';
  /* proximos */
  var prox=gs.filter(function(g){return g.st!=="finalizada"&&g.id!==live.id;}).slice(0,4);
  h+='<div><div class="hd-sub" style="margin-bottom:8px">PRÓXIMOS JOGOS</div>';
  if(!prox.length)h+='<div class="faint">—</div>';
  prox.forEach(function(g){
    var a=tF(g.a),b=tF(g.b);if(!a||!b)return;
    h+='<div style="display:flex;align-items:center;gap:9px;padding:5px 0;font-weight:700">';
    h+='<span class="dot" style="background:'+esc(a.cor)+'"></span>'+esc(a.n);
    h+='<span class="faint">×</span><span class="dot" style="background:'+esc(b.cor)+'"></span>'+esc(b.n);
    h+='<span class="faint" style="margin-left:auto;font-size:11px">'+(g.tm||fD(g.dt))+'</span></div>';
  });
  h+='</div></div></div>';
  return h;
}
