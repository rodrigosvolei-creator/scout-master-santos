}

/* ---------------- HOME: mural de jogos ---------------- */
function rHome(){
  /* Grupos, nao jogos: dois sets do mesmo confronto sao UM card. */
  var grupos=coresGrupos(gamesRes(),D.events,D.teams,D.config);
  var gs=grupos.map(function(gr){return gr.atual;});
  var h='';
  if(!_loaded.games)return h+'<div class="empty">carregando…</div>';
  if(!gs.length){
    h+='<div class="empty"><div class="big">NENHUM JOGO AINDA</div>';
    h+='<div>Crie as equipes por cor e os jogos na aba <b>Admin</b>.</div>';
    h+='<div class="row" style="justify-content:center;margin-top:16px"><button class="btn pri" onclick="go(\'admin\')">Ir para o Admin</button></div></div>';
    return h;
  }
  /* Um bloco por fase: classificatoria, semifinal, 3o lugar, final. */
  var temMata=false;
  for(var i=0;i<gs.length;i++)if(coresFase(gs[i])!=="class")temMata=true;
  ["class","semi","terceiro","final"].forEach(function(f){
    var daFase=grupos.filter(function(gr){return coresFase(gr.atual)===f;});
    if(!daFase.length)return;
    h+='<h2 class="sec">'+(f==="class"?"JOGOS":CORES_FASES[f].l.toUpperCase())
      +(f==="class"&&temMata?'<span class="sec-sub">fase classificatória</span>':'')+'</h2>';
    daFase.forEach(function(gr){h+=gameCard(gr.atual,gr);});
  });
  var camp=coresCampeao(gamesArr(),D.events,D.teams,D.config);
  if(camp&&tF(camp)){
    h='<div class="campeao" style="--c:'+esc(tF(camp).cor)+'">'
      +corHeart(esc(tF(camp).cor),'faixa xl')
      +'<div><div class="campeao-lb">CAMPEÃ DO TORNEIO</div>'
      +'<div class="campeao-nm">'+esc(tF(camp).n)+'</div></div></div>'+h;
  }
  return h;
}
function gameCard(g,grupo){
  var A=tF(g.a),B=tF(g.b);
  var st=calc(g);
  /* Com 2 sets o card e do CONFRONTO: mostra os dois placares e abre sempre o
     set que esta valendo. Ninguem consegue clicar no set 2 antes da hora. */
  var multi=(grupo&&grupo.sets>1);
  /* Jogo de mata-mata que ainda espera resultado mostra "Vencedor Semifinal 1". */
  /* Faixa de cor no lugar do escudo com iniciais: o nome ja esta escrito ao
     lado, entao a sigla so repetia. A cor continua identificando a equipe. */
  function ladoHTML(t,lado,extra){
    var nm=t?t.n:coresLadoLabel(g,lado,D.teams);
    var cor=t?t.cor:'#64748b';
    var faixa=corHeart(esc(cor),'faixa');
    var txt='<div style="min-width:0"><div class="gc-nm'+(t?'':' pend')+'">'+esc(nm)+'</div>'+extra+'</div>';
    return lado==="A"?(faixa+txt):(txt+faixa);
  }
  var live=g.st==="ao_vivo",fim=(g.st==="finalizada");
  var rot=multi?"":coresRotulo(g);
  var h='<div class="gcard'+(live?" live":"")+'">';
  h+='<div class="gc-vs">'+ladoHTML(A,"A",'<div class="gc-meta">'
    +(rot?'<span class="rot">'+esc(rot)+'</span> ':'')
    +(g.dt?fD(g.dt):"")+(g.tm?" · "+esc(g.tm):"")+'</div>')+'</div>';
  if(multi){
    var ps=grupo.placarSets||{};
    if(grupo.melhorDe)h+='<div class="gc-bo">melhor de '+grupo.melhorDe+'<b>'+(ps[g.a]||0)+'-'+(ps[g.b]||0)+'</b></div>';
    h+='<div class="gc-sets">';
    grupo.jogos.forEach(function(j){
      var sj=calc(j);
      var jogado=(j.st==="finalizada"||j.st==="ao_vivo"||sj.pts.A||sj.pts.B);
      var morto=(grupo.fechado&&!jogado);
      h+='<div class="gc-set'+(j.st==="ao_vivo"?" viva":"")+(j.id===g.id&&!grupo.fechado?" agora":"")+(morto?" morto":"")+'">'
        +'<span class="gc-set-lb">SET '+(j.set||1)+'</span>'
        +'<span class="gc-set-pl">'+(jogado?(sj.pts.A+' x '+sj.pts.B):'—')+'</span></div>';
    });
    h+='</div>';
  }else{
    h+='<div class="gc-sc">'+st.pts.A+'<span class="faint" style="font-size:19px"> x </span>'+st.pts.B+'</div>';
  }
  h+='<div class="gc-vs dir">';
  h+=ladoHTML(B,"B",'<div class="gc-meta">'+(live?"em andamento":(fim?"encerrado":"a jogar"))+'</div>');
  h+='</div>';
  h+='<div class="gc-act">';
  var todoFim=multi?grupo.fechado:fim;
  var algumVivo=multi?grupo.jogos.some(function(j){return j.st==="ao_vivo";}):live;
  h+='<span class="pill '+(algumVivo?"live":(todoFim?"fim":"age"))+'">'
    +(algumVivo?"AO VIVO":(todoFim?"FIM":"AGENDADO"))+'</span>';
  if(multi&&!todoFim)h+='<span class="gc-agora">jogando o set '+(g.set||1)+'</span>';
  if(A&&B){
    h+='<button class="btn sm pri" onclick="go(\'mesa\',\'&g='+g.id+'\')">'+(todoFim?"Ver":"Marcar")+'</button>';
    /* Tela propria de celular: cabe inteira, nao rola durante a marcacao. */
    if(!todoFim)h+='<button class="btn sm cel-cta" onclick="go(\'mesac\',\'&g='+g.id+'\')" title="Tela de marcação que cabe no celular">Marcar celular</button>';
  }
  else h+='<span class="faint" style="font-size:10px;text-align:right;line-height:1.3">aguardando<br>o resultado</span>';
  h+='</div></div>';
  return h;
}

/* ---------------- MESA: a tela do operador ---------------- */
function rMesa(){
  var g=D.games[GID];
  if(g&&(!g.a||!g.b)){var gr=gRes(GID);if(gr&&gr.a&&gr.b)g=gr;}   /* mata-mata */
  if(!g)return '<div class="empty"><div class="big">JOGO NÃO ENCONTRADO</div><button class="btn" onclick="go(\'home\')" style="margin-top:14px">Voltar aos jogos</button></div>';
  var A=tF(g.a),B=tF(g.b);
  if(!A||!B){
    return '<div class="empty"><div class="big">'+esc(coresLadoLabel(g,"A",D.teams))+' × '+esc(coresLadoLabel(g,"B",D.teams))+'</div>'
      +'<div>Este jogo depende de um resultado que ainda não saiu.</div>'
      +'<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" onclick="go(\'home\')">← Voltar aos jogos</button></div></div>';
  }
  var st=calc(g);
  MEUTID=MEUTID||localStorage.getItem("cores_tid_"+g.id)||null;
  if(MEUTID!==g.a&&MEUTID!==g.b)MEUTID=null;
  if(!MEUTID)return rEscolhaEquipe(g,A,B);

  var meuSide=(MEUTID===g.a)?"A":"B";
  var meu=tF(MEUTID), adv=(meuSide==="A")?B:A;
  var h=placarHTML(g,A,B,st);

  /* Antes de marcar: quem saca primeiro + a ordem de saque posicionada 1..N.
     O sacador nao e escolhido em lista — sai da posicao 1 da escalacao. */
  var faltaSetup=(!st.firstServeSide)||(!st.lineupSet[meuSide]);
  if(faltaSetup&&!st.done)return h+rSetup(g,meu,adv,st,meuSide,A,B);

  return h+rMesaJogo(g,meu,adv,st,meuSide,A,B);
}

function rEscolhaEquipe(g,A,B){
  var h='<h2 class="sec">QUEM VOCÊ VAI MARCAR?<span class="sec-sub">um aparelho por equipe</span></h2>';
  h+='<div class="banner inf">Cada operador marca <b>uma</b> equipe. O outro abre este mesmo jogo e escolhe a outra — placar, saque e escalação ficam iguais nos dois, em tempo real.</div>';
  h+='<div class="pickteam">';
  [A,B].forEach(function(t){
    h+='<button class="pickteam-btn" style="--c:'+esc(t.cor)+'" onclick="setMeuTid(\''+t.id+'\')">';
    h+=corHeart(esc(t.cor),'pickteam-cor');
    h+='<div class="pickteam-nm">'+esc(t.n)+'</div>';
    h+='<div class="pickteam-sub">'+playersOf(t).length+' atletas</div>';
    h+='<div class="pickteam-cta">MARCAR ESTA EQUIPE</div></button>';
  });
  h+='</div>';
  h+='<div class="row" style="margin-top:16px"><button class="btn" onclick="go(\'home\')">← Voltar aos jogos</button></div>';
  return h;
}

/* Placar do topo — o mesmo nos dois aparelhos. */
function placarHTML(g,A,B,st){
  var h='<div class="mesa-top">';
  [{t:A,s:"A"},{t:B,s:"B"}].forEach(function(x){
    var mine=(x.t.id===MEUTID);
    var serving=st.serve&&st.serve.side===x.s;
    var sacador=serving&&st.serve.jid?pF(x.t,st.serve.jid):null;
    h+='<div class="mesa-side'+(mine?" mine":"")+(serving?" serving":"")+'" style="--c:'+esc(x.t.cor)+'">';
    h+=corHeart(esc(x.t.cor),'faixa lg');
    h+='<div class="mesa-id"><div class="nm">'+esc(x.t.n)
    +(coresLado(g,x.s)?' <span class="ladotag">'+coresLadoSeta(coresLado(g,x.s))+' '+coresLadoNome(coresLado(g,x.s))+'</span>':'')+'</div>';
    h+='<div class="sub">'+(mine?"VOCÊ MARCA":"outro operador")+'</div>';
    if(serving)h+='<div class="serve-badge">🏐 SACA'+(sacador?" · "+esc(sacador.nm):"")+'</div>';
    h+='</div>';
    h+='<div class="pts">'+st.pts[x.s]+'</div></div>';
  });
  h+='</div>';
  return h;
}

/* ---- SETUP: quem saca + ordem de saque 1..N ---- */
function rSetup(g,meu,adv,st,meuSide,A,B){
  var cfg=coresCfg(D.config);
  var n=cfg.emQuadra;
  if(SETUP===null)SETUP=(st.lineupSet[meuSide]?st.lineup[meuSide].slice(0,n):[]);
  var elenco=playersOf(meu);
  var usados={};SETUP.forEach(function(j){usados[j]=1;});

  var h='<h2 class="sec">ANTES DE COMEÇAR<span class="sec-sub">você marca a '+esc(meu.n)+'</span></h2>';

  /* passo 1 — equipe que abre sacando */
  h+='<div class="step'+(st.firstServeSide?" done":"")+'">';
  h+='<div class="step-hd"><span class="step-n">1</span>Qual equipe saca primeiro?'+(st.firstServeSide?'<span class="step-ok">✓ definido</span>':'')+'</div>';
  h+='<div class="row">';
  [A,B].forEach(function(t){
    var on=st.firstServeSide===((t.id===g.a)?"A":"B");
    h+='<button class="teamchoice'+(on?" on":"")+'" style="--c:'+esc(t.cor)+'" onclick="setFirstServe(\''+t.id+'\')">';
    h+=corHeart(esc(t.cor),'dot')+esc(t.n)+(on?' 🏐':'')+'</button>';
  });
  h+='</div>';
  h+='<div class="step-hint">Vale para as duas equipes — o outro operador vê a mesma escolha.</div>';
  h+='</div>';

  /* passo 2 — ordem de saque posicionada */
  /* Lado da quadra — some quando ja esta definido para nao virar ruido. */
  var meuLado=coresLado(g,meuSide);
  h+='<div class="step'+(meuLado?" done":"")+'">';
  h+='<div class="step-hd"><span class="step-n">2</span>De que lado a '+esc(meu.n)+' está?'+(meuLado?'<span class="step-ok">✓ '+coresLadoNome(meuLado)+'</span>':'')+'</div>';
  h+='<div class="row">';
  ["E","D"].forEach(function(l){
    h+='<button class="teamchoice ladoch'+(meuLado===l?" on":"")+'" style="--c:'+esc(meu.cor)+'" onclick="setLado(\''+l+'\')">';
    h+='<span style="font-size:18px">'+coresLadoSeta(l)+'</span>'+coresLadoNome(l)+'</button>';
  });
  h+='</div>';
  h+='<div class="step-hint">Olhando da mesa. No próximo set o app inverte sozinho.</div>';
  h+='</div>';

  h+='<div class="step'+(SETUP.length>=n?" done":"")+'">';
  h+='<div class="step-hd"><span class="step-n">3</span>Ordem de saque da '+esc(meu.n)+(SETUP.length>=n?'<span class="step-ok">✓ completa</span>':'')+'</div>';
  h+='<div class="step-hint">Toque nos atletas na ordem em que vão sacar. Quem ficar na <b>posição 1</b> começa sacando; depois o rodízio anda sozinho.</div>';
  h+='<div class="slots">';
  for(var i=0;i<n;i++){
    var jid=SETUP[i], p=jid?pF(meu,jid):null;
    h+='<div class="slot'+(p?" filled":"")+'" style="--c:'+esc(meu.cor)+'"'+(p?' onclick="setupRemove('+i+')"':'')+'>';
    h+='<span class="slot-n">'+(i+1)+'</span>';
    if(p){h+='<span class="slot-nm">'+esc(p.nm)+'</span><span class="slot-x">×</span>';}
    else h+='<span class="slot-empty">livre</span>';
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="pool">';
  elenco.forEach(function(p){
    var on=!!usados[p.id];
    h+='<button class="poolp'+(on?" used":"")+'" style="--c:'+esc(meu.cor)+'" onclick="setupPick(\''+p.id+'\')"'+(on?' disabled':'')+'>';
    h+='<span class="poolp-nu" style="background:'+esc(meu.cor)+';--c:'+esc(meu.cor)+'">'+esc(p.nu!=null&&p.nu!==""?p.nu:initials(p.nm))+'</span>';
    h+=esc(p.nm)+'</button>';
  });
  if(!elenco.length)h+='<span class="faint">Nenhum atleta cadastrado nesta equipe — cadastre no Admin.</span>';
  h+='</div>';
  h+='<div class="row" style="margin-top:12px">';
  h+='<button class="btn pri" onclick="salvarEscalacao()"'+(SETUP.length<n||!st.firstServeSide?" disabled":"")+'>✓ Confirmar e começar</button>';
  if(SETUP.length)h+='<button class="btn sm" onclick="setupLimpar()">Limpar</button>';
  h+='<button class="btn sm" onclick="trocarEquipe()">Marcar a outra equipe</button>';
  h+='<button class="btn sm" onclick="go(\'home\')">← Jogos</button>';
  h+='</div>';
  if(SETUP.length>=n&&!st.firstServeSide)h+='<div class="step-hint" style="color:var(--bad)">Falta escolher quem saca primeiro (passo 1).</div>';
  h+='</div>';
  return h;
}
function setupPick(jid){
  var g=D.games[GID];if(!g)return;
  var n=coresCfg(D.config).emQuadra;
  if(SETUP===null)SETUP=[];
  if(SETUP.indexOf(jid)>=0)return;
  if(SETUP.length>=n){toast("As "+n+" posições já estão preenchidas","err");return;}
  SETUP.push(jid);render();
}
function setupRemove(i){ if(SETUP){SETUP.splice(i,1);render();} }
function setupLimpar(){ SETUP=[];render(); }
function setFirstServe(tid){ pushEvent(GID,{t:"first",tid:tid}); }
function salvarEscalacao(){
  var g=D.games[GID];if(!g)return;
  var n=coresCfg(D.config).emQuadra;
  if(!SETUP||SETUP.length<n){toast("Complete as "+n+" posições","err");return;}
  var st=calc(g);
  if(!st.firstServeSide){toast("Escolha quem saca primeiro","err");return;}
  var ordem=SETUP.slice();
  SETUP=null;ESCALACAO_ABERTA=false;render();   /* mesmo motivo do fazerSub */
  pushEvent(GID,{t:"lineup",tid:MEUTID,ordem:ordem}).then(function(){
    toast("Escalação salva","ok");
  });
}
/* ---- LADO DA QUADRA ----
   Fica no JOGO (games/<id>/ladoA), nao no evento: e do confronto, os dois
   aparelhos leem o mesmo. Ao definir no set 1, o set seguinte do mesmo
   confronto ja nasce com o lado TROCADO — que e a regra do jogo. */
function setLado(ladoDaMinha){
  var g=D.games[GID]; if(!g||!MEUTID)return;
  var meuSide=(MEUTID===g.a)?"A":"B";
  var ladoA=(meuSide==="A")?ladoDaMinha:coresLadoOposto(ladoDaMinha);
  g.ladoA=ladoA;
  writeNode("games/"+GID+"/ladoA",ladoA);
  var prox=coresProximoSet(gamesArr(),g);
  if(prox&&!prox.ladoA){
    var inv=coresLadoOposto(ladoA);
    prox.ladoA=inv;
    writeNode("games/"+prox.id+"/ladoA",inv);
    toast("Lado definido — o "+(coresRotulo(prox)||"próximo set")+" já inverte","ok");
  }
  render();
}

/* ---- EMENDA DO SET SEGUINTE ----
   O operador nao deve "entrar em outro jogo": ao fechar o set 1 ele cai no
   set 2 com a mesma equipe, a mesma escalacao, o lado ja trocado e o saque
   invertido (quem recebeu comeca sacando). So falta tocar em Iniciar. */
function irProximoSet(){
  var g=D.games[GID]; if(!g){toast("Jogo não encontrado","err");return;}
  var prox=coresProximoSet(gamesArr(),g);
  if(!prox){toast("Não há set seguinte para este confronto","err");return;}
  if(!MEUTID){go(VIEW,"&g="+prox.id);return;}
  var st=calc(g);
  var meuSide=(MEUTID===g.a)?"A":"B";
  var ordem=(st.lineup[meuSide]||[]).slice(0,coresCfg(D.config).emQuadra);
  var firstTid=(st.firstServeSide==="A")?g.b:g.a;   /* quem recebeu, saca */
  try{localStorage.setItem("cores_tid_"+prox.id,MEUTID);}catch(e){}
  var jaLa=coresComputeGame(prox,D.events[prox.id]||null,D.teams,D.config);
  var passos=[];
  if(!jaLa.firstServeSide&&st.firstServeSide)passos.push(pushEvent(prox.id,{t:"first",tid:firstTid}));
  if(ordem.length&&!jaLa.lineupSet[(MEUTID===prox.a)?"A":"B"])
    passos.push(pushEvent(prox.id,{t:"lineup",tid:MEUTID,ordem:ordem}));
  Promise.all(passos).then(function(){
    go(VIEW==="mesac"?"mesac":"mesa","&g="+prox.id);
  }).catch(function(){ go(VIEW==="mesac"?"mesac":"mesa","&g="+prox.id); });
}

/* Bloco que oferece a emenda, usado na mesa e no celular. */
function proximoSetHTML(g,classe){
  var prox=coresProximoSet(gamesArr(),g);
  if(!prox)return "";
  /* melhor de 3: se o confronto ja esta decidido, o set seguinte nao se joga */
  if(g.conf){
    var meus=gamesArr().filter(function(x){return x.conf===g.conf;});
    var c=coresConfronto(meus,D.events,D.teams,D.config);
    if(c&&c.decidido)return '<div class="txt"><b>Confronto encerrado</b> — '
      +esc((tF(c.win)||{}).n||'')+' venceu por '+(c.sets[c.win]||0)+' a '+(c.sets[c.lose]||0)+' em sets.</div>';
  }
  var pronto=(prox.st==="finalizada");
  return '<button class="'+(classe||"btn pri")+'" onclick="irProximoSet()">'
    +(pronto?"Ver o "+esc(coresRotulo(prox)||"próximo set"):"▶ Ir para o "+esc(coresRotulo(prox)||"próximo set"))
    +'</button>';
}

function reabrirEscalacao(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g),meuSide=(MEUTID===g.a)?"A":"B";
  SETUP=st.lineup[meuSide].slice(0,coresCfg(D.config).emQuadra);
  ESCALACAO_ABERTA=true;render();
}

/* ---- MESA em jogo ---- */
function rMesaJogo(g,meu,adv,st,meuSide,A,B){
  var cfg=coresCfg(D.config);
  var h='';

  /* A cada rally novo a selecao volta para o sacador da propria equipe: o
     primeiro toque do rally e quase sempre o saque. E so sugestao — tocar em
     outro atleta troca. Sem isso o operador ficava com o atleta do rally
     anterior selecionado e marcava no jogador errado. */
  if(_rallyVisto!==st.rally){ _rallyVisto=st.rally; if(!SUBPICK)SELP=null; }
  if(!SELP&&!SUBPICK&&st.serve&&st.serve.side===meuSide&&pF(meu,st.serve.jid))SELP=st.serve.jid;

  if(ESCALACAO_ABERTA&&!st.done){
    h+=rSetup(g,meu,adv,st,meuSide,A,B);
    h+='<div class="row"><button class="btn sm" onclick="fecharEscalacao()">Cancelar</button></div>';
    return h;
  }

  if(st.done){
    var wt=st.winnerTid?tF(st.winnerTid):null;
    h+='<div class="banner ok"><b>Set encerrado</b> — '+(wt?esc(wt.n)+" venceu por ":"")+st.pts.A+' x '+st.pts.B+'. ';
    h+=(g.st!=="finalizada"?'Confirme para entrar na classificação.':'Jogo finalizado.')+'</div>';
    h+='<div class="row" style="margin-bottom:12px">';
    if(g.st!=="finalizada")h+='<button class="btn pri" onclick="finalizarJogo()">✓ Finalizar jogo</button><button class="btn" onclick="undoLast()">↩ Desfazer última</button>';
    else h+=proximoSetHTML(g,"btn pri");
    h+='</div>';
  }else if(g.st!=="ao_vivo"){
    h+='<div class="banner inf">Escalação pronta. <b>Inicie o jogo</b> para começar a marcar.</div>';
    h+='<div class="row" style="margin-bottom:12px"><button class="btn pri" onclick="iniciarJogo()">▶ Iniciar jogo</button><button class="btn sm" onclick="reabrirEscalacao()">✎ Mudar escalação</button><button class="btn sm" onclick="go(\'home\')">← Jogos</button></div>';
  }

  /* atletas: em quadra na ORDEM DE SAQUE, com a posicao visivel */
  var court=st.lineup[meuSide]||[];
  var bench=playersOf(meu).filter(function(p){return court.indexOf(p.id)<0;});

  h+='<h2 class="sec">'+esc(meu.n)+'<span class="sec-sub">em quadra · na ordem de saque</span></h2>';
  h+='<div class="pgrid">';
  court.forEach(function(jid,ix){
    var p=pF(meu,jid);
    if(!p){h+='<div class="pbtn ghost"><span class="pos">'+(ix+1)+'</span><div class="pn faint">(atleta removido)</div></div>';return;}
    h+=pBtn(p,meu,st,ix+1,false,meuSide);
  });
  h+='</div>';

  /* substituicao */
  if(SUBPICK&&!SUBOUT){
    h+='<div class="subbar"><b>Substituição</b> — toque em quem <b>SAI</b> (nos cards acima).';
    h+='<div style="margin-top:8px"><button class="btn sm" onclick="cancelSub()">Cancelar</button></div></div>';
  }else if(SUBOUT){
    var outP=pF(meu,SUBOUT);
    h+='<div class="subbar"><b>Sai '+esc(outP?outP.nm:"")+'</b> — quem entra?';
    h+='<div class="pool" style="margin-top:8px">';
    if(!bench.length)h+='<span class="faint">Sem reservas nesta equipe.</span>';
    bench.forEach(function(p){
      h+='<button class="poolp" style="--c:'+esc(meu.cor)+'" onclick="fazerSub(\''+p.id+'\')">';
      h+='<span class="poolp-nu" style="background:'+esc(meu.cor)+';--c:'+esc(meu.cor)+'">'+esc(p.nu!=null&&p.nu!==""?p.nu:initials(p.nm))+'</span>';
      h+=esc(p.nm)+'</button>';
    });
    h+='</div><button class="btn sm" style="margin-top:8px" onclick="cancelSub()">Cancelar</button></div>';
  }else if(bench.length&&!SUBPICK){
    h+='<div class="benchrow"><span class="benchlb">RESERVAS</span>';
    bench.forEach(function(p){
      h+='<span class="benchp"><span class="poolp-nu" style="background:'+esc(meu.cor)+';--c:'+esc(meu.cor)+'">'+esc(p.nu!=null&&p.nu!==""?p.nu:initials(p.nm))+'</span>'+esc(p.nm)+'</span>';
    });
    h+='<button class="btn sm" onclick="abrirSub()">⇄ Substituir</button></div>';
  }

  /* acoes */
  var travado=st.done||g.st!=="ao_vivo";
  h+='<div class="'+(SELP&&!travado?"":"needp")+'" style="margin-top:18px">';
  h+='<h2 class="sec">AÇÃO<span class="sec-sub">'+(SELP&&pF(meu,SELP)?esc(pF(meu,SELP).nm):(travado?"jogo não está ao vivo":"escolha o atleta acima"))+'</span></h2>';
  h+='<div class="fgrid">';
  for(var fi=0;fi<CORES_FUND.length;fi++){
    var ak=CORES_FUND[fi], a=CORES_ACT[ak];
    h+='<div class="fbox"><div class="fh" style="background:'+CORES_FCOL[ak]+'"><span class="ico">'+a.i+'</span>'+esc(a.l)+'</div><div class="fb">';
    for(var i=0;i<a.o.length;i++){
      var oc=a.o[i];
      h+='<button style="background:'+CORES_OC[oc]+'" onclick="mark(\''+ak+'\',\''+oc+'\')">'+esc(oc)+'</button>';
    }
    h+='</div></div>';
  }
  h+='</div></div>';

  /* controles */
  /* Falta sem fundamento (rodizio, posicional, conducao, invasao, tempo):
     nao tem atleta e da ponto direto para a adversaria. */
  /* Ponto sem fundamento: quando o rally termina sem uma acao de atleta que
     valha marcar (bola fora do adversario, erro de saque dele, falta). Cobre os
     DOIS lados — senao o operador so conseguia registrar ponto contra si. */
  h+='<div class="faltabar">';
  h+='<button class="btn pontonos" onclick="marcarPontoNos()">➕ Ponto '+esc(meu.n)+'</button>';
  h+='<button class="btn pontoadv" onclick="marcarPontoAdv()">➕ Ponto '+esc(adv.n)+'</button>';
  h+='<button class="btn falta" onclick="marcarFalta()">⚠ Falta da '+esc(meu.n)+'</button>';
  /* Recolhida: 123px de texto fixo empurravam o "Desfazer" para fora da tela
     num notebook 1366x768. Fica a um clique de distancia. */
  h+='<details class="faltahint"><summary>quando usar cada um?</summary>'
    +'<b>Ponto '+esc(meu.n)+'</b>: o adversário errou o saque, mandou fora ou fez falta.<br>'
    +'<b>Ponto '+esc(adv.n)+'</b>: ela pontuou e você não quer esperar o outro operador.<br>'
    +'<b>Falta</b>: rodízio, posicional, condução, invasão, tempo (conta como falta da equipe).<br>'
    +'Os três <b>rodam o saque</b>. Se os dois operadores marcarem o mesmo rally, conta 1 ponto só.'
    +'</details></div>';

  h+='<div class="ctrls">';
  h+='<span class="ctrl-lb" title="Correção de placar: não mexe no saque">Corrigir '+esc(meu.n)+'</span>';
  h+='<button class="btn" onclick="adjust(\''+MEUTID+'\',1)">+1</button>';
  h+='<button class="btn" onclick="adjust(\''+MEUTID+'\',-1)">−1</button>';
  h+='<span class="ctrl-lb">'+esc(adv.n)+'</span>';
  h+='<button class="btn" onclick="adjust(\''+adv.id+'\',1)">+1</button>';
  h+='<button class="btn" onclick="adjust(\''+adv.id+'\',-1)">−1</button>';
  h+='<button class="btn" onclick="girarSaque()">↻ Girar saque</button>';
  h+='<button class="btn dgr" onclick="undoLast()">↩ Desfazer minha última</button>';
  h+='<button class="btn sm" onclick="reabrirEscalacao()">✎ Escalação</button>';
  h+='<button class="btn sm" onclick="trocarEquipe()">Trocar equipe</button>';
  h+='<button class="btn sm" onclick="go(\'home\')">← Jogos</button>';
  h+='</div>';

  /* feed + ladder */
  h+='<h2 class="sec">ÚLTIMAS AÇÕES<span class="sec-sub">as duas equipes</span></h2><div class="card">';
  h+=feedHTML(st,g);
  if(st.pointLog.length){
    h+='<div class="ladder">';
    st.pointLog.forEach(function(p){
      var c=(p.side==="A")?A.cor:B.cor;
      h+='<i style="background:'+esc(c)+'" title="'+esc(p.side==="A"?A.n:B.n)+'"></i>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function pBtn(p,team,st,pos,isBench,meuSide){
  var serving=st.serve&&st.serve.side===meuSide&&st.serve.jid===p.id;
  var saindo=(SUBPICK&&SUBOUT===p.id);
  var on=(!SUBPICK&&SELP===p.id);
  /* Em modo substituicao o card escolhe quem SAI; fora dele, seleciona para marcar. */
  var acao=SUBPICK?("pickOut('"+p.id+"')"):("selP('"+p.id+"')");
  /* A POSICAO de saque manda no card (e o que o operador usa); o numero da
     camisa fica discreto junto do nome — os dois grandes se confundiam. */
  var camisa=(p.nu!=null&&p.nu!=="")?("#"+p.nu):"";
  return '<button class="pbtn'+(on?" on":"")+(saindo?" out":"")+(SUBPICK?" subpick":"")+(serving?" serving":"")+'" style="--c:'+esc(team.cor)+'" onclick="'+acao+'">'
    +'<div class="pos" style="background:'+esc(team.cor)+';--c:'+esc(team.cor)+'">'+pos+'</div>'
    +'<div style="min-width:0;flex:1"><div class="pn">'+esc(p.nm)+'</div>'
    +'<div class="pr">'+(saindo?'<b class="sai">SAI</b>':(serving?'<b class="saca">🏐 SACANDO</b>':'saque '+pos))
    +(camisa?' <span class="camisa">'+esc(camisa)+'</span>':'')+'</div></div></button>';
}

function feedHTML(st,g){
  var evs=st.events.slice().reverse().filter(function(e){return e.t==="act";}).slice(0,10);
  if(!evs.length)return '<div class="faint">Nenhuma ação marcada ainda.</div>';
  var dupKeys={};st.dupes.forEach(function(d){dupKeys[d.k]=d._dupWhy||"rally";});
  var h='<div class="feed">';
  evs.forEach(function(e){
    var t=tF(e.tid),p=t?pF(t,e.jid):null;
    var a=CORES_ACT[e.ak];
    h+='<div class="fitem'+(dupKeys[e.k]?" dup":"")+'">';
    h+=corHeart(esc(t?t.cor:"#64748b"),'dot');
    h+='<b>'+esc(p?p.nm:"—")+'</b><span class="faint">'+esc(a?a.l:e.ak)+'</span>';
    h+='<span class="oc" style="background:'+(CORES_OC[e.oc]||"#64748b")+'">'+esc(e.oc)+'</span>';
    if(dupKeys[e.k])h+='<span class="dupwhy">só estatística · '+(dupKeys[e.k]==="janela"?"o outro operador já marcou este rally":"rally já pontuado")+'</span>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

/* ---------- acoes da mesa ---------- */
function setMeuTid(tid){MEUTID=tid;localStorage.setItem("cores_tid_"+GID,tid);SELP=null;SETUP=null;render();}
function trocarEquipe(){localStorage.removeItem("cores_tid_"+GID);MEUTID=null;SELP=null;SETUP=null;render();}
/* Sempre SELECIONA (nunca alterna). Toque repetido no mesmo atleta e comum na
   correria e nao pode zerar a selecao — a acao seguinte deixaria de gravar. */
function selP(jid){SELP=jid;render();}
function fecharEscalacao(){ESCALACAO_ABERTA=false;SETUP=null;render();}
function abrirSub(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g),meuSide=(MEUTID===g.a)?"A":"B";
  if(!(st.lineup[meuSide]||[]).length){toast("Defina a escalação primeiro","err");return;}
  SUBOUT=null;SELP=null;SUBPICK=true;render();
}
function pickOut(jid){SUBOUT=jid;render();}
function cancelSub(){SUBOUT=null;SUBPICK=false;render();}
function fazerSub(inJid){
  if(!SUBOUT){toast("Escolha quem sai","err");return;}
  var out=SUBOUT;
  /* Sai do modo substituicao ANTES de gravar e re-renderiza na hora: se isso
     ficasse no .then, o listener redesenhava os cards ainda em modo "quem sai"
     e o toque seguinte do operador era perdido. */
  SUBOUT=null;SUBPICK=false;SELP=null;render();
  pushEvent(GID,{t:"sub",tid:MEUTID,out:out,in:inJid}).then(function(){
    toast("Substituição feita","ok");
  });
}
function girarSaque(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g),meuSide=(MEUTID===g.a)?"A":"B";
  var lst=st.lineup[meuSide]||[];
  if(!lst.length){toast("Defina a escalação primeiro","err");return;}
  var last=st.lastServer[meuSide];
  var i=lst.indexOf(last);
  var nx=(i<0)?lst[0]:lst[(i+1)%lst.length];
  pushEvent(GID,{t:"serve",tid:MEUTID,jid:nx});
}
function mark(ak,oc){
  if(!SELP){toast("Escolha o atleta primeiro","err");return;}
  var g=D.games[GID];if(!g)return;
  var st=calc(g);
  if(st.done){toast("Set encerrado — finalize o jogo","err");return;}
  if(g.st!=="ao_vivo"){toast("Inicie o jogo antes de marcar","err");return;}
  pushEvent(GID,{t:"act",tid:MEUTID,jid:SELP,ak:ak,oc:oc,rally:st.rally}).then(function(ref){
    /* Se o ponto deste rally ja tinha sido contado pelo outro operador, a acao
       entra como estatistica e o placar NAO sobe. Avisa, pra nao ficar silencioso. */
    var key=ref&&ref.key; if(!key)return;
    setTimeout(function(){
      var gg=D.games[GID]; if(!gg)return;
      var st2=calc(gg);
      for(var i=0;i<st2.dupes.length;i++){
        if(st2.dupes[i].k===key){ toast("Ação salva no scout. O ponto deste rally já tinha sido contado.",""); break; }
      }
    },150);
  }).catch(function(){});
}
function marcarFalta(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g);
  if(st.done){toast("Set encerrado — finalize o jogo","err");return;}
  if(g.st!=="ao_vivo"){toast("Inicie o jogo antes de marcar","err");return;}
  /* sem jid: e falta da equipe, nao entra na estatistica de nenhum atleta */
  pushEvent(GID,{t:"act",tid:MEUTID,jid:null,ak:"falta",oc:"Erro",rally:st.rally});
}
/* O adversario pontuou. Sobe o placar dele e ROTACIONA o saque — diferente do
   +1, que e so correcao de numero. Sem isto, o operador so via o rodizio andar
   quando o outro operador marcasse a jogada dele. */
/* A nossa equipe pontuou sem acao nossa (erro/falta do adversario). Sobe o nosso
   placar e recupera o saque — o side-out a favor deixa de depender do colega. */
function marcarPontoNos(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g);
  if(st.done){toast("Set encerrado — finalize o jogo","err");return;}
  if(g.st!=="ao_vivo"){toast("Inicie o jogo antes de marcar","err");return;}
  pushEvent(GID,{t:"act",tid:MEUTID,jid:null,ak:"pontonos",oc:"Ponto",rally:st.rally});
}
function marcarPontoAdv(){
  var g=D.games[GID];if(!g)return;
  var st=calc(g);
  if(st.done){toast("Set encerrado — finalize o jogo","err");return;}
  if(g.st!=="ao_vivo"){toast("Inicie o jogo antes de marcar","err");return;}
  pushEvent(GID,{t:"act",tid:MEUTID,jid:null,ak:"pontoadv",oc:"Erro",rally:st.rally});
}
function adjust(tid,delta){
  var g=D.games[GID];if(!g)return;
  pushEvent(GID,{t:"adj",tid:tid,delta:delta});
}
/* Desfaz so o ULTIMO evento DESTE aparelho/equipe — nunca mexe no do outro operador. */
function undoLast(){
  var evObj=D.events[GID]||{};
  var keys=Object.keys(evObj).sort();
  for(var i=keys.length-1;i>=0;i--){
    var e=evObj[keys[i]];
    if(e&&e.tid===MEUTID){
      db.ref(ROOT+"/events/"+GID+"/"+keys[i]).remove().then(function(){toast("Última ação desfeita","ok");}).catch(onWriteErr);
      return;
    }
  }
  toast("Nada seu para desfazer","err");
}
function iniciarJogo(){var g=D.games[GID];if(!g)return;g.st="ao_vivo";writeNode("games/"+GID+"/st","ao_vivo");}
function finalizarJogo(){
  var g=D.games[GID];if(!g)return;
  g.st="finalizada";
  writeNode("games/"+GID+"/st","finalizada").then(function(){
    toast("Jogo finalizado — classificação atualizada","ok");
    materializarDependentes();
  });
}
/* A final nasce como "vencedor da SF1 x vencedor da SF2". Quando a semi acaba,
   grava as equipes de verdade no jogo — senao a mesa nao teria como abrir. */
function materializarDependentes(){
  var res=gamesRes();
  for(var i=0;i<res.length;i++){
    var r=res[i], cru=D.games[r.id]; if(!cru)continue;
    if(r.a&&!cru.a)writeNode("games/"+r.id+"/a",r.a);
    if(r.b&&!cru.b)writeNode("games/"+r.id+"/b",r.b);
  }
}

/* ---------------- CLASSIFICACAO ---------------- */
/* ================= MODO CELULAR =================
   Mesma logica, mesmos eventos, mesmo banco — muda so o desenho da tela.
   A regra que manda aqui: DURANTE A MARCACAO NADA ROLA. Quatro faixas de
   altura fixa e o miolo das acoes esticando no que sobra; tudo que nao cabe
   (corrigir placar, substituir, escalacao) vive num painel que abre por cima.
   A mesa normal continua intacta para tablet e notebook. */
var CELMENU=false;

function celAviso(txt,botoes){
  return '<div class="cel-aviso"><div class="big">'+txt+'</div>'+(botoes||'')+'</div>';
}

/* faixa de cima: voltar · placar · painel */
function celTopo(g,A,B,st,mostrarMais){
  var eu=function(t){return MEUTID===t.id?'<small>VOCÊ MARCA</small>':'';};
  var h='<div class="cel-top">';
  h+='<button class="cel-sair" onclick="go(\'home\')" title="Voltar aos jogos">←</button>';
  h+='<div class="cel-pl">';
  var ldA=coresLado(g,"A"), ldB=coresLado(g,"B");
  h+='<div class="lado">'+corHeart(esc(A.cor),'celt')+'<div class="nm">'+esc(A.n)+eu(A)
    +(ldA?'<small class="ld">'+coresLadoSeta(ldA)+'</small>':'')+'</div></div>';
  h+='<div class="sc">'+st.pts.A+'<i>×</i>'+st.pts.B
    +(coresRotulo(g)?'<span class="rot rot-sc">'+esc(coresRotulo(g))+'</span>':'')+'</div>';
  h+='<div class="lado dir"><div class="nm" style="text-align:right">'+esc(B.n)+eu(B)
    +(ldB?'<small class="ld">'+coresLadoSeta(ldB)+'</small>':'')+'</div>'+corHeart(esc(B.cor),'celt')+'</div>';
  h+='</div>';

  if(TESTE)h=h.replace('<div class="cel-top">','<div class="cel-top"><span class="cel-teste">TESTE</span>');
  h+='</div>';
  return h;
}

function rMesaCel(){
  var g=D.games[GID];
  if(g&&(!g.a||!g.b)){var gr=gRes(GID);if(gr&&gr.a&&gr.b)g=gr;}
  if(!g)return '<div class="cel">'+celAviso('JOGO NÃO ENCONTRADO',
    '<button class="cel-x" onclick="go(\'home\')">← Voltar aos jogos</button>')+'</div>';
  var A=tF(g.a),B=tF(g.b);
  if(!A||!B)return '<div class="cel">'+celAviso(esc(coresLadoLabel(g,"A",D.teams))+' × '+esc(coresLadoLabel(g,"B",D.teams)),
    '<div class="txt">Este jogo depende de um resultado que ainda não saiu.</div>'
    +'<button class="cel-x" onclick="go(\'home\')">← Voltar aos jogos</button>')+'</div>';

  var st=calc(g);
  MEUTID=MEUTID||localStorage.getItem("cores_tid_"+g.id)||null;
  if(MEUTID!==g.a&&MEUTID!==g.b)MEUTID=null;

  /* 1. qual equipe eu marco */
  if(!MEUTID){
    var h='<div class="cel">'+celTopo(g,A,B,st,false);
    h+='<div class="cel-setup"><div class="cel-tit">Qual equipe você vai marcar?</div>';
    h+='<div class="cel-esc">';
    [A,B].forEach(function(t){
      h+='<button onclick="setMeuTid(\''+t.id+'\')">'+corHeart(esc(t.cor),'celh')+esc(t.n)+'</button>';
    });
    h+='</div>';
    h+='<div style="font-size:13px;color:var(--mute);line-height:1.5;margin-top:4px">'
      +'Cada pessoa marca <b>uma</b> equipe. A outra abre este mesmo jogo e escolhe a outra — '
      +'placar e saque ficam iguais nos dois.</div>';
    h+='</div></div>';
    return h;
  }

  var meuSide=(MEUTID===g.a)?"A":"B";
  var meu=tF(MEUTID), adv=(meuSide==="A")?B:A;
  var faltaSetup=(!st.firstServeSide)||(!st.lineupSet[meuSide]);

  if((faltaSetup||ESCALACAO_ABERTA)&&!st.done)
    return '<div class="cel">'+celTopo(g,A,B,st,false)+celSetup(g,meu,adv,st,meuSide,A,B)+'</div>'+celMenuHTML(g,st,meu,adv);

  return '<div class="cel">'+celTopo(g,A,B,st,true)+celJogo(g,meu,adv,st,meuSide,A,B)+'</div>'+celMenuHTML(g,st,meu,adv);
}

/* --------- preparar: quem saca + ordem de saque --------- */
function celSetup(g,meu,adv,st,meuSide,A,B){
  var n=coresCfg(D.config).emQuadra;
  if(SETUP===null)SETUP=(st.lineupSet[meuSide]?st.lineup[meuSide].slice(0,n):[]);
  var usados={};SETUP.forEach(function(j){usados[j]=1;});

  var h='<div class="cel-setup">';
  h+='<div class="cel-tit">1 · Qual equipe saca primeiro?</div>';
  h+='<div class="cel-esc">';
  [A,B].forEach(function(t){
    var on=(st.firstServeSide==="A"&&t.id===g.a)||(st.firstServeSide==="B"&&t.id===g.b);
    h+='<button class="'+(on?"on":"")+'" onclick="setFirstServe(\''+t.id+'\')">'+corHeart(esc(t.cor),'celh')+esc(t.n)+'</button>';
  });
  h+='</div>';

  var meuLado=coresLado(g,meuSide);
  h+='<div class="cel-tit" style="margin-top:4px">2 · De que lado a '+esc(meu.n)+' está?</div>';
  h+='<div class="cel-esc">';
  ["E","D"].forEach(function(l){
    h+='<button class="'+(meuLado===l?"on":"")+'" onclick="setLado(\''+l+'\')">'
      +'<span style="font-size:19px">'+coresLadoSeta(l)+'</span>'+coresLadoNome(l)+'</button>';
  });
  h+='</div>';

  h+='<div class="cel-tit" style="margin-top:4px">3 · Ordem de saque da '+esc(meu.n)+'</div>';
  h+='<div class="cel-slots">';
  for(var i=0;i<n;i++){
    var jid=SETUP[i], p=jid?pF(meu,jid):null;
    h+='<div class="cel-slot'+(p?" ok":"")+'"'+(p?' onclick="setupRemove('+i+')"':'')+'>';
    h+='<span>'+(i+1)+'</span>'+(p?'<b>'+esc(p.nm)+'</b>':'<span style="font-weight:600">livre</span>');
    h+='</div>';
  }
  h+='</div>';

  h+='<div class="cel-pool">';
  playersOf(meu).forEach(function(p){
    h+='<button onclick="setupPick(\''+p.id+'\')"'+(usados[p.id]?' disabled':'')+'>'+esc(p.nm)+'</button>';
  });
  if(!playersOf(meu).length)h+='<span style="color:var(--faint)">Nenhum atleta cadastrado nesta equipe.</span>';
  h+='</div>';

  h+='<div style="font-size:12.5px;color:var(--mute);line-height:1.5">Quem ficar na <b>posição 1</b> começa sacando; depois o rodízio anda sozinho. Toque numa posição preenchida para tirar.</div>';

  h+='<div style="margin-top:auto;display:grid;grid-template-columns:1fr auto;gap:7px;padding-top:8px">';
  h+='<button class="cel-x" style="background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-size:15px"'
    +(SETUP.length<n||!st.firstServeSide?' disabled':'')+' onclick="salvarEscalacao()">✓ Confirmar e começar</button>';
  h+='<button class="cel-x" onclick="celTrocarEquipe()">Trocar<br>equipe</button>';
  h+='</div></div>';
  return h;
}

/* --------- marcar --------- */
function celJogo(g,meu,adv,st,meuSide,A,B){
  var court=st.lineup[meuSide]||[];
  var bench=playersOf(meu).filter(function(p){return court.indexOf(p.id)<0;});
  var travado=st.done||g.st!=="ao_vivo";

  /* mesma regra da mesa: a cada rally novo a selecao volta para o sacador */
  if(_rallyVisto!==st.rally){ _rallyVisto=st.rally; if(!SUBPICK)SELP=null; }
  if(!SELP&&!SUBPICK&&st.serve&&st.serve.side===meuSide&&pF(meu,st.serve.jid))SELP=st.serve.jid;

  var h='';

  /* atletas em quadra */
  h+='<div class="cel-court'+((!SELP&&!SUBPICK&&!travado)?" pede":"")+'">';
  court.forEach(function(jid,ix){
    var p=pF(meu,jid);
    var saca=st.serve&&st.serve.side===meuSide&&st.serve.jid===jid;
    var on=SUBPICK?(SUBOUT===jid):(SELP===jid);
    var acao=SUBPICK?('pickOut(\''+jid+'\')'):('selP(\''+jid+'\')');
    h+='<button class="cel-p'+(on?" on":"")+(saca?" saca":"")+'" onclick="'+acao+'">';
    h+='<span class="pn">'+esc(p?p.nm:"—")+'</span>';
    h+='<span class="pp">'+(saca?"SACA":"SAQUE "+(ix+1))+'</span>';
    h+='</button>';
  });
  h+='</div>';

  /* Em quem a proxima acao vai cair. Sem esta linha, com a adversaria sacando a
     tela abria sem ninguem marcado e sem dizer o porque. */
  if(!travado&&!SUBPICK&&!SUBOUT){
    var selNm=SELP?pF(meu,SELP):null;
    h+='<div class="cel-quem'+(selNm?'':' pede')+'">'
      +(selNm?'<span class="lb">AÇÃO EM</span><b>'+esc(selNm.nm)+'</b>'
             :'<span class="seta">👆</span>Toque no atleta que fez a jogada')
      +'</div>';
  }

  if(SUBPICK&&!SUBOUT){
    h+=celAviso('Quem sai?','<div class="txt">Toque no atleta lá em cima.</div>'
      +'<button class="cel-x" onclick="cancelSub()">Cancelar</button>');
  }else if(SUBOUT){
    var outP=pF(meu,SUBOUT);
    var b='<div class="txt">Sai <b>'+esc(outP?outP.nm:"")+'</b>. Quem entra?</div><div class="cel-pool" style="justify-content:center">';
    if(!bench.length)b+='<span style="color:var(--faint)">Sem reservas nesta equipe.</span>';
    bench.forEach(function(p){ b+='<button onclick="fazerSub(\''+p.id+'\')">'+esc(p.nm)+'</button>'; });
    b+='</div><button class="cel-x" onclick="cancelSub()">Cancelar</button>';
    h+=celAviso('Substituição',b);
  }else if(st.done){
    var wt=st.winnerTid?tF(st.winnerTid):null;
    h+=celAviso('Set encerrado',
      '<div class="txt">'+(wt?esc(wt.n)+' venceu por ':'')+st.pts.A+' × '+st.pts.B+'. Confirme para entrar na classificação.</div>'
      +(g.st!=="finalizada"
        ? '<button class="cel-x" style="background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-size:15px;padding:0 18px" onclick="finalizarJogo()">✓ Finalizar jogo</button>'
        : (proximoSetHTML(g,'cel-x')||'<div class="txt"><b>Jogo finalizado.</b></div>'))
      +'<button class="cel-x" onclick="undoLast()">↩ Desfazer minha última</button>');
  }else if(g.st!=="ao_vivo"){
    h+=celAviso('Escalação pronta',
      '<div class="txt">Comece o jogo para liberar a marcação.</div>'
      +'<button class="cel-x" style="background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-size:15px;padding:0 18px" onclick="iniciarJogo()">▶ Iniciar jogo</button>');
  }else{
    /* DOIS TOQUES: o atleta la em cima e o botao da acao aqui. Fundamento e
       resultado no MESMO toque — num rally nao ha tempo para tres. Cada linha
       e um fundamento: rotulo colorido a esquerda, resultados a direita. */
    h+='<div class="cel-acoes'+(SELP?"":" semp")+'">';
    CORES_FUND.forEach(function(ak){
      var a=CORES_ACT[ak];
      h+='<div class="cel-lin">';
      h+='<div class="cel-fh" style="background:'+CORES_FCOL[ak]+'"><span class="ico">'+a.i+'</span>'+esc(a.l)+'</div>';
      h+='<div class="cel-ops n'+a.o.length+'">';
      a.o.forEach(function(oc){
        h+='<button class="cel-b" style="background:'+CORES_OC[oc]+'" onclick="mark(\''+ak+'\',\''+oc+'\')">'+oc+'</button>';
      });
      h+='</div></div>';
    });
    h+='</div>';

    /* as ultimas acoes so entram se sobrar tela — a grade vem primeiro */
    var evs=(st.events||[]).filter(function(e){return e.t==="act";}).slice(-3).reverse();
    if(evs.length){
      h+='<div class="cel-feed">';
      evs.forEach(function(e){
        var t=tF(e.tid), p=t?pF(t,e.jid):null;
        h+='<div class="cel-fi">'+corHeart(esc(t?t.cor:"#64748b"),'celp')
          +'<b>'+esc(p?p.nm:(t?t.n:"—"))+'</b><span>'+esc(CORES_ACT[e.ak]?CORES_ACT[e.ak].l:e.ak)+'</span>'
          +'<i style="background:'+(CORES_OC[e.oc]||"#556070")+'">'+esc(e.oc)+'</i></div>';
      });
      h+='</div>';
    }
  }
  /* faixa de baixo */
  h+='<div class="cel-bot">';
  h+='<button class="cel-x nos"'+(travado?" disabled":"")+' onclick="marcarPontoNos()">+ '+esc(meu.n)+'</button>';
  h+='<button class="cel-x adv"'+(travado?" disabled":"")+' onclick="marcarPontoAdv()">+ '+esc(adv.n)+'</button>';
  h+='<button class="cel-x falta"'+(travado?" disabled":"")+' onclick="marcarFalta()">⚠ Falta</button>';
  h+='<button class="cel-x undo" onclick="undoLast()" title="Desfazer minha última">↩</button>';
  h+='</div>';
  return h;
}

/* --------- painel de baixo --------- */
/* Zerar: o jogo volta a AGENDADO sem escalacao e sem ponto. Nasceu porque as
   equipes testam o app antes de comecar e nao havia como desfazer o teste
   sem apagar o jogo e refazer a tabela. */
function zerarJogo(gid){
  gid=gid||GID; var g=D.games[gid]; if(!g){toast("Jogo não encontrado","err");return;}
  var n=Object.keys(D.events[gid]||{}).length;
  var A=tF(g.a),B=tF(g.b), nome=(A?A.n:"?")+" × "+(B?B.n:"?");
  if(!confirm("Zerar "+nome+"?\n\nApaga "+n+" marcação(ões) — escalação, saque e todos os pontos — e o jogo volta a AGENDADO, como se não tivesse começado.\n\nNão dá para desfazer."))return;
  db.ref(ROOT+"/events/"+gid).remove().catch(function(){});
  writeNode("games/"+gid+"/st","agendada").then(function(){
    try{localStorage.removeItem("cores_tid_"+gid);}catch(e){}
    SELP=null;SETUP=null;SUBPICK=false;SUBOUT=null;ESCALACAO_ABERTA=false;
    _rallyVisto=-1;MEUTID=null;CELMENU=false;CELAK=null;
    toast("Jogo zerado — pode começar de novo","ok");render();
  });
}

    var a=tF(g.a),b=tF(g.b); if(!a||!b)return;
    h+='<button class="chip'+(REL_JOGO===g.id?" on":"")+'" onclick="relJogo(\''+g.id+'\')">'
      +esc(a.n)+' × '+esc(b.n)+'</button>';
  });
  h+='</div>';

  var R=coresRankings(gamesArr(),ts,D.events,D.config,{gameId:REL_JOGO||null});
  if(!R.temDado)return h+'<div class="empty">Nenhuma ação neste recorte.</div>';

  /* ---- maiores pontuadores ---- */
  h+='<h2 class="sec">MAIORES PONTUADORAS<span class="sec-sub">ace, ataque e bloqueio que fecharam o rally</span></h2>';
  if(!R.pontuadores.length)h+='<div class="card faint">Nenhum ponto de ataque, saque ou bloqueio ainda.</div>';
  else{
    h+='<div class="podio">';
    R.pontuadores.slice(0,3).forEach(function(x,i){
      h+='<div class="pod pod'+(i+1)+'" style="--c:'+esc(x.cor)+'">';
      h+='<div class="pod-pos">'+(i+1)+'º</div>';
      h+='<div class="pod-nm">'+esc(x.nm)+'</div>';
      h+='<div class="pod-eq">'+corHeart(esc(x.cor),'dot')+''+esc(x.equipe)+'</div>';
      h+='<div class="pod-pts">'+x.pontos+'</div><div class="pod-lb">PONTOS</div>';
      h+='<div class="pod-det">'+x.ace+' ace · '+x.ataque+' ataque · '+x.bloqueio+' bloqueio</div>';
      h+='</div>';
    });
    h+='</div>';
    if(R.pontuadores.length>3){
      h+='<div class="card"><div class="tscroll"><table class="tb"><thead><tr>'
        +'<th>#</th><th>ATLETA</th><th>EQUIPE</th><th>ACE</th><th>ATAQUE</th><th>BLOQ</th><th>PONTOS</th>'
        +'</tr></thead><tbody>';
      R.pontuadores.slice(3).forEach(function(x){
        h+='<tr><td class="faint">'+x.pos+'</td><td class="nm">'+esc(x.nm)+'</td>';
        h+='<td>'+corHeart(esc(x.cor),'dot')+' '+esc(x.equipe)+'</td>';
        h+='<td>'+x.ace+'</td><td>'+x.ataque+'</td><td>'+x.bloqueio+'</td>';
        h+='<td style="font-weight:800">'+x.pontos+'</td></tr>';
      });
      h+='</tbody></table></div></div>';
    }
  }

  /* ---- destaques: a lider de cada fundamento, sem precisar rolar ate o detalhe ---- */
  var lideres=[];
  CORES_FUND.forEach(function(ak){
    var F=R.fundamentos[ak];
    var l=F.ranking[0];
    if(l)lideres.push({ak:ak,F:F,x:l});
  });
  if(lideres.length){
    h+='<h2 class="sec">DESTAQUES<span class="sec-sub">a melhor de cada fundamento</span></h2>';
    h+='<div class="destgrid">';
    lideres.forEach(function(d){
      h+='<div class="dest" style="--f:'+CORES_FCOL[d.ak]+'">';
      h+='<div class="dest-fund"><span class="ico">'+d.F.icone+'</span>'+esc(d.F.label)+'</div>';
      h+='<div class="dest-nm">'+esc(d.x.nm)+'</div>';
      h+='<div class="dest-eq">'+corHeart(esc(d.x.cor),'dot')+''+esc(d.x.equipe)+'</div>';
      h+='<div class="dest-pct">'+d.x.pct+'<small>%</small></div>';
      h+='<div class="dest-lb">'+esc(d.F.rotulo)+' · '+(d.F.abc?(d.x.A+'A de '+d.x.n):(d.x.acertos+' de '+d.x.n))+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }

  /* ---- por fundamento ---- */
  h+='<h2 class="sec">RANKING POR FUNDAMENTO<span class="sec-sub">mínimo de '+R.minAcoes+' ações para entrar</span></h2>';
  h+='<div class="relgrid">';
  CORES_FUND.forEach(function(ak){
    var F=R.fundamentos[ak];
    h+='<div class="relcard"><div class="relcard-hd" style="background:'+CORES_FCOL[ak]+'"><span class="ico">'+F.icone+'</span>'+esc(F.label)
      +'<span class="relcard-met">'+esc(F.rotulo)+'</span></div><div class="relcard-bd">';
    if(!F.ranking.length&&F.poucos.length){
      /* Ninguem atingiu o minimo: em vez de card vazio, mostra o que ha com a
         ressalva — dado pouco e melhor que nada, desde que rotulado. */
      h+='<div class="amostra">amostra pequena (menos de '+R.minAcoes+' ações)</div>';
      F.poucos.slice(0,5).forEach(function(x){
        h+='<div class="relrow pouco"><span class="relpos">–</span>';
        h+=corHeart(esc(x.cor),'dot');
        h+='<span class="relnm">'+esc(x.nm)+'</span>';
        h+='<span class="relbar"></span>';
        h+='<b class="relpct">'+(F.abc?Math.round((x.A||0)*100/x.n):Math.round((x.acertos||0)*100/x.n))+'%</b>';
        h+='<span class="reldet">'+(F.abc?((x.A||0)+'A de '+x.n):((x.acertos||0)+' de '+x.n))+'</span></div>';
      });
    }else if(!F.ranking.length){
      h+='<div class="faint" style="font-size:12px">Sem ações marcadas.</div>';
    }else{
      F.ranking.slice(0,5).forEach(function(x,i){
        h+='<div class="relrow"><span class="relpos">'+(i+1)+'</span>';
        h+=corHeart(esc(x.cor),'dot');
        h+='<span class="relnm">'+esc(x.nm)+'</span>';
        h+='<span class="relbar"><i style="width:'+Math.max(2,x.pct)+'%;background:'+CORES_FCOL[ak]+'"></i></span>';
        h+='<b class="relpct">'+x.pct+'%</b>';
        h+='<span class="reldet">'+(F.abc?(x.A+'A de '+x.n):(x.acertos+' de '+x.n))+'</span>';
        h+='</div>';
      });
    }
    h+='</div></div>';
  });
  h+='</div>';

  /* ---- tabela geral ---- */
  h+='<h2 class="sec">TODAS AS ATLETAS</h2>';
  h+='<div class="card"><div class="tscroll"><table class="tb"><thead><tr>';
  h+='<th>ATLETA</th><th>EQUIPE</th><th>AÇÕES</th><th>PONTOS</th><th>ERROS</th>';
  CORES_FUND.forEach(function(ak){h+='<th>'+esc(CORES_ACT[ak].l.toUpperCase())+'</th>';});
  h+='</tr></thead><tbody>';
  R.geral.forEach(function(L){
    h+='<tr><td class="nm">'+esc(L.nm)+'</td>';
    h+='<td>'+corHeart(esc(L.cor),'dot')+' '+esc(L.equipe)+'</td>';
    h+='<td>'+L.acoes+'</td>';
    h+='<td style="color:var(--ok);font-weight:800">'+L.pontos+'</td>';
    h+='<td style="color:var(--bad)">'+L.erros+'</td>';
    CORES_FUND.forEach(function(ak){
      var f=L.porFund[ak];
      h+='<td class="'+(f.n?'':'faint')+'">'+(f.n||'–')+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="faint" style="font-size:11px;margin-top:12px;line-height:1.6">';
  h+='<b>Pontos</b> = ace + ataque que fechou + bloqueio que fechou (ponto vindo de erro do adversário não é creditado a ninguém).<br>';
  h+='<b>% A</b> na recepção, levantamento e defesa; no saque é % de ace, no ataque e no bloqueio é % de ponto.';
  h+='</div></div>';
  return h;
}
function relJogo(gid){REL_JOGO=gid||"";render();}

/* ---------------- TELAO ---------------- */
function rTelao(){
  var gs=coresOrderGames(gamesRes());
  var campT=coresCampeao(gamesArr(),D.events,D.teams,D.config);
  if(campT&&tF(campT)){
    var ct=tF(campT);
    return '<div class="tl"><div class="tl-hd"><div class="hd-ti" style="font-size:28px">'+esc(D.config.nome||CORES_NOME_PADRAO)+'</div>'
      +'<div class="hd-sub" style="margin-left:auto">RS-VOLEIBOL</div></div>'
      +'<div class="tl-main" style="flex-direction:column;gap:10px">'
      +corHeart(esc(ct.cor),'faixa campea-tl')
      +'<div class="hd-sub" style="font-size:13px;letter-spacing:6px">CAMPEÃ DO TORNEIO</div>'
      +'<div class="tl-nm" style="color:'+esc(ct.cor)+'">'+esc(ct.n)+'</div></div></div>';
  }
  var live=null;
  for(var i=0;i<gs.length;i++)if(gs[i].st==="ao_vivo"){live=gs[i];break;}
  if(!live)for(var j=0;j<gs.length;j++)if(gs[j].st!=="finalizada"){live=gs[j];break;}
  var h='<div class="tl">';
  h+='<div class="tl-hd"><div class="hd-ti" style="font-size:28px">'+esc(D.config.nome||CORES_NOME_PADRAO)+'</div>';
  h+='<div class="hd-sub" style="margin-left:auto">RS-VOLEIBOL</div></div>';
  if(!live){
    /* Intervalo entre jogos: em vez de uma tela vazia projetada no ginasio,
       mostra a classificacao — que e o que as pessoas querem ver mesmo. */
    var Sv=coresStandings(gamesArr(),teamsArr(),D.events,D.config);
    h+='<div class="tl-main" style="flex-direction:column;gap:14px">';
    h+='<div class="hd-sub" style="font-size:13px;letter-spacing:6px">CLASSIFICAÇÃO</div>';
    if(!Sv.length||!Sv.some(function(r){return r.j>0;})){
      h+='<div class="empty"><div class="big">EM BREVE</div></div>';
    }else{
      h+='<table class="tb" style="max-width:900px;width:100%"><tbody>';
      Sv.forEach(function(r){
        h+='<tr><td class="faint">'+r.pos+'</td><td class="nm"><span style="display:inline-flex;align-items:center;gap:12px">';
        h+=corHeart(esc(r.cor),'faixa')+esc(r.n)+'</span></td>';
        h+='<td>'+r.j+'J</td><td>'+r.v+'V</td><td class="faint">'+r.d+'D</td>';
        h+='<td>'+(r.saldo>0?"+":"")+r.saldo+'</td>';
        h+='<td style="font-weight:800">'+r.pts+'</td></tr>';
      });
      h+='</tbody></table>';
    }
    h+='</div></div>';
    return h;
  }
  var A=tF(live.a),B=tF(live.b);
  if(!A||!B){h+='<div class="tl-main"><div class="empty">equipes não encontradas</div></div></div>';return h;}
  var st=calc(live);
  h+='<div class="tl-main">';
  /* Se o lado esta definido, o telao mostra as equipes na MESMA ordem em que
     quem esta no ginasio as ve. Sem isso o placar fica espelhado. */
  var duo=[{t:A,s:"A"},{t:B,s:"B"}];
  if(coresLado(live,"A")==="D")duo.reverse();
  duo.forEach(function(x,ix){
    if(ix===1)h+='<div class="tl-x">×</div>';
    var serving=st.serve&&st.serve.side===x.s;
    h+='<div class="tl-team">';
    h+=corHeart(esc(x.t.cor),'faixa telao');
    h+='<div class="tl-nm">'+esc(x.t.n)+(serving?' <span style="font-size:.5em">🏐</span>':'')+'</div>';
    /* SEM color inline: estilo inline vence o @supports que ajusta a cor da
       equipe ao tema, e o placar do PRETO sumia no escuro / do BRANCO no claro.
       Passa so o --c; quem pinta e o CSS. */
    h+='<div class="tl-pt" style="--c:'+esc(x.t.cor)+'">'+st.pts[x.s]+'</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="tl-bot">';
  /* classificacao resumida */
  var S=coresStandings(gamesArr(),teamsArr(),D.events,D.config);
  h+='<div><div class="hd-sub" style="margin-bottom:8px">CLASSIFICAÇÃO</div><table class="tb"><tbody>';
  S.slice(0,6).forEach(function(r){
    h+='<tr><td class="faint">'+r.pos+'</td><td class="nm"><span style="display:inline-flex;align-items:center;gap:8px">';
    h+=corHeart(esc(r.cor),'dot')+esc(r.n)+'</span></td>';
    h+='<td>'+r.v+'V</td><td class="faint">'+(r.saldo>0?"+":"")+r.saldo+'</td>';
    h+='<td style="font-weight:800">'+r.pts+'</td></tr>';
  });
  h+='</tbody></table></div>';
  /* proximos */
  var prox=gs.filter(function(g){return g.st!=="finalizada"&&g.id!==live.id;}).slice(0,4);
  h+='<div><div class="hd-sub" style="margin-bottom:8px">PRÓXIMOS JOGOS</div>';
  if(!prox.length)h+='<div class="faint">—</div>';
  prox.forEach(function(g){
    var a=tF(g.a),b=tF(g.b);if(!a||!b)return;
    h+='<div style="display:flex;align-items:center;gap:9px;padding:5px 0;font-weight:700">';
    h+=corHeart(esc(a.cor),'dot')+esc(a.n);
    h+='<span class="faint">×</span>'+corHeart(esc(b.cor),'dot')+''+esc(b.n);
    if(coresRotulo(g))h+='<span class="rot">'+esc(coresRotulo(g))+'</span>';
    h+='<span class="faint" style="margin-left:auto;font-size:11px">'+(g.tm||fD(g.dt))+'</span></div>';
  });
  h+='</div></div></div>';
  return h;
}

/* ---------------- ADMIN ---------------- */
function rAdmin(){
  var cfg=coresCfg(D.config);
  var ts=teamsArr();
  var h='<h2 class="sec">CONFIGURAÇÃO</h2><div class="card"><div class="row">';
  h+='<div class="fld" style="flex:2"><span>NOME DO TORNEIO</span><input id="cf-n" value="'+esc(D.config.nome||CORES_NOME_PADRAO)+'"></div>';
  h+='<div class="fld"><span>SET ATÉ</span><input id="cf-sp" type="number" value="'+cfg.setPoints+'"></div>';
  h+='<div class="fld"><span>VANTAGEM</span><input id="cf-va" type="number" value="'+cfg.vantagem+'"></div>';
  h+='<div class="fld"><span>EM QUADRA</span><input id="cf-eq" type="number" value="'+cfg.emQuadra+'"></div>';
  h+='<div class="fld"><span>PTS VITÓRIA</span><input id="cf-pv" type="number" value="'+cfg.ptsVitoria+'"></div>';
  h+='<div class="fld"><span>PTS DERROTA</span><input id="cf-pd" type="number" value="'+cfg.ptsDerrota+'"></div>';
  h+='<div class="fld"><span>JANELA ANTI-DUPLO (s)</span><input id="cf-dd" type="number" step="0.5" value="'+(cfg.dedupeMs/1000)+'" title="Segundos em que a mesma jogada marcada pelos 2 operadores conta 1 ponto só"></div>';
  h+='<button class="btn pri" style="align-self:flex-end" onclick="salvarConfig()">Salvar</button>';
  h+='</div></div>';

  /* equipes */

  h+='<div class="fld" style="flex:2"><span>NOME DA EQUIPE</span><input id="nt-n" placeholder="AZUL"></div>';
  h+='<div class="fld"><span>COR</span><input id="nt-c" type="color" value="#2563eb"></div>';
  h+='<button class="btn pri" style="align-self:flex-end" onclick="novaEquipe()">+ Criar equipe</button>';

    h+='<div class="card" style="border-left:4px solid '+esc(t.cor)+'">';
    h+='<div class="row" style="margin-bottom:10px">';
    h+=corHeart(esc(t.cor),'faixa');
    h+='<div class="fld" style="flex:1"><span>NOME</span><input value="'+esc(t.n)+'" onchange="editEquipe(\''+t.id+'\',\'n\',this.value)"></div>';
    h+='<div class="fld"><span>COR</span><input type="color" value="'+esc(t.cor)+'" onchange="editEquipe(\''+t.id+'\',\'cor\',this.value)"></div>';
    h+='<button class="btn dgr sm" style="align-self:flex-end" onclick="delEquipe(\''+t.id+'\')">Excluir</button>';
    h+='</div>';
    var ps=playersOf(t);
    h+='<div class="faint" style="font-size:10px;font-weight:800;letter-spacing:1.2px;margin-bottom:7px">ATLETAS — a ordem da lista É a ordem de saque (os '+cfg.emQuadra+' primeiros entram em quadra)</div>';
    if(!ps.length)h+='<div class="faint" style="margin-bottom:8px">nenhum atleta</div>';
    ps.forEach(function(p,ix){
      h+='<div class="row" style="margin-bottom:6px;flex-wrap:nowrap">';
      h+='<span class="tag" style="min-width:64px;justify-content:center">'+(ix<cfg.emQuadra?"QUADRA":"RESERVA")+'</span>';
      h+='<input style="width:64px;background:rgba(0,0,0,.28);border:1px solid var(--brd);border-radius:9px;padding:8px" placeholder="nº" value="'+esc(p.nu==null?"":p.nu)+'" onchange="editPlayer(\''+t.id+'\',\''+p.id+'\',\'nu\',this.value)">';
      h+='<input style="flex:1;background:rgba(0,0,0,.28);border:1px solid var(--brd);border-radius:9px;padding:8px" value="'+esc(p.nm)+'" onchange="editPlayer(\''+t.id+'\',\''+p.id+'\',\'nm\',this.value)">';
      h+='<button class="btn sm" onclick="movePlayer(\''+t.id+'\',\''+p.id+'\',-1)" title="subir">↑</button>';
      h+='<button class="btn sm" onclick="movePlayer(\''+t.id+'\',\''+p.id+'\',1)" title="descer">↓</button>';
      h+='<button class="btn dgr sm" onclick="delPlayer(\''+t.id+'\',\''+p.id+'\')">×</button>';
      h+='</div>';
    });
    h+='<div class="row" style="margin-top:9px">';
    h+='<input id="np-'+t.id+'" placeholder="nome do atleta" style="flex:1;background:rgba(0,0,0,.28);border:1px solid var(--brd);border-radius:9px;padding:9px" onkeydown="if(event.key===\'Enter\')addPlayer(\''+t.id+'\')">';
    h+='<button class="btn" onclick="addPlayer(\''+t.id+'\')">+ Atleta</button></div>';
    h+='</div>';
  });

  h+=rAdminTabela(ts);
  h+=rAdminVolta(ts);

  /* jogos */
  h+='<h2 class="sec">JOGOS</h2>';
  if(ts.length<2)h+='<div class="banner inf">Crie pelo menos 2 equipes para montar jogos.</div>';
  else{
    var opt=function(sel){var s="";ts.forEach(function(t){s+='<option value="'+t.id+'"'+(sel===t.id?" selected":"")+'>'+esc(t.n)+'</option>';});return s;};
    h+='<div class="card"><div class="row">';
    h+='<div class="fld" style="flex:1"><span>EQUIPE A</span><select id="ng-a">'+opt(ts[0].id)+'</select></div>';
    h+='<div class="fld" style="flex:1"><span>EQUIPE B</span><select id="ng-b">'+opt(ts[1].id)+'</select></div>';
    h+='<div class="fld"><span>DATA</span><input id="ng-dt" type="date" value="'+(new Date().toISOString().slice(0,10))+'"></div>';
    h+='<div class="fld"><span>HORÁRIO</span><input id="ng-tm" type="time"></div>';
    h+='<button class="btn pri" style="align-self:flex-end" onclick="novoJogo()">+ Criar jogo</button>';
    h+='</div></div>';
  }
  var gs=coresOrderGames(gamesRes());
  gs.forEach(function(g){
    var a=tF(g.a),b=tF(g.b);
    var nomeA=a?a.n:coresLadoLabel(g,"A",D.teams), nomeB=b?b.n:coresLadoLabel(g,"B",D.teams);
    var st=calc(g);
    h+='<div class="gcard"><div class="gc-vs">';
    if(coresFase(g)!=="class")h+='<span class="fasetag">'+esc(CORES_FASES[coresFase(g)].l)+'</span>';
    if(coresRotulo(g))h+='<span class="rot">'+esc(coresRotulo(g))+'</span>';
    h+=''+corHeart(esc(a?a.cor:"#334155"),'dot')+'<b'+(a?'':' class="pend"')+'>'+esc(nomeA)+'</b>';
    h+='<span class="faint">×</span>'+corHeart(esc(b?b.cor:"#334155"),'dot')+'<b'+(b?'':' class="pend"')+'>'+esc(nomeB)+'</b>';
    h+='</div><div class="gc-sc">'+st.pts.A+'-'+st.pts.B+'</div>';
    h+='<div class="gc-meta" style="min-width:110px">'+(g.dt?fD(g.dt):"")+(g.tm?" "+esc(g.tm):"")+'</div>';
    h+='<span class="pill '+(g.st==="ao_vivo"?"live":(g.st==="finalizada"?"fim":"age"))+'">'+(g.st==="ao_vivo"?"AO VIVO":(g.st==="finalizada"?"FIM":"AGENDADO"))+'</span>';
    if(a&&b)h+='<button class="btn sm" onclick="go(\'mesa\',\'&g='+g.id+'\')">Mesa</button>';
    if(g.st!=="agendada"||(D.events[g.id]&&Object.keys(D.events[g.id]).length))
      h+='<button class="btn sm" onclick="zerarJogo(\''+g.id+'\')" title="Volta o jogo a agendado, sem escalação e sem ponto">↺ Zerar</button>';
    h+='<button class="btn dgr sm" onclick="delJogo(\''+g.id+'\')">Excluir</button>';
    h+='</div>';
  });
  h+=rAdminFaseFinal();
  h+='<div class="faint" style="font-size:11px;margin-top:22px;line-height:1.6">Módulo isolado do RS-Scout · dados em <code>/torneio-cores</code> · build '+CORES_BUILD+'</div>';
  return h;
}
/* FASE FINAL — o formato e escolhido na hora, com a classificacao na tela.
   Nada e decidido antes: da para gerar, apagar e gerar de novo. */
function rAdminFaseFinal(){
  var ts=teamsArr();
  if(ts.length<2)return "";
  var todos=gamesArr();
  var classif=todos.filter(function(g){return coresFase(g)==="class";});
  if(!classif.length)return "";
  var mata=todos.filter(function(g){return coresFase(g)!=="class";});
  var pendentes=classif.filter(function(g){return g.st!=="finalizada"&&!calc(g).done;});
  var S=coresStandings(todos,ts,D.events,D.config);
  var comJogo=S.filter(function(r){return r.j>0;});

  var h='<h2 class="sec">FASE FINAL<span class="sec-sub">depois da classificatória</span></h2>';

  if(mata.length){
    h+='<div class="card"><div class="row" style="align-items:flex-start">';
    h+='<div style="flex:1;min-width:220px"><b>Fase final já criada</b><div class="faint" style="font-size:12px;margin-top:6px;line-height:1.6">';
    var vistos={};
    mata.forEach(function(g){
      var k=g.conf||g.id; if(vistos[k])return; vistos[k]=1;
      var gr=gRes(g.id)||g;
      h+='· '+esc(CORES_FASES[coresFase(g)].l)+': '+esc(coresLadoLabel(gr,"A",D.teams))+' × '+esc(coresLadoLabel(gr,"B",D.teams))
        +(g.sets>1?' <span class="faint">(melhor de '+g.sets+')</span>':'')+'<br>';
    });
    h+='</div></div>';
    h+='<button class="btn dgr" onclick="apagarFaseFinal()">Apagar e refazer</button>';
    h+='</div></div>';
    return h;
  }

  h+='<div class="card">';
  if(pendentes.length){
    h+='<div class="banner err" style="margin:0 0 14px"><b>Ainda faltam '+pendentes.length+' jogo(s) da classificatória.</b> ';
    h+='Dá para gerar assim mesmo, mas o chaveamento sai pela classificação de agora — o certo é gerar depois que todos terminarem.</div>';
  }
  h+='<div class="faint" style="font-size:11px;font-weight:800;letter-spacing:1.2px;margin-bottom:8px">CLASSIFICAÇÃO DE AGORA</div>';
  h+='<div class="pool" style="margin-bottom:14px">';
  S.forEach(function(r,i){
    h+='<span class="poolp" style="cursor:default"><span class="poolp-nu" style="background:'+esc(r.cor)+';--c:'+esc(r.cor)+'">'+(i+1)+'</span>'+esc(r.n)+' <span class="faint">'+r.pts+' pts</span></span>';
  });
  h+='</div>';

  if(comJogo.length<2){
    h+='<div class="faint">Nenhum jogo encerrado ainda — a classificação precisa de resultados para montar o chaveamento.</div></div>';
    return h;
  }
  h+='<div class="faint" style="font-size:11px;font-weight:800;letter-spacing:1.2px;margin-bottom:8px">COMO VAI SER?</div>';
  h+='<div class="fasegrid">';
  h+='<button class="faseopt" onclick="gerarFaseFinal(\'final\',false)">'
    +'<b>Final direta</b><span>1º × 2º · melhor de 3 sets</span>'
    +'<i>'+esc(S[0]?S[0].n:"1º")+' × '+esc(S[1]?S[1].n:"2º")+'</i></button>';
  var pode4=(ts.length>=4&&S.length>=4&&comJogo.length>=4);
  h+='<button class="faseopt'+(pode4?"":" off")+'"'+(pode4?' onclick="gerarFaseFinal(\'semi\',false)"':' disabled')+'>'
    +'<b>Semifinais + final</b><span>1º×4º e 2º×3º · melhor de 3</span>'
    +'<i>'+(pode4?esc(S[0].n)+' × '+esc(S[3].n)+' · '+esc(S[1].n)+' × '+esc(S[2].n):"precisa de 4 equipes com jogo")+'</i></button>';
  h+='<button class="faseopt'+(pode4?"":" off")+'"'+(pode4?' onclick="gerarFaseFinal(\'semi\',true)"':' disabled')+'>'
    +'<b>Semifinais + 3º lugar + final</b><span>com disputa de terceiro · melhor de 3</span>'
    +'<i>'+(pode4?"4 jogos":"precisa de 4 equipes com jogo")+'</i></button>';
  h+='</div>';
  h+='<div class="faint" style="font-size:11px;margin-top:12px;line-height:1.6">A final nasce como “vencedor da semifinal 1 × vencedor da semifinal 2” e as equipes entram sozinhas quando as semis terminarem. Jogos de fase final <b>não</b> entram na tabela de classificação.</div>';
  h+='</div>';
  return h;
}
function gerarFaseFinal(modo,com3o){
  var ts=teamsArr();
  var S=coresStandings(gamesArr(),ts,D.events,D.config);
  var hoje=(new Date()).toISOString().slice(0,10);
  var jogos=coresBracket(S,modo,com3o,{dt:hoje,prefixo:"f_"+Date.now().toString(36)});
  if(!jogos.length){toast("Não deu para montar — faltam equipes classificadas","err");return;}
  var confs={}; jogos.forEach(function(g){confs[g.conf||g.id]=CORES_FASES[g.fase].l;});
  var nomes=Object.keys(confs).map(function(k){return confs[k];}).join(", ");
  var bo=(jogos[0]&&jogos[0].sets>1)?" em melhor de "+jogos[0].sets+" sets":"";
  if(!confirm("Criar "+Object.keys(confs).length+" confronto(s)"+bo+": "+nomes+"?\n\n"
    +jogos.length+" jogos no total — um por set. O terceiro só é jogado se ficar 1 a 1."))return;
  var falta=jogos.length;
  jogos.forEach(function(g){
    writeNode("games/"+g.id,g).then(function(){
      falta--; if(falta===0)toast("Fase final criada","ok");
    });
  });
}
function apagarFaseFinal(){
  var mata=gamesArr().filter(function(g){return coresFase(g)!=="class";});
  if(!mata.length)return;
  if(!confirm("Apagar os "+mata.length+" jogo(s) da fase final e tudo que foi marcado neles?"))return;
  mata.forEach(function(g){
    db.ref(ROOT+"/events/"+g.id).remove().catch(function(){});
    db.ref(ROOT+"/games/"+g.id).remove().catch(onWriteErr);
  });
  toast("Fase final apagada","ok");
}
function val(id){var e=document.getElementById(id);return e?e.value:"";}
function salvarConfig(){
  var c={nome:val("cf-n"),setPoints:+val("cf-sp")||21,vantagem:+val("cf-va"),
    emQuadra:+val("cf-eq")||4,ptsVitoria:+val("cf-pv"),ptsDerrota:+val("cf-pd"),
    dedupeMs:Math.round((parseFloat(val("cf-dd"))||0)*1000)};
  if(isNaN(c.vantagem))c.vantagem=2;
  writeNode("config",c).then(function(){toast("Configuração salva","ok");});
}
function novaEquipe(){
  var n=(val("nt-n")||"").trim(),c=val("nt-c")||"#2563eb";
  if(!n){toast("Informe o nome da equipe","err");return;}
  var id=uid("c_");
  writeNode("teams/"+id,{id:id,n:n.toUpperCase(),cor:c,ordem:teamsArr().length,players:[]})
    .then(function(){toast("Equipe criada","ok");var e=document.getElementById("nt-n");if(e)e.value="";});
}
function editEquipe(tid,campo,v){
  var t=tF(tid);if(!t)return;
  writeNode("teams/"+tid+"/"+campo,campo==="n"?String(v).toUpperCase():v);
}
function delEquipe(tid){
  var t=tF(tid);if(!t)return;
  var usada=gamesArr().some(function(g){return g.a===tid||g.b===tid;});
  if(usada){toast("Equipe está em um jogo — exclua o jogo antes","err");return;}
  if(!confirm("Excluir a equipe "+t.n+"?"))return;
  db.ref(ROOT+"/teams/"+tid).remove().catch(onWriteErr);
}
function addPlayer(tid){
  var t=tF(tid);if(!t)return;
  var el=document.getElementById("np-"+tid);
  var nm=(el&&el.value||"").trim();
  if(!nm){toast("Informe o nome","err");return;}
  var ps=playersOf(t).slice();
  ps.push({id:uid("p_"),nm:nm.toUpperCase(),nu:""});
  writeNode("teams/"+tid+"/players",ps).then(function(){if(el)el.value="";});
}
function editPlayer(tid,jid,campo,v){
  var t=tF(tid);if(!t)return;
  var ps=playersOf(t).slice();
  for(var i=0;i<ps.length;i++)if(ps[i].id===jid)ps[i][campo]=(campo==="nm"?String(v).toUpperCase():v);
  writeNode("teams/"+tid+"/players",ps);
}
function movePlayer(tid,jid,dir){
  var t=tF(tid);if(!t)return;
  var ps=playersOf(t).slice();
  var i=-1;for(var k=0;k<ps.length;k++)if(ps[k].id===jid){i=k;break;}
  var j=i+dir;
  if(i<0||j<0||j>=ps.length)return;
  var tmp=ps[i];ps[i]=ps[j];ps[j]=tmp;
  writeNode("teams/"+tid+"/players",ps);
}
function delPlayer(tid,jid){
  var t=tF(tid);if(!t)return;
  var ps=playersOf(t).filter(function(p){return p.id!==jid;});
  writeNode("teams/"+tid+"/players",ps);
}
/* ---------------- MOTOR DE TABELA (admin) ----------------
   Gera a classificatoria inteira de uma vez, todos contra todos. Sem horario:
   o horario e definido na hora, conforme quem ja chegou — por isso a tabela sai
   em RODADAS, e dentro da rodada ninguem joga dois jogos seguidos. */
var TABTURNOS=1, TABDT=null;
function setTab(campo,v){ if(campo==="tn")TABTURNOS=(+v===2?2:1); else TABDT=v; render(); }
function _tabClassGames(){ return gamesArr().filter(function(g){return coresFase(g)==="class";}); }
function _tabPular(gs){ return gs.map(function(g){return [g.a,g.b];}); }
function _tabTemPar(gs,a,b){
  for(var i=0;i<gs.length;i++){ if((gs[i].a===a&&gs[i].b===b)||(gs[i].a===b&&gs[i].b===a))return true; }
  return false;
}
function _tabApagaveis(gs){
  return gs.filter(function(g){
    return g.st!=="finalizada" && g.st!=="ao_vivo" && !(D.events&&D.events[g.id]);
  });
}

function rAdminTabela(ts){
  if(ts.length<2)return "";
  if(TABDT===null)TABDT=(new Date()).toISOString().slice(0,10);
  var jaGs=_tabClassGames();
  var cheia=coresTabela(ts,{turnos:TABTURNOS,prefixo:"p"});
  var novos=coresTabela(ts,{turnos:TABTURNOS,prefixo:"p",pular:_tabPular(jaGs)});
  var folgas=coresFolgas(ts,cheia);
  var nrod=cheia.length?cheia[cheia.length-1].rodada:0;
  var porEq=(ts.length-1)*TABTURNOS;

  var h='<h2 class="sec">TABELA<span class="sec-sub">todos contra todos</span></h2>';
  h+='<div class="card">';
  h+='<div class="row" style="align-items:flex-end">';
  h+='<div class="fld" style="flex:1;min-width:230px"><span>FORMATO</span><select onchange="setTab(\'tn\',this.value)">'
    +'<option value="1"'+(TABTURNOS===1?" selected":"")+'>1 turno — cada dupla joga uma vez</option>'
    +'<option value="2"'+(TABTURNOS===2?" selected":"")+'>2 turnos — ida e volta</option></select></div>';
  h+='<div class="fld"><span>DATA</span><input type="date" value="'+esc(TABDT)+'" onchange="setTab(\'dt\',this.value)"></div>';
  h+='<button class="btn pri" style="align-self:flex-end"'+(novos.length?' onclick="gerarTabela()"':' disabled')+'>'
    +(novos.length?'Gerar tabela — '+novos.length+' jogo'+(novos.length===1?'':'s'):'Tudo já criado')+'</button>';
  if(_tabApagaveis(jaGs).length)
    h+='<button class="btn dgr" style="align-self:flex-end" onclick="apagarTabela()">Apagar e refazer</button>';
  h+='</div>';

  h+='<div class="tabres"><b>'+cheia.length+'</b> jogo'+(cheia.length===1?'':'s')+' na classificatória · '
    +nrod+' rodada'+(nrod===1?'':'s')+' · '+porEq+' jogo'+(porEq===1?'':'s')+' por equipe · sem horário definido</div>';

  if(jaGs.length){
    var repetidos=cheia.length-novos.length;
    h+='<div class="banner inf">Já existem <b>'+jaGs.length+'</b> jogo(s) da classificatória. '
      +(repetidos? 'Os '+repetidos+' confronto(s) que já estão criados são pulados' : 'Nenhum deles bate com a tabela abaixo')
      +' — nada do que já foi marcado se perde.</div>';
  }

  h+='<div class="tabprev">';
  var rAtual=-1;
  cheia.forEach(function(g){
    if(g.rodada!==rAtual){
      rAtual=g.rodada;
      var f=null; for(var k=0;k<folgas.length;k++)if(folgas[k].rodada===rAtual)f=folgas[k];
      h+='<div class="tabrod">RODADA '+rAtual+(TABTURNOS===2?' <span class="faint">· '+(g.turno===1?'ida':'volta')+'</span>':'')
        +(f&&f.folga.length?' <span class="faint">· folga: '+f.folga.map(function(t){return esc(t.n);}).join(", ")+'</span>':'')+'</div>';
    }
    var a=tF(g.a),b=tF(g.b);
    var existe=_tabTemPar(jaGs,g.a,g.b);
    h+='<div class="tabjg'+(existe?" ja":"")+'">';
    h+=''+corHeart(esc(a?a.cor:"#64748b"),'dot')+'<b>'+esc(a?a.n:"?")+'</b>';
    h+='<span class="faint">×</span>';
    h+=''+corHeart(esc(b?b.cor:"#64748b"),'dot')+'<b>'+esc(b?b.n:"?")+'</b>';
    if(existe)h+='<span class="tabja">já criado</span>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="faint" style="font-size:11px;margin-top:12px;line-height:1.6">A rodada é só a ordem sugerida: dá para puxar qualquer jogo para frente se uma equipe não estiver completa. O horário fica em branco e pode ser preenchido jogo a jogo.</div>';
  h+='</div>';
  return h;
}

/* ---- VOLTA (returno) ----
   Aparece quando a ida ja existe. Cada SET vira um jogo do app: e assim que
   "cada set conta como uma vitoria" sai de graca na classificacao, sem mexer
   no motor de placar. */
var VOLTASETS=2;
function setVoltaSets(v){ VOLTASETS=(+v===1?1:2); render(); }

function rAdminVolta(ts){
  if(ts.length<2)return "";
  var todos=gamesArr().filter(function(g){return coresFase(g)==="class";});
  var ida=todos.filter(function(g){return (g.turno||1)===1;});
  if(ida.length<2)return "";
  var volta=coresTabela(ts,{turnos:2,soTurno:2,sets:VOLTASETS,dt:(new Date()).toISOString().slice(0,10),prefixo:"p",pular:todos});
  var jaVolta=todos.filter(function(g){return g.turno===2;}).length;
  var porEq=(ts.length-1)*VOLTASETS;

  var h='<h2 class="sec">VOLTA<span class="sec-sub">os mesmos confrontos, mando invertido</span></h2>';
  h+='<div class="card">';
  h+='<div class="row" style="align-items:flex-end">';
  h+='<div class="fld" style="flex:1;min-width:220px"><span>SETS POR CONFRONTO</span><select onchange="setVoltaSets(this.value)">'
    +'<option value="1"'+(VOLTASETS===1?" selected":"")+'>1 set — como foi a ida</option>'
    +'<option value="2"'+(VOLTASETS===2?" selected":"")+'>2 sets obrigatórios — cada set vale um resultado</option></select></div>';
  h+='<button class="btn pri" style="align-self:flex-end"'+(volta.length?' onclick="gerarVolta()"':' disabled')+'>'
    +(volta.length?'Gerar a volta — '+volta.length+' jogo'+(volta.length===1?'':'s'):'Volta já criada')+'</button>';
  h+='</div>';

  h+='<div class="tabres"><b>'+volta.length+'</b> jogo'+(volta.length===1?'':'s')+' a criar · '
    +porEq+' por equipe · a ida continua valendo, a classificação só soma</div>';
  if(jaVolta)h+='<div class="banner inf">Já existem <b>'+jaVolta+'</b> jogo(s) da volta — os que já estão criados são pulados.</div>';
  if(VOLTASETS===2)h+='<div class="banner inf">Com 2 sets, <b>cada set é um jogo</b> na tabela: quem vencer os dois soma '
    +(2*coresCfg(D.config).ptsVitoria)+' pontos; 1 a 1 dá '+(coresCfg(D.config).ptsVitoria+coresCfg(D.config).ptsDerrota)+' para cada.</div>';

  if(volta.length){
    h+='<div class="tabprev">';
    var rAtual=-1;
    volta.forEach(function(g){
      if(g.rodada!==rAtual){rAtual=g.rodada;h+='<div class="tabrod">RODADA '+rAtual+'</div>';}
      var a=tF(g.a),b=tF(g.b);
      h+='<div class="tabjg">'+corHeart(esc(a?a.cor:"#64748b"),'dot')+'<b>'+esc(a?a.n:"?")+'</b>'
        +'<span class="faint">×</span>'+corHeart(esc(b?b.cor:"#64748b"),'dot')+'<b>'+esc(b?b.n:"?")+'</b>'
        +'<span class="tabja">'+esc(coresRotulo(g))+'</span></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function gerarVolta(){
  var ts=teamsArr();
  var todos=gamesArr().filter(function(g){return coresFase(g)==="class";});
  var jogos=coresTabela(ts,{turnos:2,soTurno:2,sets:VOLTASETS,
    dt:(new Date()).toISOString().slice(0,10),prefixo:"v"+Date.now().toString(36),pular:todos});
  if(!jogos.length){toast("A volta já está criada","err");return;}
  if(!confirm("Criar "+jogos.length+" jogo(s) da volta?\n\nSão os mesmos confrontos da ida com o mando invertido"
    +(VOLTASETS===2?", em 2 sets — e cada set conta sozinho na classificação":"")
    +".\n\nNada da ida é apagado."))return;
  var falta=jogos.length;
  jogos.forEach(function(g){
    writeNode("games/"+g.id,g).then(function(){
      falta--; if(falta===0)toast(jogos.length+" jogos da volta criados","ok");
    });
  });
}

function gerarTabela(){
  var ts=teamsArr();
  if(ts.length<2){toast("Crie pelo menos 2 equipes","err");return;}
  var jaGs=_tabClassGames();
  var jogos=coresTabela(ts,{turnos:TABTURNOS,dt:TABDT||"",
    prefixo:"t"+Date.now().toString(36),pular:_tabPular(jaGs)});
  if(!jogos.length){toast("Todos os confrontos já estão criados","err");return;}
  if(!confirm("Criar "+jogos.length+" jogo(s) da classificatória?"
    +(jaGs.length?" Os "+jaGs.length+" jogo(s) que já existem continuam como estão.":"")))return;
  var falta=jogos.length;
  jogos.forEach(function(g){
    writeNode("games/"+g.id,g).then(function(){
      falta--; if(falta===0)toast(jogos.length+" jogos criados","ok");
    });
  });
}

function apagarTabela(){
  var jaGs=_tabClassGames();
  var podem=_tabApagaveis(jaGs);
  var ficam=jaGs.length-podem.length;
  if(!podem.length){toast("Nenhum jogo pode ser apagado — todos já têm dados","err");return;}
  if(!confirm("Apagar "+podem.length+" jogo(s) agendado(s) da classificatória?"
    +(ficam?" Os "+ficam+" que já têm dados ficam.":"")))return;
  podem.forEach(function(g){ db.ref(ROOT+"/games/"+g.id).remove().catch(onWriteErr); });
  toast(podem.length+" jogo(s) apagado(s)","ok");
}

function novoJogo(){
  var a=val("ng-a"),b=val("ng-b");
  if(!a||!b||a===b){toast("Escolha duas equipes diferentes","err");return;}
  var id=uid("j_");
  writeNode("games/"+id,{id:id,a:a,b:b,dt:val("ng-dt")||"",tm:val("ng-tm")||"",st:"agendada"})
    .then(function(){toast("Jogo criado","ok");});
}
function delJogo(gid){
  if(!confirm("Excluir o jogo e todas as ações marcadas nele?"))return;
  db.ref(ROOT+"/events/"+gid).remove().catch(function(){});
  db.ref(ROOT+"/games/"+gid).remove().catch(onWriteErr);
}

/* ---------- start ---------- */
render();
boot();
setInterval(function(){if(VIEW==="telao")render();},5000);
</script>
</body>
