/* ---------------- TELAO ---------------- */
function rTelao(){
  var gs=coresOrderGames(gamesRes());
  var campT=coresCampeao(gamesArr(),D.events,D.teams,D.config);
  if(campT&&tF(campT)){
    var ct=tF(campT);
    return '<div class="tl"><div class="tl-hd"><div class="hd-ti" style="font-size:28px">'+esc(D.config.nome||CORES_NOME_PADRAO)+'</div>'
      +'<div class="hd-sub" style="margin-left:auto">RS-VOLEIBOL</div></div>'
      +'<div class="tl-main" style="flex-direction:column;gap:10px">'
      +'<div class="crest xl" style="background:'+esc(ct.cor)+';--c:'+esc(ct.cor)+';width:170px;height:170px;font-size:74px;border-radius:34px">'+esc(initials(ct.n))+'</div>'
      +'<div class="hd-sub" style="font-size:13px;letter-spacing:6px">CAMPEÃ DO TORNEIO</div>'
      +'<div class="tl-nm" style="color:'+esc(ct.cor)+'">'+esc(ct.n)+'</div></div></div>';
  }
  var live=null;
  for(var i=0;i<gs.length;i++)if(gs[i].st==="ao_vivo"){live=gs[i];break;}
  if(!live)for(var j=0;j<gs.length;j++)if(gs[j].st!=="finalizada"){live=gs[j];break;}
  var h='<div class="tl">';
  h+='<div class="tl-hd"><div class="hd-ti" style="font-size:28px">'+esc(D.config.nome||CORES_NOME_PADRAO)+'</div>';
  h+='<div class="hd-sub" style="margin-left:auto">RS-VOLEIBOL</div></div>';
  if(!live){
    h+='<div class="tl-main"><div class="empty"><div class="big">SEM JOGO EM ANDAMENTO</div></div></div></div>';
    return h;
  }
  var A=tF(live.a),B=tF(live.b);
  if(!A||!B){h+='<div class="tl-main"><div class="empty">equipes não encontradas</div></div></div>';return h;}
  var st=calc(live);
  h+='<div class="tl-main">';
  [{t:A,s:"A"},{t:B,s:"B"}].forEach(function(x,ix){
    if(ix===1)h+='<div class="tl-x">×</div>';
    var serving=st.serve&&st.serve.side===x.s;
    h+='<div class="tl-team">';
    h+='<div class="crest xl" style="background:'+esc(x.t.cor)+';--c:'+esc(x.t.cor)+';margin:0 auto 12px">'+esc(initials(x.t.n))+'</div>';
    h+='<div class="tl-nm">'+esc(x.t.n)+(serving?' <span style="font-size:.5em">🏐</span>':'')+'</div>';
    h+='<div class="tl-pt" style="color:'+esc(x.t.cor)+';--c:'+esc(x.t.cor)+'">'+st.pts[x.s]+'</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="tl-bot">';
  /* classificacao resumida */
  var S=coresStandings(gamesArr(),teamsArr(),D.events,D.config);
  h+='<div><div class="hd-sub" style="margin-bottom:8px">CLASSIFICAÇÃO</div><table class="tb"><tbody>';
  S.slice(0,6).forEach(function(r){
    h+='<tr><td class="faint">'+r.pos+'</td><td class="nm"><span style="display:inline-flex;align-items:center;gap:8px">';
    h+='<span class="dot" style="background:'+esc(r.cor)+'"></span>'+esc(r.n)+'</span></td>';
    h+='<td>'+r.v+'V</td><td class="faint">'+(r.saldo>0?"+":"")+r.saldo+'</td>';
    h+='<td style="font-weight:800">'+r.pts+'</td></tr>';
  });
  h+='</tbody></table></div>';
  /* proximos */
  var prox=gs.filter(function(g){return g.st!=="finalizada"&&g.id!==live.id;}).slice(0,4);
  h+='<div><div class="hd-sub" style="margin-bottom:8px">PRÓXIMOS JOGOS</div>';
  if(!prox.length)h+='<div class="faint">—</div>';
  prox.forEach(function(g){
    var a=tF(g.a),b=tF(g.b);if(!a||!b)return;
    h+='<div style="display:flex;align-items:center;gap:9px;padding:5px 0;font-weight:700">';
    h+='<span class="dot" style="background:'+esc(a.cor)+'"></span>'+esc(a.n);
    h+='<span class="faint">×</span><span class="dot" style="background:'+esc(b.cor)+'"></span>'+esc(b.n);
    h+='<span class="faint" style="margin-left:auto;font-size:11px">'+(g.tm||fD(g.dt))+'</span></div>';
  });
  h+='</div></div></div>';
  return h;
}

/* FASE FINAL — o formato e escolhido na hora, com a classificacao na tela.
   Nada e decidido antes: da para gerar, apagar e gerar de novo. */
function rAdminFaseFinal(){
  var ts=teamsArr();
  if(ts.length<2)return "";
  var todos=gamesArr();
  var classif=todos.filter(function(g){return coresFase(g)==="class";});
  if(!classif.length)return "";
  var mata=todos.filter(function(g){return coresFase(g)!=="class";});
  var pendentes=classif.filter(function(g){return g.st!=="finalizada"&&!calc(g).done;});
  var S=coresStandings(todos,ts,D.events,D.config);
  var comJogo=S.filter(function(r){return r.j>0;});

  var h='<h2 class="sec">FASE FINAL<span class="sec-sub">depois da classificatória</span></h2>';

  if(mata.length){
    h+='<div class="card"><div class="row" style="align-items:flex-start">';
    h+='<div style="flex:1;min-width:220px"><b>Fase final já criada</b><div class="faint" style="font-size:12px;margin-top:6px;line-height:1.6">';
    mata.forEach(function(g){
      var gr=gRes(g.id)||g;
      h+='· '+esc(CORES_FASES[coresFase(g)].l)+': '+esc(coresLadoLabel(gr,"A",D.teams))+' × '+esc(coresLadoLabel(gr,"B",D.teams))+'<br>';
    });
    h+='</div></div>';
    h+='<button class="btn dgr" onclick="apagarFaseFinal()">Apagar e refazer</button>';
    h+='</div></div>';
    return h;
  }

  h+='<div class="card">';
  if(pendentes.length){
    h+='<div class="banner err" style="margin:0 0 14px"><b>Ainda faltam '+pendentes.length+' jogo(s) da classificatória.</b> ';
    h+='Dá para gerar assim mesmo, mas o chaveamento sai pela classificação de agora — o certo é gerar depois que todos terminarem.</div>';
  }
  h+='<div class="faint" style="font-size:11px;font-weight:800;letter-spacing:1.2px;margin-bottom:8px">CLASSIFICAÇÃO DE AGORA</div>';
  h+='<div class="pool" style="margin-bottom:14px">';
  S.forEach(function(r,i){
    h+='<span class="poolp" style="cursor:default"><span class="poolp-nu" style="background:'+esc(r.cor)+';--c:'+esc(r.cor)+'">'+(i+1)+'</span>'+esc(r.n)+' <span class="faint">'+r.pts+' pts</span></span>';
  });
  h+='</div>';

  if(comJogo.length<2){
    h+='<div class="faint">Nenhum jogo encerrado ainda — a classificação precisa de resultados para montar o chaveamento.</div></div>';
    return h;
  }
  h+='<div class="faint" style="font-size:11px;font-weight:800;letter-spacing:1.2px;margin-bottom:8px">COMO VAI SER?</div>';
  h+='<div class="fasegrid">';
  h+='<button class="faseopt" onclick="gerarFaseFinal(\'final\',false)">'
    +'<b>Final direta</b><span>1º × 2º · um jogo só</span>'
    +'<i>'+esc(S[0]?S[0].n:"1º")+' × '+esc(S[1]?S[1].n:"2º")+'</i></button>';
  var pode4=(ts.length>=4&&S.length>=4&&comJogo.length>=4);
  h+='<button class="faseopt'+(pode4?"":" off")+'"'+(pode4?' onclick="gerarFaseFinal(\'semi\',false)"':' disabled')+'>'
    +'<b>Semifinais + final</b><span>1º×4º e 2º×3º</span>'
    +'<i>'+(pode4?esc(S[0].n)+' × '+esc(S[3].n)+' · '+esc(S[1].n)+' × '+esc(S[2].n):"precisa de 4 equipes com jogo")+'</i></button>';
  h+='<button class="faseopt'+(pode4?"":" off")+'"'+(pode4?' onclick="gerarFaseFinal(\'semi\',true)"':' disabled')+'>'
    +'<b>Semifinais + 3º lugar + final</b><span>com disputa de terceiro</span>'
    +'<i>'+(pode4?"4 jogos":"precisa de 4 equipes com jogo")+'</i></button>';
  h+='</div>';
  h+='<div class="faint" style="font-size:11px;margin-top:12px;line-height:1.6">A final nasce como “vencedor da semifinal 1 × vencedor da semifinal 2” e as equipes entram sozinhas quando as semis terminarem. Jogos de fase final <b>não</b> entram na tabela de classificação.</div>';
  h+='</div>';
  return h;
}
function gerarFaseFinal(modo,com3o){
  var ts=teamsArr();
  var S=coresStandings(gamesArr(),ts,D.events,D.config);
  var hoje=(new Date()).toISOString().slice(0,10);
  var jogos=coresBracket(S,modo,com3o,{dt:hoje,prefixo:"f_"+Date.now().toString(36)});
  if(!jogos.length){toast("Não deu para montar — faltam equipes classificadas","err");return;}
  var nomes=jogos.map(function(g){return CORES_FASES[g.fase].l;}).join(", ");
  if(!confirm("Criar "+jogos.length+" jogo(s): "+nomes+"?"))return;
  var falta=jogos.length;
  jogos.forEach(function(g){
    writeNode("games/"+g.id,g).then(function(){
      falta--; if(falta===0)toast("Fase final criada","ok");
    });
  });
}
function apagarFaseFinal(){
  var mata=gamesArr().filter(function(g){return coresFase(g)!=="class";});
  if(!mata.length)return;
  if(!confirm("Apagar os "+mata.length+" jogo(s) da fase final e tudo que foi marcado neles?"))return;
  mata.forEach(function(g){
    db.ref(ROOT+"/events/"+g.id).remove().catch(function(){});
    db.ref(ROOT+"/games/"+g.id).remove().catch(onWriteErr);
  });
  toast("Fase final apagada","ok");
}
function val(id){var e=document.getElementById(id);return e?e.value:"";}
function salvarConfig(){
  var c={nome:val("cf-n"),setPoints:+val("cf-sp")||21,vantagem:+val("cf-va"),
    emQuadra:+val("cf-eq")||4,ptsVitoria:+val("cf-pv"),ptsDerrota:+val("cf-pd"),
    dedupeMs:Math.round((parseFloat(val("cf-dd"))||0)*1000)};
  if(isNaN(c.vantagem))c.vantagem=2;
  writeNode("config",c).then(function(){toast("Configuração salva","ok");});
}
function novaEquipe(){
  var n=(val("nt-n")||"").trim(),c=val("nt-c")||"#2563eb";
  if(!n){toast("Informe o nome da equipe","err");return;}
  var id=uid("c_");
  writeNode("teams/"+id,{id:id,n:n.toUpperCase(),cor:c,ordem:teamsArr().length,players:[]})
    .then(function(){toast("Equipe criada","ok");var e=document.getElementById("nt-n");if(e)e.value="";});
}
function editEquipe(tid,campo,v){
  var t=tF(tid);if(!t)return;
  writeNode("teams/"+tid+"/"+campo,campo==="n"?String(v).toUpperCase():v);
}
function delEquipe(tid){
  var t=tF(tid);if(!t)return;
  var usada=gamesArr().some(function(g){return g.a===tid||g.b===tid;});
  if(usada){toast("Equipe está em um jogo — exclua o jogo antes","err");return;}
  if(!confirm("Excluir a equipe "+t.n+"?"))return;
  db.ref(ROOT+"/teams/"+tid).remove().catch(onWriteErr);
}
function addPlayer(tid){
  var t=tF(tid);if(!t)return;
  var el=document.getElementById("np-"+tid);
  var nm=(el&&el.value||"").trim();
  if(!nm){toast("Informe o nome","err");return;}
  var ps=playersOf(t).slice();
  ps.push({id:uid("p_"),nm:nm.toUpperCase(),nu:""});
  writeNode("teams/"+tid+"/players",ps).then(function(){if(el)el.value="";});
}
function editPlayer(tid,jid,campo,v){
  var t=tF(tid);if(!t)return;
  var ps=playersOf(t).slice();
  for(var i=0;i<ps.length;i++)if(ps[i].id===jid)ps[i][campo]=(campo==="nm"?String(v).toUpperCase():v);
  writeNode("teams/"+tid+"/players",ps);
}
function movePlayer(tid,jid,dir){
  var t=tF(tid);if(!t)return;
  var ps=playersOf(t).slice();
  var i=-1;for(var k=0;k<ps.length;k++)if(ps[k].id===jid){i=k;break;}
  var j=i+dir;
  if(i<0||j<0||j>=ps.length)return;
  var tmp=ps[i];ps[i]=ps[j];ps[j]=tmp;
  writeNode("teams/"+tid+"/players",ps);
}
function delPlayer(tid,jid){
  var t=tF(tid);if(!t)return;
  var ps=playersOf(t).filter(function(p){return p.id!==jid;});
  writeNode("teams/"+tid+"/players",ps);
}
function novoJogo(){
  var a=val("ng-a"),b=val("ng-b");
  if(!a||!b||a===b){toast("Escolha duas equipes diferentes","err");return;}
  var id=uid("j_");
  writeNode("games/"+id,{id:id,a:a,b:b,dt:val("ng-dt")||"",tm:val("ng-tm")||"",st:"agendada"})
    .then(function(){toast("Jogo criado","ok");});
}
function delJogo(gid){
  if(!confirm("Excluir o jogo e todas as ações marcadas nele?"))return;
  db.ref(ROOT+"/events/"+gid).remove().catch(function(){});
  db.ref(ROOT+"/games/"+gid).remove().catch(onWriteErr);
}

/* ---------- start ---------- */
render();
boot();
setInterval(function(){if(VIEW==="telao")render();},5000);
</script>
</body>
